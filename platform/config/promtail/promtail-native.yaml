server:
  http_listen_port: 9080
  grpc_listen_port: 0
  # #4994 AC2: warn, not info — at info every create in a watched folder (~/.chorus lock and
  # tmp churn) wrote a "received file watcher event" line; promtail.log reached 1.72 GB
  log_level: warn

positions:
  # #4994 AC2: out of every watched folder. In Library/Logs/Gathering (tailed by the
  # daemon-logs glob) each 10 s positions write woke promtail's own watcher. ~/.chorus/state
  # is a subfolder; promtail watches folders one level deep, never their subfolders.
  filename: /Users/jeffbridwell/.chorus/state/promtail-positions.yaml

clients:
  - url: http://localhost:3102/loki/api/v1/push
    tenant_id: default
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s

scrape_configs:
  # All Chorus daemon logs — glob catches every .log in the directory
  # __path_exclude__ prevents duplicates with dedicated scrape jobs (#1986)
  # #2824: extended to scrape *.err alongside *.log so launchd-redirected stderr
  # streams (com.chorus.foo.err pattern) are queryable in Loki. Same job/label
  # scheme; separate target stanzas because Promtail allows one __path__ per
  # labels block.
  - job_name: chorus-daemon-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: daemon-logs
          __path__: /Users/jeffbridwell/Library/Logs/Chorus/*.log
          # #4994: each file below has its own job; the glob must not tail it too
          __path_exclude__: /Users/jeffbridwell/Library/Logs/Chorus/{alert-delivery-test.log,alert-notifier.log,alert-runner.log,bridge-subscriber-kade.log,bridge-subscriber-silas.log,bridge-subscriber-wren.log,chorus-api.log,chorus-bridge.log,chorus-hooks.log,chorus-ops.log,chorus.log,clearing-probe-stderr.log,clearing-probe-stdout.log,context-cache-5min.log,context-cache-daily.log,context-cache-hourly.log,crawler-index.log,cruft-scan.log,deep-health.log,fuseki-compact.log,jeff-input-monitor.log,launchagent-metrics.log,nudge-health.log,perf-baseline-nightly.log,posture-capture.log,session-health.log,watchdog.log}
      - targets:
          - localhost
        labels:
          job: daemon-logs
          __path__: /Users/jeffbridwell/Library/Logs/Chorus/*.err
          # #4994: each file below has its own job; the glob must not tail it too
          __path_exclude__: /Users/jeffbridwell/Library/Logs/Chorus/{context-cache-5min.err,context-cache-daily.err,session-health.err}
    pipeline_stages:
      - regex:
          expression: '^(?P<content>.+)$'
      - output:
          source: content

  # #4994 (Jeff 17:25 via Wren): dagu's run and step logs are NOT tailed. Jeff wants to use
  # dagu more, so its run count must never drive promtail's load (9,295 files held open on
  # 11-17). The logs stay on disk under ~/Library/Logs/Chorus/dagu (log-archive moves runs
  # older than 3 days); step results reach the spine. Nothing queried job="dagu" in Loki.
  # dagu's own process log (~/Library/Logs/Chorus/dagu.log) is still tailed by daemon-logs.

  # All Gathering daemon logs
  # __path_exclude__ prevents duplicates with dedicated scrape jobs (#1986)
  - job_name: gathering-daemon-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: daemon-logs
          __path__: /Users/jeffbridwell/Library/Logs/Gathering/*.log
          # 2026-10-21 (Jeff go, Silas+Kade load review): loki.log and promtail.log excluded —
          # Loki logged every query into a file promtail shipped back into Loki (11.9 GB in 26 h
          # vs 1.9 GB of real logs). Their health is read from /metrics, not their own log.
          # #4994: each file below has its own job; the glob must not tail it too
          __path_exclude__: /Users/jeffbridwell/Library/Logs/Gathering/{bedroom-health.log,cloudflared.log,daily-review-ops.log,daily-review-quality.log,daily-review-summary.log,daily-signal-scan.log,gathering-app.log,heartbeat.log,loki.log,perf-baseline.log,promtail.log,seed-probe.log,standards-surface.log,tm-thin.log,vikunja.log}
    pipeline_stages:
      - regex:
          expression: '^(?P<content>.+)$'
      - output:
          source: content

  # The live ~/.chorus daemon logs that have no job of their own
  # #4994 AC2: named files, never *.log — ~/.chorus is runtime state, and a wildcard tailed any
  # new .log there. chorus.log (the spine, platform-chorus-log job), embed-worker.log and
  # watcher.log have their own jobs. Note: promtail 2.9.2 still watches ~/.chorus itself (it
  # watches each tailed file's folder, measured 11-17), so lock/tmp churn still raises watcher
  # events; log_level warn above keeps them out of promtail.log.
  - job_name: chorus-home-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: daemon-logs
          __path__: /Users/jeffbridwell/.chorus/{heartbeat-probe.log,heartbeat-probe.stderr.log,reindex-worker.log}
    pipeline_stages:
      - regex:
          expression: '^(?P<content>.+)$'
      - output:
          source: content

  # Platform operational logs
  - job_name: platform-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: platform-logs
          __path__: /Users/jeffbridwell/CascadeProjects/chorus/platform/logs/*.log
          # #4994: each file below has its own job; the glob must not tail it too
          __path_exclude__: /Users/jeffbridwell/CascadeProjects/chorus/platform/logs/{command-errors.log,permission-prompts.log}
      # #4994: the proving/logs/*.log target is gone — its only .log files (chorus, handoffs,
      # permission-prompts) each have their own proving-* job
    pipeline_stages:
      - regex:
          expression: '^(?P<content>.+)$'
      - output:
          source: content

  # Werk verb witness — ADR-032 §6 "Borg/Loki ingest downstream".
  # The v2 werk verbs (pull/commit/build/deploy/push/demo/accept) write a
  # best-effort per-step JSONL witness to $CHORUS_HOME/ops/logs/werk-<verb>.jsonl
  # (zero-dep by design: the verbs NEVER call chorus-log). This stanza IS the
  # downstream ingest the ADR specced and that was never wired — #3119. One
  # stable canonical path (home=CHORUS_HOME), not ephemeral werk dirs.
  # Query: {job="werk-verbs"} | json   then filter event=, role=, card_id=, trace_id=.
  - job_name: werk-verbs
    static_configs:
      - targets:
          - localhost
        labels:
          job: werk-verbs
          __path__: /Users/jeffbridwell/CascadeProjects/chorus/ops/logs/*.jsonl
    pipeline_stages:
      - regex:
          expression: '^(?P<content>.+)$'
      - output:
          source: content

  # Performance baseline
  - job_name: perf-baseline
    static_configs:
      - targets:
          - localhost
        labels:
          job: perf-baseline
          __path__: /Users/jeffbridwell/Library/Logs/Gathering/perf-baseline.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            function: function
            durationMs: durationMs
            status: status
            detail: detail
      - labels:
          function:
          status:
      - timestamp:
          source: timestamp
          format: '2006-01-02T15:04:05.000Z'

