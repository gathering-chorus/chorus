  # Chorus spine event log. Producer is chorus-hook-shim writing to ~/.chorus/
  # (CSC: Runtime Artifacts). Was platform/logs/chorus.log in the working tree
  # until 2026-05-04 when branch checkouts started clobbering unstaged writes;
  # producer + tail both moved out of the repo to runtime-artifact convention.
  - job_name: platform-chorus-log
    static_configs:
      - targets: [localhost]
        labels:
          job: platform-chorus
          __path__: /Users/jeffbridwell/.chorus/chorus.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            appName: appName
            component: component
            role: role
            message: message
      - labels:
          level:
          appName:
          component:
          role:
      - timestamp:
          source: timestamp
          format: '2006-01-02T15:04:05.000Z'
      # #4454 — no `output: source: message` here. It replaced every event that
      # carries a message (every *.failed one) with the sentence alone, so Loki
      # lost its event, card and trace: 10,122 nightly case events, 0 found by
      # `| json`. The line stays the whole JSON event; the message is a field.
      # Guarded by chorus platform/tests/4454-spine-json-in-loki.bats.

  - job_name: platform-command-errors
    static_configs:
