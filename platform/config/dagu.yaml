# #4465 — dagu, the product orchestration layer (ADR-062). Runs the workflows
# chorus-make generates from the graph. Owned by Silas (ops).
#
# Loopback only. auth.mode is set explicitly to "none": nothing off this machine
# can reach 127.0.0.1:8526, and every caller on it is already an agent or Jeff
# running as this account. When real per-agent identity lands (the authn work),
# this becomes "builtin" with tokens. platform/tests/4465-dagu-launchd.bats
# fails if host is anything but 127.0.0.1 while auth.mode is none.
host: 127.0.0.1
port: 8526
tz: America/New_York
dags_dir: /Users/jeffbridwell/CascadeProjects/chorus/platform/pipelines
data_dir: /Users/jeffbridwell/.chorus/dagu/data
# ADR-023: logs live under ~/Library/Logs/Chorus where Promtail reads them
# (#4474: step output sat in ~/.chorus/dagu/logs, invisible to Loki), and dagu's
# own lines are JSON so Loki can parse them.
log_dir: /Users/jeffbridwell/Library/Logs/Chorus/dagu
log_format: json
auth:
  mode: none

# #4494 — two queues. A card's run (commit through demo) goes on `werk`, three
# at once, so each role's card tests without waiting on another's. The land
# (merge, sync, deploy to canonical, accept) goes on `werk-land`, one at a
# time across every card, because those steps write main and prod. Proven on
# a scratch dagu 2026-10-10 by Kade: 3 builds ran at once, lands ran in turn.
# A land must be ENQUEUED on werk-land, not called as a sub-run: a sub-run
# ignores its queue and two lands overlapped.
queues:
  enabled: true
  config:
    - name: werk
      max_concurrency: 3
    - name: werk-land
      max_concurrency: 1
