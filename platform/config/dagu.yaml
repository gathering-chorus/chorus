# #4465 — dagu, the product orchestration layer (ADR-062). Runs the workflows
# chorus-make generates from the graph. Owned by Silas (ops).
#
# Loopback only. auth.mode is set explicitly to "none": nothing off this machine
# can reach 127.0.0.1:8526, and every caller on it is already an agent or Jeff
# running as this account. When real per-agent identity lands (the authn work),
# this becomes "builtin" with tokens. platform/tests/4465-dagu-launchd.bats
# fails if host is anything but 127.0.0.1 while auth.mode is none.
host: 127.0.0.1
port: 8526
tz: America/New_York
dags_dir: /Users/jeffbridwell/CascadeProjects/chorus/platform/pipelines
data_dir: /Users/jeffbridwell/.chorus/dagu/data
# ADR-023: logs live under ~/Library/Logs/Chorus where Promtail reads them
# (#4474: step output sat in ~/.chorus/dagu/logs, invisible to Loki), and dagu's
# own lines are JSON so Loki can parse them.
log_dir: /Users/jeffbridwell/Library/Logs/Chorus/dagu
log_format: json
auth:
  mode: none

# #4494 — two queues. A card's run (commit through demo) goes on `werk`, three
# at once, so each role's card tests without waiting on another's. The land
# (merge, sync, deploy to canonical, accept) goes on `werk-land`, one at a
# time across every card, because those steps write main and prod. Proven on
# a scratch dagu 2026-10-10 by Kade: 3 builds ran at once, lands ran in turn.
# A land must be ENQUEUED on werk-land, not called as a sub-run: a sub-run
# ignores its queue and two lands overlapped.
# Jeff 2026-10-11 09:06: two card runs at once, one land (load 28 with three).
# #4675 — Jeff 2026-10-21 11:05 "if we do 1 in dagu that is real bottleneck - im
# willing to try it" ("tortoise and hare"): one card run at a time. Measured that
# morning: load 17 with one test run, 40 with two, 0% idle, swap to 12.8 GB.
queues:
  enabled: true
  config:
    - name: werk
      max_concurrency: 1
    - name: werk-land
      max_concurrency: 1
    # #4515 — the model land (athena-land, generated by chorus-make), one at a
    # time. Not werk-land: a werk land's success handler (scripts/athena-land)
    # enqueues it and waits for its result, so on werk-land it would queue
    # behind the very land that is waiting for it.
    - name: athena-land
      max_concurrency: 1
    # #4540 — the nightly dag (made by chorus-make, scheduled 03:00), one at a
    # time: it replaces werk-test's single-flight lock. The queue sits on the
    # nightly dag itself, because a sub-run ignores its queue (#4494).
    # Measured 2026-10-16 on a scratch dagu 2.18.2: `max_active_runs: 1` did
    # not stop a second `dagu start`, so the scheduler enqueues here.
    - name: nightly
      max_concurrency: 1
    # #4577 — pairs (made by chorus-make). A pair run spends most of its life
    # waiting on its navigator's green, so several run at once; its tests run
    # as a cicd-test sub-run and its hand-off is enqueued on werk.
    - name: pair
      max_concurrency: 4
    # #4654 — a card's pull and its coding (made by chorus-make). A card run
    # spends hours waiting on its role's "done", so every WIP card can hold
    # one; its hand-off starts the card's athena or cicd run on their queues.
    - name: card
      max_concurrency: 8
