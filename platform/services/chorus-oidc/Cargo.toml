[package]
name = "chorus-oidc"
version = "0.1.0"
edition = "2021"

# #3356 — the ONE CSS-token verifier (ES256/JWKS) + HS256 legacy, extracted from
# athena-make so the DAL (chorus-model) and athena-make's door share it. No competing impl.
# Near-zero deps (ADR-032 §1): the vetted RustCrypto primitives only.
[dependencies]
hmac = "0.12"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }

[lib]
name = "chorus_oidc"
path = "src/lib.rs"
