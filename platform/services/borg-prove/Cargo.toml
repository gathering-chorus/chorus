[package]
name = "borg-prove"
version = "0.1.0"
edition = "2021"

# #4456 — Proving's verb: runs a card's CardAC check rows against the running
# system and writes the verdict; routes a failed step to the step its onFail
# names. Zero-dep (ADR-032 §1): std only; curl is a subprocess. Card text is
# never executed: a check is a typed row (kind, target, expect), not a command.
[dependencies]
serde_json = "1"

[[bin]]
name = "borg-prove"
path = "src/main.rs"
