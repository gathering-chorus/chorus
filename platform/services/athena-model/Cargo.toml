[package]
name = "athena-model"
version = "0.1.0"
edition = "2021"

# The governed RDF/OWL writer (#3257, model-2) — the ONLY sanctioned write path
# to the model store. Near-zero dependencies (ADR-032 §1): std only, save the one
# below; Fuseki via `curl` subprocess; chorus-log via subprocess. Implements
# ADR-040 Rule 0: callers pass (kind, name, fields) — the DAL mints the IRI; a
# non-conformant IRI is unwritable by construction.
[dependencies]
# #3356 — the shared CSS-token verifier (ES256/JWKS). ONE verifier backs both the
# athena-make door and this DAL — no second crypto implementation (the extraction's
# whole purpose). Pulls the crypto (p256/sha2/hmac) transitively; nothing else.
chorus-oidc = { path = "../chorus-oidc" }

# Phase A1 — `athena-model add-batch` accepts typed NDJSON records on stdin.
# Derive-backed decoding is deliberate here: unknown fields, wrong JSON types,
# malformed escaping, and trailing input are refused by one maintained parser
# instead of a hand-rolled protocol at the governed write boundary.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# #3718 — RENAMED chorus-model -> athena-model (Jeff, 2026-07-31): "i feel we
# rename chorus-model to athena-model - to me the model part is a strong analog
# to coding - why i mention werk-code". werk-* is the governed writer for CODE;
# athena-model is the governed writer for the MODEL. The name carries the product
# it serves — the model is Athena's.
[[bin]]
name = "athena-model"
path = "src/main.rs"

[lib]
name = "athena_model"
path = "src/lib.rs"

# #3718 — the old name survives ONLY as a fail-loud stub, never as an alias.
# A silent alias lets callers drift indefinitely; a stub that exits non-zero
# with the new name in the message migrates them once. Same treatment the bash
# `nudge` got when it was retired (#2804).
[[bin]]
name = "chorus-model"
path = "src/bin/chorus_model_retired.rs"
