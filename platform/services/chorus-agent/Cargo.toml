[package]
name = "chorus-agent"
version = "0.1.0"
edition = "2021"
description = "Runtime-independent Chorus session supervisor and bounded job runner"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"
libc = "0.2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonschema = { version = "0.33", default-features = false }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "chorus-agent"
path = "src/main.rs"

[[bin]]
name = "chorus-agentd"
path = "src/daemon.rs"
