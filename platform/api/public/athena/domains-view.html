<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domains — Chorus model</title>
<!--
  #3724 — ONE template, three levels, all 40 domains.

    /domains                        the catalog
    /domains/<domain>               that domain's vocabulary + instances
    /domains/<domain>/<instance>    one instance, its edges walkable

  There is no per-domain code. The page reads its own path, asks the model what
  that domain defines, and renders whatever comes back. Adding a domain to the
  model adds its pages — that is the AC, and it is why this is a template and
  not forty files.

  ALL FETCHES ARE SAME-ORIGIN (/owl/...). A hardcoded localhost:3360 is what
  broke the LAN view on 2026-08-02 — the page loaded fine and every fetch failed,
  which reads as "the server is down" from the couch. Never reintroduce it.
-->
<style>
  :root {
    --ink: #14161a;
    --ink-soft: #565c66;
    --ink-faint: #878d97;
    --ground: #fbfaf8;
    --panel: #ffffff;
    --rule: #e4e2dd;
    --accent: #1f5f4f;
    --accent-soft: #e8f0ed;
    --warn: #8a5a00;
    --warn-soft: #fdf3e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8e6e1; --ink-soft: #a6aab2; --ink-faint: #767b84;
      --ground: #15171a; --panel: #1c1f23; --rule: #2c3037;
      --accent: #6fc0a6; --accent-soft: #1b2b27;
      --warn: #e0aa5a; --warn-soft: #2a2318;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e8e6e1; --ink-soft: #a6aab2; --ink-faint: #767b84;
    --ground: #15171a; --panel: #1c1f23; --rule: #2c3037;
    --accent: #6fc0a6; --accent-soft: #1b2b27;
    --warn: #e0aa5a; --warn-soft: #2a2318;
  }
  :root[data-theme="light"] {
    --ink: #14161a; --ink-soft: #565c66; --ink-faint: #878d97;
    --ground: #fbfaf8; --panel: #ffffff; --rule: #e4e2dd;
    --accent: #1f5f4f; --accent-soft: #e8f0ed;
    --warn: #8a5a00; --warn-soft: #fdf3e0;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 62rem; margin: 0 auto; padding: 2rem 1.25rem 5rem; }

  nav.crumbs { font-size: .8125rem; letter-spacing: .02em; margin-bottom: .75rem; }
  nav.crumbs a { color: var(--accent); text-decoration: none; }
  nav.crumbs a:hover { text-decoration: underline; }
  nav.crumbs span { color: var(--ink-faint); }

  h1 { font-size: 1.9rem; line-height: 1.15; margin: 0 0 .35rem; text-wrap: balance; }
  h1 code { font: inherit; }
  .sub { color: var(--ink-soft); margin: 0 0 1.75rem; max-width: 46rem; }

  .kind {
    display: inline-block; font-size: .6875rem; text-transform: uppercase;
    letter-spacing: .09em; padding: .2rem .5rem; border-radius: 3px;
    background: var(--accent-soft); color: var(--accent); vertical-align: .28em;
    margin-left: .6rem; font-weight: 600;
  }

  .grid { display: grid; gap: .625rem; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
  .card {
    display: block; padding: .8rem .9rem; background: var(--panel);
    border: 1px solid var(--rule); border-radius: 6px;
    text-decoration: none; color: inherit;
  }
  .card:hover { border-color: var(--accent); }
  .card .n { font-weight: 600; display: block; }
  .card .m { color: var(--ink-faint); font-size: .8125rem; display: block; margin-top: .15rem; }

  table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
  .scroll { overflow-x: auto; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-weight: 600; }
  td.k { color: var(--ink-soft); white-space: nowrap; width: 1%; }
  a.ref { color: var(--accent); text-decoration: none; }
  a.ref:hover { text-decoration: underline; }

  h2 { font-size: .8125rem; text-transform: uppercase; letter-spacing: .08em;
       color: var(--ink-faint); margin: 2.25rem 0 .7rem; font-weight: 600; }

  .note {
    background: var(--warn-soft); border-left: 3px solid var(--warn);
    padding: .8rem .95rem; border-radius: 0 4px 4px 0; color: var(--ink);
    font-size: .9375rem;
  }
  .note strong { color: var(--warn); }
  .empty { color: var(--ink-soft); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .875em; }

  /* #3724 — the OWL escape hatch. Jeff: "i want to be able to see the owl for
     each domain." Every other view here is a PROJECTION of the model; this is
     the model in its own notation. When a rendering looks wrong, you read the
     triples instead of trusting the renderer. */
  .prosek { margin: 1.4rem 0 0.3rem; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted, #667); }
  .prose { margin: 0 0 0.6rem; max-width: 46rem; line-height: 1.55; }
  .insthead { margin-top: 2.2rem; }
  details.owl { margin-top: 2rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); }
  details.owl > summary {
    cursor: pointer; padding: .7rem .9rem; font-size: .8125rem; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint);
    list-style: none;
  }
  details.owl > summary::-webkit-details-marker { display: none; }
  details.owl > summary::before { content: "▸ "; color: var(--accent); }
  details.owl[open] > summary::before { content: "▾ "; }
  details.owl > summary:hover { color: var(--accent); }
  /* the model as a table schema — the readable form of the same triples */
  .schema { margin-top: 2rem; }
  .schema h3 {
    font-size: 1rem; margin: 1.4rem 0 .5rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .schema table td.req { color: var(--accent); font-weight: 600; }
  .schema table td.opt { color: var(--ink-faint); }
  .src {
    font-size: .6875rem; letter-spacing: .05em; text-transform: uppercase;
    padding: .1rem .35rem; border-radius: 3px; font-weight: 600;
  }
  .src-both { background: var(--accent-soft); color: var(--accent); }
  .src-shape, .src-ontology { background: var(--warn-soft); color: var(--warn); }

  details.owl pre {
    margin: 0; padding: .9rem; border-top: 1px solid var(--rule);
    overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .8125rem; line-height: 1.5; white-space: pre;
  }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading the model…</p></div>

<script>
const OWL = '/owl';
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// The path IS the query. No ?d= — an AC item, and the reason is that Jeff
// pastes these to his phone.
const seg = location.pathname.replace(/^\/domains\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);

async function get(p) {
  const r = await fetch(OWL + p, { headers: { Accept: 'application/json' } });
  if (!r.ok) throw new Error(p + ' → HTTP ' + r.status);
  return r.json();
}

function crumbs(parts) {
  const out = ['<a href="/domains">domains</a>'];
  let acc = '/domains';
  parts.forEach((p, i) => {
    acc += '/' + encodeURIComponent(p);
    out.push(i === parts.length - 1
      ? '<span>' + esc(p) + '</span>'
      : '<a href="' + acc + '">' + esc(p) + '</a>');
  });
  return '<nav class="crumbs">' + out.join(' <span>/</span> ') + '</nav>';
}

// kind → collection path, from the model's own discovery document. Never a
// hardcoded map: a hardcoded one goes stale silently the first time a kind is
// added, which is the whole failure mode this card exists to stop.
let _disc = null;
async function collectionFor(kind) {
  _disc ??= await get('/');
  const hit = (_disc.primitives || []).find(p => p.kind === kind);
  return hit ? hit.collection : null;
}

function fail(e) {
  app.innerHTML = crumbs(seg) +
    '<h1>Could not read the model</h1>' +
    '<div class="note"><strong>' + esc(e.message) + '</strong><br>' +
    'This page only ever fetches same-origin <code>/owl/…</code>. A failure here means ' +
    'owl-api is unreachable <em>through the proxy</em> — not that this domain is empty. ' +
    'The difference matters: an empty render would be a fabricated answer.</div>';
}

async function renderCatalog() {
  const d = await get('/domains');
  const rows = (d.data || []).slice().sort((a, b) => a.name.localeCompare(b.name));
  app.innerHTML = crumbs([]) +
    '<h1>Domains<span class="kind">' + rows.length + ' live</span></h1>' +
    '<p class="sub">Every domain in the model, generated from <code>' +
      esc(d.generatedFrom?.graph || 'the model') + '</code>. A domain owns the vocabulary it is about — ' +
      '<code>products</code> is a domain whose vocabulary is <code>Product</code>, which is why ' +
      '<code>/domains/products</code> is the right shape and not a nesting mistake.</p>' +
    '<div class="grid">' + rows.map(r => {
      const v = [].concat(r.definesVocabulary || []).filter(Boolean);
      return '<a class="card" href="/domains/' + encodeURIComponent(r.name) + '">' +
        '<span class="n">' + esc(r.name) + '</span>' +
        '<span class="m">' + (v.length ? esc(v.join(', ')) : 'declares no vocabulary') + '</span></a>';
    }).join('') + '</div>';
}

async function renderDomain(name) {
  const d = await get('/domains');
  const dom = (d.data || []).find(r => r.name === name);
  if (!dom) {
    app.innerHTML = crumbs([name]) + '<h1>' + esc(name) + '</h1>' +
      '<div class="note"><strong>No such domain in the model.</strong> ' +
      'The catalog at <a class="ref" href="/domains">/domains</a> is the live list.</div>';
    return;
  }
  const vocab = [].concat(dom.definesVocabulary || []).filter(Boolean);
  let head = crumbs([name]) +
    '<h1>' + esc(name) + '</h1>' +
    '<p class="sub">' + (dom.comment ? esc(dom.comment) : '<span class="empty">No comment in the model.</span>') + '</p>';

  // An honest empty state that names the reason — AC item. There are three
  // different reasons a domain shows nothing, and collapsing them into one
  // blank list is the exact failure this whole week has been about.
  if (!vocab.length) {
    app.innerHTML = head +
      '<div class="note"><strong>This domain declares no vocabulary.</strong> ' +
      'That is a fact about the model, not an empty page: with no <code>definesVocabulary</code> ' +
      'edge there is no class to list instances of. 16 of 40 domains are in this state ' +
      '(measured 2026-08-02), so the missing edge — not the missing data — is the thing to fix.</div>';
    return;
  }

  const sections = [];
  for (const kind of vocab) {
    const coll = await collectionFor(kind);
    if (!coll) {
      sections.push('<h2>' + esc(kind) + '</h2><div class="note"><strong>Not served.</strong> ' +
        '<code>' + esc(kind) + '</code> is declared as this domain\'s vocabulary but no collection ' +
        'is generated for it — it has no shape, so the API cannot serve it. 96 of 117 classes ' +
        'are in this state.</div>');
      continue;
    }
    let body;
    try {
      const r = await get(coll.replace(/^\/v1/, ''));
      const items = (r.data || []).slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
      body = items.length
        ? '<div class="grid">' + items.map(i =>
            '<a class="card" href="/domains/' + encodeURIComponent(name) + '/' + encodeURIComponent(i.name) + '">' +
            '<span class="n">' + esc(i.label || i.name) + '</span>' +
            '<span class="m">' + esc(i.name) + '</span></a>').join('') + '</div>'
        : '<div class="note"><strong>Served, but zero instances live.</strong> ' +
          'The collection exists and answered — the model genuinely holds none of these. ' +
          'That is different from unreachable and different from unserved.</div>';
    } catch (e) {
      body = '<div class="note"><strong>' + esc(e.message) + '</strong> — could not read this collection. ' +
             'Reported rather than rendered as empty.</div>';
    }
    sections.push('<h2>' + esc(kind) + '</h2>' + body);
  }
  // #3749 UX (Jeff): STRUCTURE FIRST — the schema is the map, the instances
  // are what it organizes. Order: schema → the OWL itself → instances.
  app.innerHTML = head +
    '<div class="schema" id="schemabox"><h2>Schema — what the model says each class has</h2>' +
    '<p class="empty">Reading the model…</p></div>' +
    owlBlock(name) +
    '<h2 class="insthead">Instances — what lives in this domain</h2>' + sections.join('');
  wireOwl(name);
  renderSchema(name);
}

// The table form of the same triples the OWL fold shows raw. `source` is a
// column because ontology-vs-shape disagreement is the incoherence we keep
// rediscovering — merging the two silently would hide it.
async function renderSchema(name) {
  const box = document.getElementById('schemabox');
  if (!box) return;
  let d;
  try {
    const r = await fetch('/api/athena/domain-schema/' + encodeURIComponent(name));
    // THREE failures, three messages. Found the hard way 2026-08-03: this page
    // is served from disk and updates instantly, while the endpoints behind it
    // need a build + deploy. On a server running an older build the route
    // 404s — and the first version of this code reported that as "store
    // unreachable," which is the same cannot-distinguish-two-states defect the
    // whole page exists to expose. It named the wrong cause on its own bug.
    if (r.status === 404) {
      box.innerHTML = '<h2>Schema</h2><div class="note"><strong>This endpoint is not on ' +
        'this server.</strong> The page is served from disk and is current; the API behind it ' +
        'is from an older build. Nothing is wrong with the model — deploy the API to see the ' +
        'schema here.</div>';
      return;
    }
    d = await r.json();
    if (!r.ok || d.storeReachable === false) throw new Error(d.error || 'the store did not answer');
  } catch (e) {
    box.innerHTML = '<h2>Schema</h2><div class="note"><strong>Could not read the model — ' +
      esc(e.message) + '.</strong> The endpoint answered but the STORE did not. ' +
      'This is NOT an empty schema.</div>';
    return;
  }
  if (!d.classes.length) {
    box.innerHTML = '<h2>Schema</h2><div class="note"><strong>No classes.</strong> ' +
      'This domain declares no vocabulary, so there is nothing to describe — a fact ' +
      'about the model, not a missing page.</div>';
    return;
  }
  box.innerHTML = '<h2>Schema — what the model says each class has</h2>' +
    d.classes.map(c =>
      '<h3>' + esc(c.name) + '</h3>' +
      (c.properties.length
        ? '<div class="scroll"><table><thead><tr><th>Property</th><th>Type</th>' +
          '<th>Required</th><th>Declared in</th></tr></thead><tbody>' +
          c.properties.map(p => {
            const both = p.source.length > 1;
            return '<tr><td><code>' + esc(p.property) + '</code></td>' +
              '<td>' + (p.type ? esc(p.type) : '<span class="empty">—</span>') + '</td>' +
              '<td class="' + (p.required ? 'req' : 'opt') + '">' + (p.required ? 'required' : 'optional') + '</td>' +
              '<td><span class="src src-' + (both ? 'both' : esc(p.source[0] || 'shape')) + '">' +
              esc(both ? 'both' : (p.source[0] || '?')) + '</span></td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<div class="note"><strong>No properties.</strong> Nothing in the ontology types ' +
          'a property over this class and no shape constrains it — so nothing can be said ' +
          'about an instance of it.</div>')
    ).join('');
}

// Lazy: the turtle is only fetched when the reader opens it. A domain's OWL is
// small, but fetching it on every page load would make the common case pay for
// the rare one.
function owlBlock(name) {
  return '<details class="owl" id="owlbox"><summary>The OWL for this domain</summary>' +
         '<pre id="owltext">…</pre></details>';
}

function wireOwl(name) {
  const box = document.getElementById('owlbox');
  if (!box) return;
  let loaded = false;
  box.addEventListener('toggle', async () => {
    if (!box.open || loaded) return;
    loaded = true;
    const pre = document.getElementById('owltext');
    try {
      const r = await fetch('/api/athena/domain-owl/' + encodeURIComponent(name));
      const body = await r.text();
      if (r.status === 404 || body.startsWith('{')) {
        // A JSON body here means the request fell through to a different
        // handler — this route does not exist on this server. Say THAT, rather
        // than rendering someone else's envelope as if it were the ontology.
        pre.textContent =
          '# This endpoint is not on this server.\n' +
          '# The page is served from disk and is current; the API behind it is from an\n' +
          '# older build, so the request fell through to another handler. The response\n' +
          '# below is NOT this domain\'s OWL:\n#\n' + body.slice(0, 300);
        return;
      }
      // A failure is REPORTED, never rendered as an empty ontology — an empty
      // domain and an unreachable store must not look identical.
      pre.textContent = r.ok
        ? (body.trim() || '# no triples. This domain declares no vocabulary, so there is\n# nothing to show — not an error, and not hidden.')
        : body;
    } catch (e) {
      loaded = false;
      pre.textContent = '# could not reach the model: ' + e.message +
                        '\n# This is NOT an empty domain.';
    }
  });
}

async function renderInstance(domainName, instName) {
  const d = await get('/domains');
  const dom = (d.data || []).find(r => r.name === domainName);
  const vocab = dom ? [].concat(dom.definesVocabulary || []).filter(Boolean) : [];

  let found = null, foundKind = null;
  for (const kind of vocab) {
    const coll = await collectionFor(kind);
    if (!coll) continue;
    try {
      const r = await get(coll.replace(/^\/v1/, ''));
      const hit = (r.data || []).find(i => i.name === instName);
      if (hit) { found = hit; foundKind = kind; break; }
    } catch { /* reported below if nothing is found at all */ }
  }

  const head = crumbs([domainName, instName]);
  if (!found) {
    app.innerHTML = head + '<h1>' + esc(instName) + '</h1>' +
      '<div class="note"><strong>Not found in this domain\'s vocabulary.</strong> ' +
      'Searched ' + (vocab.length ? '<code>' + vocab.map(esc).join('</code>, <code>') + '</code>' : 'nothing — the domain declares no vocabulary') +
      '. The instance may live under a different domain, or not be served at all.</div>';
    return;
  }

  // #3749 UX (Jeff: "this isnt very meaningful"): the collection row is a
  // 4-field husk — the ENTITY read carries the whole instance (readings,
  // source, dates). Fetch it; fall back to the row only if it fails.
  let full = found;
  try {
    const coll = await collectionFor(foundKind);
    const er = await get(coll.replace(/^\/v1/, '') + '/' + encodeURIComponent(instName));
    if (er && er.data && Object.keys(er.data).length) full = Object.assign({ name: instName }, er.data);
  } catch { /* husk fallback — better a thin page than a broken one */ }

  // Edges render as links to the target's own path — the graph is walkable by
  // clicking, which is the AC item that makes this a navigation surface rather
  // than a viewer.
  const LONG = 140; // long text renders as prose above the table, not squeezed into a cell
  const longs = Object.entries(full).filter(([k, v]) => typeof v === 'string' && v.length > LONG);
  const rows = Object.entries(full)
    .filter(([k]) => k !== 'name' && !longs.some(([lk]) => lk === k))
    .map(([k, v]) => {
      const vals = [].concat(v).filter(x => x !== '' && x != null);
      const cell = vals.length
        ? vals.map(x => /^[a-z][\w-]*$/i.test(String(x)) && String(x) !== String(found.label)
            ? '<a class="ref" href="/domains/' + encodeURIComponent(domainName) + '/' + encodeURIComponent(x) + '">' + esc(x) + '</a>'
            : esc(x)).join(', ')
        : '<span class="empty">—</span>';
      return '<tr><td class="k">' + esc(k) + '</td><td>' + cell + '</td></tr>';
    }).join('');

  const prose = longs.map(([k, v]) =>
    '<h3 class="prosek">' + esc(k) + '</h3><p class="prose">' + esc(String(v)) + '</p>').join('');
  app.innerHTML = head +
    '<h1>' + esc(full.label || found.label || found.name) + '<span class="kind">' + esc(foundKind) + '</span></h1>' +
    '<p class="sub"><code>' + esc(found.name) + '</code> — in the <a class="ref" href="/domains/' +
      encodeURIComponent(domainName) + '">' + esc(domainName) + '</a> domain.</p>' +
    prose +
    '<div class="scroll"><table><thead><tr><th>Property</th><th>Value</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>';
}

(async () => {
  try {
    if (seg.length === 0) await renderCatalog();
    else if (seg.length === 1) await renderDomain(seg[0]);
    else await renderInstance(seg[0], seg[1]);
  } catch (e) { fail(e); }
})();
</script>
</body>
</html>
