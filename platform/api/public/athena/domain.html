<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain — Athena</title>
<!-- #3635 — the Jeff-approved domain INSTANCE page (2026-07-12 mock), ?d=<name>.
     The family's domain view; the richer 17-facet /domain.html (root) remains until
     its facets fold in (consolidation card). Hand-authored pending the generator upgrade. -->
<script>window.OWL_PORT = 3360;</script>
<link rel="stylesheet" href="athena-flow.css"><style>.ok{color:#1a7f37;font-weight:600}.bad{color:#cf222e;font-weight:600}/* #5040: a verdict is one word; the fold's wrap-anywhere rule broke it into "gr ee n" on a phone */span.ok,span.bad,.fold td.word{white-space:nowrap;overflow-wrap:normal}/* #5041: the one-line cell rules (td.one) are in athena-flow.css, shared by every page that loads the fold renderer */.fold .kinds{font-size:.78rem;color:var(--muted);font-weight:400}@media (prefers-color-scheme:dark){.ok{color:#3fb950}.bad{color:#f85149}}</style><script src="athena-flow.js"></script><script src="facets.js"></script><script>mountJourneyNav('domains');</script><script>/* #3810 — the page teaches itself its mount, with nothing to fetch.
   A root-absolute src on the loader tag is the trap: from /chorus/ the browser resolves it
   against the apex, asks the garden site, gets a 404 — so the file that would have told
   this page where it lives can never load. Chicken-and-egg, and it left three correct
   fixes underneath it inert. Relative src was rejected: it breaks the no-trailing-slash
   entry and needs ../ depth per page, which is per-page compensation for a mount.
   No request, so nothing can escape the mount. At root BASE is '' and URLs are unchanged. */
(function(){var m=document.querySelector('meta[name="chorus-base"]'),b=m&&m.getAttribute('content')||null;
if(b===null){var p=(location&&location.pathname)||'';b=(p==='/chorus'||p.indexOf('/chorus/')===0)?'/chorus':'';}
b=b.replace(/\/+$/,'');window.CHORUS_BASE=b;
window.basePath=function(x){if(!x)return b||'/';if(/^[a-z]+:\/\//i.test(x)||x.indexOf('//')===0)return x;
return b+(x.charAt(0)==='/'?x:'/'+x);};
/* the DOM-rewriter still has a job (root-absolute hrefs must stay inside the mount);
   it is fetched THROUGH the base this snippet just computed, so it cannot escape. */
var s=document.createElement('script');s.src=window.basePath('/js/base-path.js');document.head.appendChild(s);}());
// #5040 — the page-wide `OWL` constant (#4064/#4084) is gone. It was set ABOVE this snippet,
// before the page knew its mount, so it was always the bare model base: under
// lightlifeurbangardens.com/chorus every address built from it left the sign-in door (Jeff's
// phone, 2026-11-25 08:02). Every address on this page is now built at call time through
// window.basePath (above) or athena-flow.js's fetchJSON.</script>
</head>
<body><div class="wrap">
<div class="crumb" id="crumb"><a href="value-stream.html">value stream</a> &rarr; <a href="domains.html">domains</a></div>
<h1 id="title">Domain</h1>
<div id="main"><p class="empty">loading live from the model&hellip;</p></div>
</div>
<script>
(async function () {
  const main = document.getElementById('main');
  const d = new URLSearchParams(location.search).get('d');
  if (!d) { main.innerHTML = '<div class="err">No domain named — open as domain.html?d=&lt;name&gt;, e.g. from <a class="edge" href="domains.html">the domains page</a>.</div>'; return; }
  try {
    // edges (ownedBy/atStep/partOf/definesVocabulary) live on the COLLECTION row;
    // literals on the entity read. Merge both.
    const [entEnv, collEnv, prodsEnv] = await Promise.all([
      fetchJSON(`/domains/${encodeURIComponent(d)}`), fetchJSON('/domains'), fetchJSON('/products')]);
    const lit = (Array.isArray(entEnv.data) ? entEnv.data[0] : entEnv.data) || {};
    const row = ((collEnv.data || []).find(r => r.name === d)) || {};
    const e = { ...row, ...Object.fromEntries(Object.entries(lit).filter(([, v]) => v !== '' && v != null)) };
    // the claiming product comes from the products' hasDomain edges (partOf is not a collection field)
    for (const pr of (prodsEnv.data || []))
      if (asArray(pr.hasDomain).includes(d)) e.partOf = pr.name;
    if (!Object.keys(lit).length && !Object.keys(row).length) { main.innerHTML = `<div class="err">The model has no domain named "${esc(d)}" — that is the graph's answer, not a fetch failure.</div>`; return; }
    const label = e.label || d;
    document.title = `${label} — Domain — Athena`;
    document.getElementById('title').innerHTML = `${esc(label[0].toUpperCase() + label.slice(1))} <span class="kind">&mdash; Domain</span>`;
    const part = asArray(e.partOf).map(x => String(x).split('#').pop())[0] || '';
    const step = stepLocal(e.atStep);
    document.getElementById('crumb').innerHTML =
      `<a href="value-stream.html">value stream</a> &rarr; <a href="value-stream.html">${esc(step ? step[0].toUpperCase() + step.slice(1) : '?')}</a>` +
      (part ? ` &rarr; <a href="product.html?p=${encodeURIComponent(part)}">${esc(part)}</a>` : '') +
      ` &rarr; ${esc(d)}`;

    const vocab = asArray(e.definesVocabulary).sort();
    // #5034 — the link is the collection the model's own discovery names for the class. It was a
    // guess (lowercase + "s"), which answered 404 for every class served under a domain path.
    // A class discovery does not name gets words, never a link that leads nowhere.
    const disc = vocab.length ? await fetchJSON('/').catch(() => null) : null;
    const collOf = v => ((disc && disc.primitives) || []).find(p => p.kind === v);
    // #5045 — the fingerprint a served class reports, or null ("unversioned" is the API's own word for none)
    const apiVersion = p => p && p.shapeVersion && p.shapeVersion !== 'unversioned' ? String(p.shapeVersion) : null;
    // #5041 — this row is the ONE route to the class's rows (Jeff, 2026-11-25 10:40: "we dont want
    // 2-3 links to same data"), and its label says how many there are, read live from the class's
    // own collection. A count that cannot be read is left out: "rows of Principle", never a guess.
    const rowCount = async coll => {
      try {
        const one = await fetchJSON(coll + '?limit=1');
        if (typeof one.count === 'number') return one.count;          // a generated API states its total
        if (!(one.links && one.links.next)) return Array.isArray(one.data) ? one.data.length : null;
        const env = await fetchJSON(coll + '?limit=1000');            // the read rows.html itself makes
        return Array.isArray(env.data) && !(env.links && env.links.next) ? env.data.length : null;
      } catch (e) { return null; }
    };
    const vocabRows = (await Promise.all(vocab.map(async v => {
      const c = collOf(v);
      if (!c) return `<tr><td class="word">${esc(v)}</td><td><span class="empty">${disc ? 'not served: discovery names no collection for this class' : 'could not read discovery'}</span></td></tr>`;
      const n = await rowCount(c.collection);
      // #5040 — the link opens the class's rows as a table (rows.html). It opened the collection
      // itself, which on a phone is a screen of raw data (Jeff, 08:14); the collection is named beside it.
      return `<tr><td class="word">${esc(v)}</td><td><a class="edge" href="rows.html?kind=${encodeURIComponent(v)}">${n === null ? '' : n + ' '}${n === 1 ? 'row' : 'rows'} of ${esc(v)}</a> <span class="src">${esc(c.collection)} &middot; ${apiVersion(c) ? 'version ' + esc(apiVersion(c).slice(0, 8)) : 'version not reported'}</span></td></tr>`;
    }))).join('');

    // #5045 — the tile that said a typed Status ("operating", written by hand, never checked) now
    // says what is running: the version of the domain's API in production, read live from the
    // model's own discovery (each served class reports the fingerprint of the shape it was
    // generated from, ADR-047). A domain has no status of its own (Jeff, 2026-11-26 11:08: a
    // version has a state; this card shows the one state that is read today, "in production").
    // A domain serves one API per class, so one class shows its version and several show how many
    // report one; each class's own version is beside it in the Vocabulary fold. Open cards never
    // change this tile. Not reported and not served are said in words, never as "in production".
    const served = vocab.map(collOf).filter(Boolean);
    const versions = served.map(apiVersion).filter(Boolean);
    const api = vocab.length && !disc ? { state: 'unread', v: 'could not read', l: 'API version' }
      : !served.length ? { state: 'none', v: 'no API in production', l: 'API version' }
      : !versions.length ? { state: 'unreported', v: 'version not reported', l: 'API version' }
      : served.length === 1 ? { state: 'live', v: versions[0].slice(0, 8), l: 'API version &middot; in production' }
      : { state: 'live', v: versions.length === served.length ? `${served.length} classes` : `${versions.length} of ${served.length} classes`, l: 'API versions &middot; in production' };

    // #5034 — the design doc link. The row holds either a Document row's name ("document-<name>")
    // or a file name under designing/docs. The page linked "/<value>", which answered 404 for
    // both. A Document row gives its own address (docHref); a value with neither gets words.
    // The edge is many-valued and may arrive with an IRI prefix (product.html reads it the same
    // way); every address goes through basePath so it stays inside the mount.
    // #5045 — a document is offered only when the Document row ITSELF names this domain (its
    // hasDomain) and it leads somewhere other than this page. The row's word alone was taken
    // before: principles offered Loom's document, identity offered security's, and logs "linked"
    // to the page the reader was already on (Jeff, 2026-11-25 15:47: "design doc is stale and not
    // in graph"). A file name is not a Document row, so the model cannot say whose it is: it is
    // not offered. What the row names and the page leaves out is said, with the reason.
    const bareName = v => String(v).split('#').pop().replace(/^chorus:/, '');
    const designDocs = asArray(e.hasDesignDoc).map(bareName).filter(Boolean);
    const ownDocs = designDocs.length ? await fetchJSON(`/knowledge/documents?hasDomain=${encodeURIComponent(d)}&limit=200`).catch(() => null) : null;
    // the door's filter is repeated here, so a door that ignored it could not widen what is shown
    const mine = ((ownDocs && ownDocs.data) || []).filter(doc => asArray(doc.hasDomain).some(v => bareName(v) === d));
    const isThisPage = href => { try { const u = new URL(window.basePath(href), location.href); return u.pathname === location.pathname && u.searchParams.get('d') === d; } catch (err) { return false; } };
    const ddShown = [], ddLeftOut = [];
    for (const dd of designDocs) {
      if (!/^document-/.test(dd)) { ddLeftOut.push(`${dd} (a file name, not a document in the model)`); continue; }
      const name = dd.replace(/^document-/, '');
      const doc = mine.find(x => x.name === name);
      if (!ownDocs) ddLeftOut.push(`${name} (the documents could not be read)`);
      else if (!doc) ddLeftOut.push(`${name} (the model holds no document by that name that belongs to ${d})`);
      else if (!doc.docHref) ddLeftOut.push(`${name} (the document has no address)`);
      else if (isThisPage(doc.docHref)) ddLeftOut.push(`${name} (its address is this page)`);
      else ddShown.push(`<a class="edge" href="${esc(window.basePath(doc.docHref))}">${esc(doc.docTitle || name)}</a>`);
    }
    const ddBody = (ddShown.length ? `<p>${ddShown.join('<br>')}</p>`
      // class "note": this line IS the fold's written reason for holding no document (the folds
      // suite's rule since #5021: a fold with nothing in it says why)
      : `<p class="note">No design document in the model belongs to ${esc(d)}. This page is generated from the model: it is the design as built.</p>`)
      + (ddLeftOut.length ? `<p class="src">Named by the domain's row and not shown: ${ddLeftOut.map(esc).join('; ')}.</p>` : '');

    // #5041 — the page says each thing once. A Description that only repeats the purpose line
    // above it (same words, whatever the spacing or capitals) is not drawn a second time, and a
    // domain with no description draws no fold at all (it drew an open, empty one).
    const plain = s => String(s || '').replace(/\s+/g, ' ').trim().toLowerCase();
    const descFold = !plain(e.comment) || plain(e.comment) === plain(e.purpose) ? ''
      : `<details class="fold" open><summary>Description <span class="src">rdfs:comment</span></summary><div class="body"><p>${esc(e.comment || '')}</p></div></details>`;

    // #5041 — the folds in the order a reader needs (Borg Queen's UX review, 2026-11-25): what the
    // domain is and exposes, whether it is healthy, then the work and the code. The page's own
    // folds and the shared renderer's interleave, so each group of facets has its own slot.
    // The embedded Model fold is gone: it was a third route to the same rows. ONE link (the
    // "Shape and OWL" tile) opens the model view, where the class definition is.
    main.innerHTML = `
<div class="promise"><strong>purpose:</strong> ${esc(e.purpose || '')}</div>
<div class="stats">
  <div class="stat"><div class="v">${ownerDot(e.ownedBy)}</div><div class="l">Owner (ownedBy)</div></div>
  <div class="stat"><div class="v">${stepBadge(e.atStep)}</div><div class="l">Step (atStep)</div></div>
  <div class="stat" data-api="${api.state}"><div class="v">${esc(api.v)}</div><div class="l">${api.l}</div></div>
  <div class="stat"><div class="v">${part ? `<a class="edge" href="product.html?p=${encodeURIComponent(part)}">${esc(part)}</a>` : '<span class="empty">unclaimed</span>'}</div><div class="l">Product (partOf)</div></div>
  <div class="stat"><div class="v"><a class="edge" href="${esc(window.basePath('/domains/' + encodeURIComponent(d)))}">Shape and OWL</a></div><div class="l">Model view (#3761)</div></div>
</div>
${descFold}
<details class="fold" open><summary>Vocabulary (definesVocabulary) <span class="src">the classes this domain owns &mdash; each is a generated API</span></summary><div class="body">
${vocab.length ? `<table><tr><th>Class</th><th>Rows &middot; generated collection</th></tr>${vocabRows}</table>` : '<div class="empty">no vocabulary yet</div>'}</div></details>
<div id="facets-api"></div>
<div id="svc-slot"></div>
<div id="conf-slot"></div>
<div id="gaps-slot"></div>
<div id="facets-deps"></div>
<details class="fold" data-dd="${ddShown.length ? 'own' : 'none'}" open><summary>Design doc <span class="src">chorus:hasDesignDoc, where the document names this domain</span></summary><div class="body">${ddBody}</div></details>
<div id="facets-decisions"></div>
<div id="facets"><p class="empty">loading the materialized view (cards, alerts, tests, &hellip;)&hellip;</p></div>
<div id="code-slot"></div>
${srcNote(`GET /domains/${esc(d)} + the materialized facet endpoints (/api/chorus/domain)`)}`;
    // #5021 — the Domain row's written reasons for empty folds, keyed by fold name
    window.FOLD_NOTES = Object.fromEntries(asArray(e.foldNote).map(n => String(n)).filter(n => n.includes(':'))
      .map(n => [n.slice(0, n.indexOf(':')).trim(), n.slice(n.indexOf(':') + 1).trim()]));
    renderFacets(d);
    renderServices(d, asArray(e.hosts).map(x => String(x).split('#').pop().replace(/^chorus:/, '')).filter(Boolean));
    renderCode(d);
    renderConformance(d);
    renderGaps(d);
  } catch (e) { fetchFailed(main, e); }
})();

// #5045 — Gaps: a gap is the card that will close it. The Domain row holds card numbers
// (chorus:gapCard) and nothing else; this fold reads them joined to the board
// (GET /api/chorus/domain/<d>/gaps), so each gap is a link to its card with the card's own title,
// owner and standing as they are now. A gap whose card is done reads "closed". Before, the fold
// showed a sentence typed on the row that nobody kept true (Jeff, 2026-11-25 15:47: "how do we
// resolve gaps"). A read that fails says so: an empty fold would read as "no gaps", which is a claim.
async function renderGaps(d) {
  const el = document.getElementById('gaps-slot');
  const fold = (n, state, body) => `<details class="fold" data-gaps="${state}" open><summary>Gaps${n === null ? '' : ` (${n})`} <span class="src">chorus:gapCard &rarr; the board's card</span></summary><div class="body">${body}</div></details>`;
  try {
    const r = await fetch(window.basePath(`/api/chorus/domain/${encodeURIComponent(d)}/gaps`));
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || ('HTTP ' + r.status));
    const gaps = b.gaps || [];
    if (!gaps.length) { el.innerHTML = fold(0, 'none', `<p class="note">No open gap is recorded for ${esc(d)}: its row names no card.</p>`); return; }
    const open = gaps.filter(g => g.state !== 'closed').length;
    const rows = gaps.map(g => {
      const href = cardHref(g.id);
      const num = href ? `<a class="edge" href="${esc(href)}">#${esc(g.id)}</a>` : `#${esc(g.id)}`;
      // one block per gap, no table: on a phone a table here scrolled sideways and cut the title
      // mid-word (read from the 390 px picture, 2026-11-26); a block wraps to the fold's width
      const what = g.state === 'not on the board' ? '<span class="bad">not on the board</span>'
        : `${esc(g.title || '')}<br><span class="src">${esc(g.owner || 'no owner')} &middot; ${esc(g.status || '')} &middot; ${g.state === 'closed' ? '<span class="ok">closed</span>' : 'open'}</span>`;
      return `<p data-gap="${esc(g.id)}" data-state="${esc(g.state)}">${num} ${what}</p>`;
    }).join('');
    el.innerHTML = fold(open, open ? 'open' : 'closed', rows);
  } catch (e) {
    el.innerHTML = fold(null, 'unread', `<p class="bad">could not read Gaps: ${esc(String(e && e.message || e))}</p>`);
  }
}

// #5021 — Conformance: every policy that applies to this domain (global, or appliesTo it)
// with its last policy-validate --domain result, read live from the policies door and the
// lint's own run (GET /api/chorus/policies/counts?domain=). Nothing here is hand-written.
// #5044 — the read answers the KEPT result at once; the page never waits for the lint (Jeff's
// phone, 2026-11-25 15:44: "Cannot reach the policies endpoint"; the lint ran inside the read,
// 27 s, behind a door that gives up at 30). The fold says when the result was measured and how
// long ago; one past ten minutes is marked old, and the fresh check running behind it is named.
// With nothing kept yet it says "not measured yet", never "cannot reach". While a check runs the
// fold reads again, every 15 s, at most 8 times, so it fills in without a reload.
async function renderConformance(d, tries) {
  tries = tries || 0;
  const el = document.getElementById('conf-slot');
  const fold = (summary, body, open) => `<details class="fold"${open ? ' open' : ''}><summary>Conformance ${summary} <span class="src">chorus:Policy (global or appliesTo) &middot; policy-validate --domain ${esc(d)}</span></summary><div class="body">${body}</div></details>`;
  if (!tries) el.innerHTML = fold('', '<p class="empty">reading the last check&hellip;</p>', true);
  // a fold the reader opened or closed by hand stays that way across a re-read
  const was = el.querySelector('details'), keptOpen = tries && was ? was.open : null;
  const draw = (summary, body, open) => { el.innerHTML = fold(summary, body, keptOpen === null ? open : keptOpen); };
  try {
    const r = await fetch(window.basePath(`/api/chorus/policies/counts?domain=${encodeURIComponent(d)}`));   // #5040: through the mount
    const b = await r.json();
    if (!r.ok) { draw('', `<p class="empty"><strong>Cannot measure</strong> &mdash; ${esc(b.error || ('HTTP ' + r.status))}</p>`, true); return; }
    const again = b.checking && tries < 8;
    if (again) setTimeout(() => renderConformance(d, tries + 1), 15000);
    const running = b.checking ? (again ? ' A check is running now; this fold reads it when it is done.' : ' A check is still running; reload the page to read it.') : '';
    const failed = b.lastCheckFailed ? `<p class="bad" data-conf="failed">The last check gave no result: ${esc(b.lastCheckFailed)}</p>` : '';
    if (!b.measuredAt) { draw('(not measured yet)', `<p class="empty" data-conf="unmeasured"><strong>Not measured yet.</strong>${running}</p>${failed}`, true); return; }
    const ps = b.policies || [];
    const when = `<p class="src" data-conf="${b.stale ? 'stale' : 'fresh'}" data-measured="${esc(b.measuredAt)}">measured ${esc(localTime(b.measuredAt) || b.measuredAt)} (${esc(agoText(b.measuredAt))})${b.stale ? ' &mdash; <strong>old</strong>: more than ten minutes.' : ''}${running}</p>${failed}`;
    if (!ps.length) { draw('', when + '<p class="empty">No policy with a check applies to this domain.</p>', true); return; }
    const red = ps.filter(p => p.verdict !== 'pass').length;
    // #5041 — each policy name opens that policy's own page (Jeff: "i want to be able to click
    // into and see policy instances"). The fold starts closed when nothing is red, open when something is.
    const verdict = p => p.verdict === 'pass' ? '<span class="ok">green</span>' : p.verdict === 'fail' ? '<span class="bad">red</span>' : '<span class="bad">could not run</span>';
    const rows = ps.map(p => `<tr data-policy="${esc(p.name)}" data-verdict="${esc(p.verdict)}"><td>${verdict(p)}</td><td><a class="edge" href="${esc(window.basePath('/domains/policies/' + encodeURIComponent(p.name)))}"><strong>${esc(p.name)}</strong></a><br><span class="src">${esc(p.label || '')}</span>${(p.violations || []).length ? `<ul>${p.violations.map(v => `<li><code>${esc(v)}</code></li>`).join('')}</ul>` : ''}${p.reason ? `<br><span class="empty">${esc(p.reason)}</span>` : ''}</td><td>${p.count == null ? '&ndash;' : esc(String(p.count))} / ${p.baseline == null ? '&ndash;' : esc(String(p.baseline))}</td><td>${esc(p.scope || '')}</td></tr>`).join('');
    draw(`(${red ? red + ' red' : 'green'} of ${ps.length}${b.stale ? ', old' : ''})`,
      `${when}<div class="tbl"><table><tr><th></th><th>Policy</th><th>count / baseline</th><th>applies</th></tr>${rows}</table></div>`, red > 0 || !!b.lastCheckFailed);
  } catch (e) { draw('', `<p class="empty"><strong>Cannot reach</strong> the policies endpoint &mdash; fetch failure. ${esc(String(e && e.message || e))}</p>`, true); }
}

// #4472 — the services this domain hosts (chorus:hosts) and the launchd units the services
// crawl found running them (runsService). Both come from the graph; nothing is listed here.
// #5040 — the hosted services come from the Domain row the page already read (its `hosts`
// edge), not from a query POSTed to the store. The sign-in door is GET and HEAD only, by
// design, so at the public address this fold read "sparql-read 405" (Jeff's phone, 08:03).
async function renderServices(d, svcs) {
  const el = document.getElementById('svc-slot');
  const fold = (body) => `<details class="fold" open><summary>Services and running units <span class="src">chorus:hosts &rarr; chorus:Service &larr; chorus:runsService (the services crawl)</span></summary><div class="body">${body}</div></details>`;
  try {
    const why = (window.FOLD_NOTES || {}).Services;   // #5021 — the written reason, when there is one
    if (!svcs.length) { el.innerHTML = fold((why ? `<p class="note"><strong>Why empty:</strong> ${esc(why)}</p>` : '') + `<p class="empty">The model names no service this domain hosts &mdash; add <code>chorus:${esc(d)} chorus:hosts &lt;service&gt;</code>.</p>`); return; }
    const [inst, jobs] = await Promise.all([fetchJSON('/serviceinstances?limit=500'), fetchJSON('/scheduledjobs?limit=500')]);
    const units = [...(inst.data || []).map(u => ({ ...u, kind: 'instance' })), ...(jobs.data || []).map(u => ({ ...u, kind: 'job' }))];
    el.innerHTML = fold(svcs.map(full => {
      const name = full.replace(/^service-/, '');
      const mine = units.filter(u => runsServiceNames(u.runsService, name));
      const rows = mine.map(u => `<tr><td>${esc(u.launchdLabel || u.label || u.name)}</td><td>${esc(u.kind)}</td><td>${esc(u.onMachine || '')}</td><td>${esc(unitState(u))}</td></tr>`).join('');
      return `<h3><a class="edge" href="service.html?s=${encodeURIComponent(name)}">${esc(name)}</a> <small>${mine.length} unit(s)</small></h3>` +
        (mine.length ? `<table><thead><tr><th>Unit</th><th>Kind</th><th>Machine</th><th>State</th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="empty">the crawl found no launchd unit running this service</p>');
    }).join(''));
  } catch (e) { el.innerHTML = fold(`<p class="empty"><strong>Cannot reach the model</strong> for services &mdash; fetch failure. ${esc(String(e && e.message || e))}</p>`); }
}

// #4235 — the files the crawl tagged with this domain (CodeFile hasDomain), from the
// graph. A file is listed because the crawl measured it, never because a list said so.
// #5041 — shown ONCE, in the Code fold. There were two folds over the same rows ("Files" here,
// "Code" from the shared renderer; Jeff: "files seems same as code fold?", "are code and tests
// counts really right?"). This is the one: every file, grouped by the kind the crawl gave it,
// with a count per kind beside the total. It starts closed (it is the longest fold on the page).
// The fold's name stays "Code": the model's Domain shape and the folds counter fix the names.
const CODE_KINDS = ['code', 'test', 'config', 'marker', 'doc', 'asset'];   // the order shown; any other kind follows, by name
async function renderCode(d) {
  const el = document.getElementById('code-slot');
  const fold = (n, kinds, body, open) => `<details class="fold"${open ? ' open' : ''}><summary>Code (${n}) <span class="kinds">${kinds}</span> <span class="src">chorus:CodeFile &rarr; chorus:hasDomain (the code crawl)</span></summary><div class="body">${body}</div></details>`;
  const bare = v => String(v).split('#').pop().replace(/^chorus:/, '');
  try {
    // #5040 — read from the model door's own collection, filtered there on hasDomain (a GET the
    // sign-in door serves). It was a query POSTed to the store, which the door refuses: 405.
    // Every page of the collection is followed, so a domain with many files is not cut short.
    // The filter is repeated here, so a door that ignored it could not widen what is shown.
    const rows = new Map();
    let next = `/code/files?hasDomain=${encodeURIComponent(d)}&limit=1000`;
    for (let pages = 0; next && pages < 20; pages++) {
      const env = await fetchJSON(next);
      for (const f of (env.data || []))
        if (f.filePath && asArray(f.hasDomain || (f.links && f.links.hasDomain)).some(v => bare(v) === d)) rows.set(String(f.name || f.filePath), f);
      next = env.links && env.links.next ? String(env.links.next).replace(/^\/v1/, '') : null;
    }
    // 20 pages is 20,000 files; a domain past that is told so, never shown a short list as the whole
    if (next) throw new Error('more than 20,000 files for this domain: the list would be cut short');
    if (!rows.size) {
      const why = (window.FOLD_NOTES || {}).Code;   // #5021 — the written reason, when there is one
      el.innerHTML = fold(0, '', (why ? `<p class="note"><strong>Why empty:</strong> ${esc(why)}</p>` : '') + `<p class="empty">The crawl tagged no file with this domain.</p>`, false);
      return;
    }
    // a file is in one group: its kind, or "no kind" when the crawl gave it none
    const groups = {};
    for (const f of rows.values()) {
      const k = asArray(f.hasKind).map(v => bare(v).replace(/^code-kind-/, '')).sort().join(' + ') || 'no kind';
      (groups[k] = groups[k] || []).push(String(f.filePath));
    }
    const rank = k => { const i = CODE_KINDS.indexOf(k); return i < 0 ? CODE_KINDS.length : i; };
    const kinds = Object.keys(groups).sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
    el.innerHTML = fold(rows.size, kinds.map(k => `${groups[k].length} ${esc(k)}`).join(' &middot; '),
      kinds.map(k => `<h3 data-kind="${esc(k)}" data-count="${groups[k].length}">${esc(k)} <small>${groups[k].length} file(s)</small></h3>` +
        `<div class="tbl"><table><tbody>${groups[k].sort().map(p => `<tr><td class="one"><code>${esc(p)}</code></td></tr>`).join('')}</tbody></table></div>`).join(''), false);
  } catch (e) {
    // a read that failed is said so, with an unknown count: never an empty Code fold, never "0 files"
    el.innerHTML = fold('?', '', `<div class="bad">could not read Code: ${esc(String(e && e.message || e))}</div>`, true);
  }
}

// ---- the materialized view (#3635, Jeff's ruling 2026-07-12): the domain instance
// page MUST conform to the 17-facet materialized view (domain-renderer.js contract) —
// live graph-derived facets: cards, code, tests, alerts, logs, decisions, deps, etc.
// Same endpoints as /domain.html; rendered in the family's design vocabulary.
async function renderFacets(d) {
  // #4093 — one renderer (facets.js); this page draws every facet
  const fid = await resolveFacetId(d);
  // #5041 — three facets sit between the page's own folds, each in its slot; every other facet
  // the renderer has is drawn below them, in the renderer's order, so a facet added there still
  // shows here. Code is this page's own fold (renderCode: the files, once, by kind).
  // (The #4285 mounts for "Gaps & Status", "Actors" and "Scenarios" are gone: the renderer has
  // held no facet by those names since its folds became graph reads, so they drew nothing.)
  const o = { domain: d, notes: window.FOLD_NOTES || {} };
  const placed = [['facets-api', 'API Contract'], ['facets-deps', 'Dependencies'], ['facets-decisions', 'Decisions']];
  await Promise.all([
    ...placed.map(([slot, t]) => renderFacetTables(document.getElementById(slot), fid, { ...o, only: [t] })),
    renderFacetTables(document.getElementById('facets'), fid, { ...o, except: placed.map(p => p[1]).concat('Code') }),
  ]);
}
</script>
