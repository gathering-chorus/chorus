<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain — Athena</title>
<!-- #3635 — the Jeff-approved domain INSTANCE page (2026-07-12 mock), ?d=<name>.
     The family's domain view; the richer 17-facet /domain.html (root) remains until
     its facets fold in (consolidation card). Hand-authored pending the generator upgrade. -->
<script>window.OWL_PORT = 3360;</script>
<link rel="stylesheet" href="athena-flow.css"><style>.tbl{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}.tbl table{min-width:420px}.ok{color:#1a7f37;font-weight:600}.bad{color:#cf222e;font-weight:600}/* #5040: a verdict is one word; the fold's wrap-anywhere rule broke it into "gr ee n" on a phone */.ok,.bad,.fold td.word{white-space:nowrap;overflow-wrap:normal}@media (prefers-color-scheme:dark){.ok{color:#3fb950}.bad{color:#f85149}}</style><script src="athena-flow.js"></script><script src="model-fold.js"></script><script src="facets.js"></script><script>mountJourneyNav('domains');</script><script>/* #3810 — the page teaches itself its mount, with nothing to fetch.
   A root-absolute src on the loader tag is the trap: from /chorus/ the browser resolves it
   against the apex, asks the garden site, gets a 404 — so the file that would have told
   this page where it lives can never load. Chicken-and-egg, and it left three correct
   fixes underneath it inert. Relative src was rejected: it breaks the no-trailing-slash
   entry and needs ../ depth per page, which is per-page compensation for a mount.
   No request, so nothing can escape the mount. At root BASE is '' and URLs are unchanged. */
(function(){var m=document.querySelector('meta[name="chorus-base"]'),b=m&&m.getAttribute('content')||null;
if(b===null){var p=(location&&location.pathname)||'';b=(p==='/chorus'||p.indexOf('/chorus/')===0)?'/chorus':'';}
b=b.replace(/\/+$/,'');window.CHORUS_BASE=b;
window.basePath=function(x){if(!x)return b||'/';if(/^[a-z]+:\/\//i.test(x)||x.indexOf('//')===0)return x;
return b+(x.charAt(0)==='/'?x:'/'+x);};
/* the DOM-rewriter still has a job (root-absolute hrefs must stay inside the mount);
   it is fetched THROUGH the base this snippet just computed, so it cannot escape. */
var s=document.createElement('script');s.src=window.basePath('/js/base-path.js');document.head.appendChild(s);}());
// #4064/#4084 — one page-wide model base, for anything that still reads it.
// #5040 — defined HERE, after the page knows its mount. It sat above this snippet, so it was
// always the bare '/owl': under lightlifeurbangardens.com/chorus every address built from it
// left the sign-in door (Jeff's phone, 2026-11-25 08:02). Nothing on this page builds an
// address from a constant captured earlier than this line.
var OWL = window.basePath('/owl');</script>
</head>
<body><div class="wrap">
<div class="crumb" id="crumb"><a href="value-stream.html">value stream</a> &rarr; <a href="domains.html">domains</a></div>
<h1 id="title">Domain</h1>
<div id="main"><p class="empty">loading live from the model&hellip;</p></div>
</div>
<script>
(async function () {
  const main = document.getElementById('main');
  const d = new URLSearchParams(location.search).get('d');
  if (!d) { main.innerHTML = '<div class="err">No domain named — open as domain.html?d=&lt;name&gt;, e.g. from <a class="edge" href="domains.html">the domains page</a>.</div>'; return; }
  try {
    // edges (ownedBy/atStep/partOf/definesVocabulary) live on the COLLECTION row;
    // literals on the entity read. Merge both.
    const [entEnv, collEnv, prodsEnv] = await Promise.all([
      fetchJSON(`/domains/${encodeURIComponent(d)}`), fetchJSON('/domains'), fetchJSON('/products')]);
    const lit = (Array.isArray(entEnv.data) ? entEnv.data[0] : entEnv.data) || {};
    const row = ((collEnv.data || []).find(r => r.name === d)) || {};
    const e = { ...row, ...Object.fromEntries(Object.entries(lit).filter(([, v]) => v !== '' && v != null)) };
    // the claiming product comes from the products' hasDomain edges (partOf is not a collection field)
    for (const pr of (prodsEnv.data || []))
      if (asArray(pr.hasDomain).includes(d)) e.partOf = pr.name;
    if (!Object.keys(lit).length && !Object.keys(row).length) { main.innerHTML = `<div class="err">The model has no domain named "${esc(d)}" — that is the graph's answer, not a fetch failure.</div>`; return; }
    const label = e.label || d;
    document.title = `${label} — Domain — Athena`;
    document.getElementById('title').innerHTML = `${esc(label[0].toUpperCase() + label.slice(1))} <span class="kind">&mdash; Domain</span>`;
    const part = asArray(e.partOf).map(x => String(x).split('#').pop())[0] || '';
    const step = stepLocal(e.atStep);
    document.getElementById('crumb').innerHTML =
      `<a href="value-stream.html">value stream</a> &rarr; <a href="value-stream.html">${esc(step ? step[0].toUpperCase() + step.slice(1) : '?')}</a>` +
      (part ? ` &rarr; <a href="product.html?p=${encodeURIComponent(part)}">${esc(part)}</a>` : '') +
      ` &rarr; ${esc(d)}`;

    const vocab = asArray(e.definesVocabulary).sort();
    // #5034 — the link is the collection the model's own discovery names for the class. It was a
    // guess (lowercase + "s"), which answered 404 for every class served under a domain path.
    // A class discovery does not name gets words, never a link that leads nowhere.
    const disc = vocab.length ? await fetchJSON('/').catch(() => null) : null;
    const collOf = v => ((disc && disc.primitives) || []).find(p => p.kind === v);
    const vocabRows = vocab.map(v => {
      const c = collOf(v);
      // #5040 — the link opens the class's rows as a table (rows.html). It opened the collection
      // itself, which on a phone is a screen of raw data (Jeff, 08:14); the collection is named beside it.
      return `<tr><td class="word">${esc(v)}</td><td>${c ? `<a class="edge" href="rows.html?kind=${encodeURIComponent(v)}">rows of ${esc(v)}</a> <span class="src">${esc(c.collection)}</span>`
        : `<span class="empty">${disc ? 'not served: discovery names no collection for this class' : 'could not read discovery'}</span>`}</td></tr>`;
    }).join('');

    // #5034 — the design doc link. The row holds either a Document row's name ("document-<name>")
    // or a file name under designing/docs. The page linked "/<value>", which answered 404 for
    // both. A Document row gives its own address (docHref); a value with neither gets words.
    // The edge is many-valued and may arrive with an IRI prefix (product.html reads it the same
    // way); every address goes through basePath so it stays inside the mount.
    const inMount = h => (typeof window.basePath === 'function' ? window.basePath(h) : h);
    const designDocs = asArray(e.hasDesignDoc).map(v => String(v).split('#').pop().replace(/^chorus:/, '')).filter(Boolean);
    const ddLink = (await Promise.all(designDocs.map(async dd => {
      if (/^document-/.test(dd)) {
        const env = await fetchJSON(`/knowledge/documents/${encodeURIComponent(dd.replace(/^document-/, ''))}`).catch(() => null);
        const doc = env && (Array.isArray(env.data) ? env.data[0] : env.data);
        return doc && doc.docHref ? `<a class="edge" href="${esc(inMount(doc.docHref))}">${esc(doc.docTitle || dd)}</a>`
          : `${esc(dd)} <span class="empty">&mdash; the model holds no document by that name</span>`;
      }
      if (/^[\w.-]+\.html$/.test(dd)) return `<a class="edge" href="${esc(inMount('/designing/docs/' + dd))}">${esc(dd)}</a>`;
      return `${esc(dd)} <span class="empty">&mdash; not a document name or a design file</span>`;
    }))).join('<br>');

    main.innerHTML = `
<div class="promise"><strong>purpose:</strong> ${esc(e.purpose || '')}</div>
<div class="stats">
  <div class="stat"><div class="v">${ownerDot(e.ownedBy)}</div><div class="l">Owner (ownedBy)</div></div>
  <div class="stat"><div class="v">${stepBadge(e.atStep)}</div><div class="l">Step (atStep)</div></div>
  <div class="stat"><div class="v">${esc(e.status || 'no status')}</div><div class="l">Status</div></div>
  <div class="stat"><div class="v">${part ? `<a class="edge" href="product.html?p=${encodeURIComponent(part)}">${esc(part)}</a>` : '<span class="empty">unclaimed</span>'}</div><div class="l">Product (partOf)</div></div>
  <div class="stat"><div class="v"><a class="edge" href="${esc(inMount('/domains/' + encodeURIComponent(d)))}">schema &rarr; OWL &rarr; instances</a></div><div class="l">Model view (#3761)</div></div>
</div>
<details class="fold" open><summary>Description <span class="src">rdfs:comment</span></summary><div class="body"><p>${esc(e.comment || '')}</p></div></details>
<details class="fold" open><summary>Vocabulary (definesVocabulary) <span class="src">the classes this domain owns &mdash; each is a generated API</span></summary><div class="body">
${vocab.length ? `<table><tr><th>Class</th><th>Generated collection</th></tr>${vocabRows}</table>` : '<div class="empty">no vocabulary yet</div>'}</div></details>
${ddLink ? `<details class="fold" open><summary>Design doc <span class="src">chorus:hasDesignDoc</span></summary><div class="body"><p>${ddLink}</p></div></details>` : ''}
<details class="fold" open><summary>Gaps <span class="src">chorus:gaps from the model &middot; gap rows from the graph</span></summary><div class="body">${e.gaps ? `<p>${esc(e.gaps)}</p>` : '<p class="empty">the model names no gap for this domain</p>'}<div id="gaps-facet"></div></div></details>
<div id="mfold-slot"></div>
<div id="conf-slot"></div>
<div id="svc-slot"></div>
<div id="files-slot"></div>
<div id="model-facets"></div>
<div id="facets"><p class="empty">loading the materialized view (cards, code, alerts, &hellip;)&hellip;</p></div>
${srcNote(`GET /domains/${esc(d)} + the materialized facet endpoints (/api/chorus/domain)`)}`;
    // #3757 — the shared model fold, compact: the ground-level what-is-this
    // anchor. Same component, same endpoints as /domains/<d>; the drift test
    // holds the two surfaces identical. Jeff's bar: the fold is a link up the
    // altitude ladder, not a second dashboard — collapsed by default.
    renderModelFold(document.getElementById('mfold-slot'), d, { compact: true });
    // #5021 — the Domain row's written reasons for empty folds, keyed by fold name
    window.FOLD_NOTES = Object.fromEntries(asArray(e.foldNote).map(n => String(n)).filter(n => n.includes(':'))
      .map(n => [n.slice(0, n.indexOf(':')).trim(), n.slice(n.indexOf(':') + 1).trim()]));
    renderFacets(d);
    renderServices(d, asArray(e.hosts).map(x => String(x).split('#').pop().replace(/^chorus:/, '')).filter(Boolean));
    renderFiles(d);
    renderConformance(d);
  } catch (e) { fetchFailed(main, e); }
})();

// #5021 — Conformance: every policy that applies to this domain (global, or appliesTo it)
// with its last policy-validate --domain result, read live from the policies door and the
// lint's own run (GET /api/chorus/policies/counts?domain=). Nothing here is hand-written.
async function renderConformance(d) {
  const el = document.getElementById('conf-slot');
  const fold = (summary, body, open) => `<details class="fold"${open ? ' open' : ''}><summary>Conformance ${summary} <span class="src">chorus:Policy (global or appliesTo) &middot; policy-validate --domain ${esc(d)}</span></summary><div class="body">${body}</div></details>`;
  el.innerHTML = fold('', '<p class="empty">running the domain lint&hellip;</p>', true);
  try {
    const r = await fetch(window.basePath(`/api/chorus/policies/counts?domain=${encodeURIComponent(d)}`));   // #5040: through the mount
    const b = await r.json();
    if (!r.ok) { el.innerHTML = fold('', `<p class="empty"><strong>Cannot measure</strong> &mdash; ${esc(b.error || ('HTTP ' + r.status))}</p>`, true); return; }
    const ps = b.policies || [];
    if (!ps.length) { el.innerHTML = fold('', '<p class="empty">No policy with a check applies to this domain.</p>', true); return; }
    const red = ps.filter(p => p.verdict !== 'pass').length;
    const verdict = p => p.verdict === 'pass' ? '<span class="ok">green</span>' : p.verdict === 'fail' ? '<span class="bad">red</span>' : '<span class="bad">could not run</span>';
    const rows = ps.map(p => `<tr data-policy="${esc(p.name)}" data-verdict="${esc(p.verdict)}"><td>${verdict(p)}</td><td><strong>${esc(p.name)}</strong><br><span class="src">${esc(p.label || '')}</span>${(p.violations || []).length ? `<ul>${p.violations.map(v => `<li><code>${esc(v)}</code></li>`).join('')}</ul>` : ''}${p.reason ? `<br><span class="empty">${esc(p.reason)}</span>` : ''}</td><td>${p.count == null ? '&ndash;' : esc(String(p.count))} / ${p.baseline == null ? '&ndash;' : esc(String(p.baseline))}</td><td>${esc(p.scope || '')}</td></tr>`).join('');
    el.innerHTML = fold(`(${red ? red + ' red' : 'green'} of ${ps.length})`,
      `<p class="src">measured ${esc(b.measuredAt || '?')}</p><div class="tbl"><table><tr><th></th><th>Policy</th><th>count / baseline</th><th>applies</th></tr>${rows}</table></div>`, red > 0);
  } catch (e) { el.innerHTML = fold('', `<p class="empty"><strong>Cannot reach</strong> the policies endpoint &mdash; fetch failure. ${esc(String(e && e.message || e))}</p>`, true); }
}

// #4472 — the services this domain hosts (chorus:hosts) and the launchd units the services
// crawl found running them (runsService). Both come from the graph; nothing is listed here.
// #5040 — the hosted services come from the Domain row the page already read (its `hosts`
// edge), not from a query POSTed to the store. The sign-in door is GET and HEAD only, by
// design, so at the public address this fold read "sparql-read 405" (Jeff's phone, 08:03).
async function renderServices(d, svcs) {
  const el = document.getElementById('svc-slot');
  const fold = (body) => `<details class="fold" open><summary>Services and running units <span class="src">chorus:hosts &rarr; chorus:Service &larr; chorus:runsService (the services crawl)</span></summary><div class="body">${body}</div></details>`;
  try {
    const why = (window.FOLD_NOTES || {}).Services;   // #5021 — the written reason, when there is one
    if (!svcs.length) { el.innerHTML = fold((why ? `<p class="note"><strong>Why empty:</strong> ${esc(why)}</p>` : '') + `<p class="empty">The model names no service this domain hosts &mdash; add <code>chorus:${esc(d)} chorus:hosts &lt;service&gt;</code>.</p>`); return; }
    const [inst, jobs] = await Promise.all([fetchJSON('/serviceinstances?limit=500'), fetchJSON('/scheduledjobs?limit=500')]);
    const units = [...(inst.data || []).map(u => ({ ...u, kind: 'instance' })), ...(jobs.data || []).map(u => ({ ...u, kind: 'job' }))];
    el.innerHTML = fold(svcs.map(full => {
      const name = full.replace(/^service-/, '');
      const mine = units.filter(u => runsServiceNames(u.runsService, name));
      const rows = mine.map(u => `<tr><td>${esc(u.launchdLabel || u.label || u.name)}</td><td>${esc(u.kind)}</td><td>${esc(u.onMachine || '')}</td><td>${esc(unitState(u))}</td></tr>`).join('');
      return `<h3><a class="edge" href="service.html?s=${encodeURIComponent(name)}">${esc(name)}</a> <small>${mine.length} unit(s)</small></h3>` +
        (mine.length ? `<table><thead><tr><th>Unit</th><th>Kind</th><th>Machine</th><th>State</th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="empty">the crawl found no launchd unit running this service</p>');
    }).join(''));
  } catch (e) { el.innerHTML = fold(`<p class="empty"><strong>Cannot reach the model</strong> for services &mdash; fetch failure. ${esc(String(e && e.message || e))}</p>`); }
}

// #4235 — the files the crawl tagged with this domain (CodeFile hasDomain), from the
// graph. A file is listed because the crawl measured it, never because a list said so.
async function renderFiles(d) {
  const el = document.getElementById('files-slot');
  const fold = (n, body) => `<details class="fold"${n && n <= 40 ? ' open' : ''}><summary>Files (${n}) <span class="src">chorus:CodeFile &rarr; chorus:hasDomain (the code crawl)</span></summary><div class="body">${body}</div></details>`;
  try {
    // #5040 — read from the model door's own collection, filtered there on hasDomain (a GET the
    // sign-in door serves). It was a query POSTed to the store, which the door refuses: 405.
    // Every page of the collection is followed, so a domain with many files is not cut short.
    const paths = [];
    for (let next = `/code/files?hasDomain=${encodeURIComponent(d)}&limit=1000`, pages = 0; next && pages < 20; pages++) {
      const env = await fetchJSON(next);
      for (const f of (env.data || [])) if (f.filePath) paths.push(String(f.filePath));
      next = env.links && env.links.next ? String(env.links.next).replace(/^\/v1/, '') : null;
    }
    paths.sort();
    if (!paths.length) { el.innerHTML = fold(0, `<p class="empty">The crawl tagged no file with this domain.</p>`); return; }
    el.innerHTML = fold(paths.length, `<div class="tbl"><table><tbody>${paths.map(p => `<tr><td><code>${esc(p)}</code></td></tr>`).join('')}</tbody></table></div>`);
  } catch (e) { el.innerHTML = fold('?', `<p class="empty"><strong>Cannot reach the model</strong> for files &mdash; fetch failure. ${esc(String(e && e.message || e))}</p>`); }
}

// ---- the materialized view (#3635, Jeff's ruling 2026-07-12): the domain instance
// page MUST conform to the 17-facet materialized view (domain-renderer.js contract) —
// live graph-derived facets: cards, code, tests, alerts, logs, decisions, deps, etc.
// Same endpoints as /domain.html; rendered in the family's design vocabulary.
async function renderFacets(d) {
  // #4093 — one renderer (facets.js); this page draws every facet
  const fid = await resolveFacetId(d);
  // #4285 — Jeff, 2026-09-24: ONE Gaps section (the model's text and the
  // graph's gap rows together), and Actors + Scenarios belong with the Model,
  // not at the bottom under the operational folds.
  const withModel = ['Actors', 'Scenarios'];
  const withGaps = ['Gaps & Status'];
  await Promise.all([
    renderFacetTables(document.getElementById('gaps-facet'), fid, { only: withGaps, heading: () => 'from the graph' }),
    renderFacetTables(document.getElementById('model-facets'), fid, { only: withModel }),
    renderFacetTables(document.getElementById('facets'), fid, { except: withModel.concat(withGaps), domain: d, notes: window.FOLD_NOTES || {} }),
  ]);
}
</script>
</body></html>
