<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service — Athena</title>
<!-- #4010 — the per-service page. This is where a service DESIGN is read: the
     ServiceShape design fields (overview / asIs / toBe / gaps / notInScope /
     pathToClose) live in the graph and had no reader until now. The page shows
     what the API serves and names what it withholds, per the ADR-048 tiers
     Silas set: public = overview/asIs/toBe, signed-in = gaps/notInScope/
     pathToClose, secret = implementationPlan. -->
<script>window.OWL_PORT = 3360;</script>
<link rel="stylesheet" href="athena-flow.css"><script src="athena-flow.js"></script><script src="facets.js"></script><script src="history-fold.js"></script><script>mountJourneyNav('services');</script><script>/* #3810 — the page teaches itself its mount, with nothing to fetch. */
(function(){var m=document.querySelector('meta[name="chorus-base"]'),b=m&&m.getAttribute('content')||null;
if(b===null){var p=(location&&location.pathname)||'';b=(p==='/chorus'||p.indexOf('/chorus/')===0)?'/chorus':'';}
b=b.replace(/\/+$/,'');window.CHORUS_BASE=b;
window.basePath=function(x){if(!x)return b||'/';if(/^[a-z]+:\/\//i.test(x)||x.indexOf('//')===0)return x;
return b+(x.charAt(0)==='/'?x:'/'+x);};
var s=document.createElement('script');s.src=window.basePath('/js/base-path.js');document.head.appendChild(s);}());</script>
<script>document.write('<script src="'+window.basePath('/js/vendor/mermaid.min.js')+'"><\/script>');</script>   <!-- #4093 — after basePath exists; same include product.html (#4094) and class-atlas.html use -->
</head>
<body><div class="wrap">
<div class="crumb"><a href="value-stream.html">value stream</a> &rarr; <a href="services.html">services</a> &rarr; <span id="crumb"></span></div>
<h1 id="title">Service</h1>
<div id="main"><p class="empty">loading live from the model&hellip;</p></div>
</div>
<script>
(async function () {
  const main = document.getElementById('main');
  const s = new URLSearchParams(location.search).get('s') || '';
  document.getElementById('crumb').textContent = s;
  if (!s) { main.innerHTML = '<p class="empty">no service named &mdash; try <a href="services.html">the services list</a>.</p>'; return; }
  try {
    const env = await fetchJSON(`/services/${encodeURIComponent(s)}`);
    const e = env.data || {};
    const links = env.links || {};
    document.getElementById('title').innerHTML = `${esc(e.label || s)} <span class="kind">&mdash; Service</span>`;

    // The design, in the order it is read: what it is, where it stands, where
    // it is going, what is missing, what it deliberately is not, how it closes.
    const SECTIONS = [
      ['overview',    'Overview',      'chorus:overview',    'public'],
      ['asIs',        'As is',         'chorus:asIs',        'public'],
      ['toBe',        'To be',         'chorus:toBe',        'public'],
      ['gaps',        'Gaps',          'chorus:gaps',        'signed-in'],
      ['notInScope',  'Not in scope',  'chorus:notInScope',  'signed-in'],
      ['pathToClose', 'Path to close', 'chorus:pathToClose', 'signed-in'],
    ];
    const folds = SECTIONS.map(([k, label, path, tier]) => e[k]
      ? `<details class="fold" open><summary>${esc(label)} <span class="src">${esc(path)}</span></summary><div class="body"><p>${esc(e[k])}</p></div></details>`
      : `<details class="fold"><summary>${esc(label)} <span class="src">${esc(path)} &mdash; withheld (${esc(tier)})</span></summary><div class="body"><p class="empty">Present in the model, not returned to this caller. ADR-048 exposure, not a missing field.</p></div></details>`
    );

    const PLURAL = 'services', ROWNAME = s, CURRENT = e;
    // #4102 — History: the fold is shared by product, service and document
    // (athena/history-fold.js) so one change to how a diff reads changes all three.
    const histHtml = await historyFold('services', s, rowWithLinks(env));

    main.innerHTML = `
<div class="stats">
  <div class="stat"><div class="v">${ownerDot(links.ownedBy)}</div><div class="l">Owner (ownedBy)</div></div>
  <div class="stat"><div class="v">${stepBadge(links.atStep)}</div><div class="l">Step (atStep)</div></div>
  <div class="stat"><div class="v">${esc(e.status || 'no status')}</div><div class="l">Status</div></div>
  <div class="stat"><div class="v">${SECTIONS.filter(([k]) => e[k]).length}/${SECTIONS.length}</div><div class="l">Design sections served</div></div>
  <div class="stat"><div class="v">${e.version ? 'v' + esc(String(e.version)) + (e.docState ? ' · ' + esc(String(e.docState)) : '') + ' · ' + esc((d => isNaN(d) ? String(e.changedAt || '').slice(0, 10) : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`)(new Date(String(e.changedAt || '')))) : '<span class="empty">not yet saved through the API</span>'}</div><div class="l">Version · state · last changed</div></div>
</div>
${folds.join('\n')}
${histHtml}
<h2 class="eng">Engineering</h2>
<details class="fold" open id="flows-fold"><summary>Flows <span class="src">chorus:diagram (mermaid)</span></summary><div class="body" id="flows-body"><p class="empty">Loading diagrams&hellip;</p></div></details>
<details class="fold" open id="runsas-fold"><summary>Runs as <span class="src">chorus:ServiceInstance / chorus:ScheduledJob &rarr; chorus:runsService</span></summary><div class="body" id="runsas-body"><p class="empty">Loading harvested units&hellip;</p></div></details>
<div id="domain-facets"><p class="empty">Loading the hosting domain&rsquo;s facets&hellip;</p></div>
${srcNote(`GET /services/${esc(s)} &middot; /serviceinstances &middot; /scheduledjobs &middot; the hosting domain's materialized facets`)}`;
  } catch (e) { fetchFailed(main, e); }
  // ---- #4093 — the engineering half. Jeff, 2026-09-03: "our service designs seem rather
  // untechnical, more like a pm view" and "the domains ultimately will show true state".
  // A service page COMPOSES its hosting domain's facets (one renderer, facets.js) and adds
  // only what a service owns: flows and runs-as (commitments retired, #4064). Every chapter tells an empty
  // model apart from a fetch failure.
  const asArray = v => Array.isArray(v) ? v : (v === undefined || v === null || v === '' ? [] : [v]);

  // Flows — chorus:diagram is repeatable; the entity read serves one string for a repeated
  // literal, the collection row keeps the list (Wren, #4094), so read the row.
  try {
    const body = document.getElementById('flows-body');
    const col = await fetchJSON('/services?limit=300');
    const row = (col.data || col.items || []).find(r => r.name === s) || {};
    const ds = asArray(row.diagram).map(String).map(v => { const ls = v.trim().split('\n'); const cap = ls[0].startsWith('%%') ? ls.shift().replace(/^%%\s*/, '') : ''; return { caption: cap, src: ls.join('\n').trim() }; });
    if (!ds.length) { body.innerHTML = '<p class="empty">No diagram on this service yet &mdash; the model serves none, not a fetch failure.</p>'; }
    else {
      body.innerHTML = ds.map((d, di) => `<figure class="dg"><figcaption>${esc(d.caption || `Diagram ${di + 1}`)}</figcaption><div class="mmd" data-i="${di}"></div></figure>`).join('');
      if (window.mermaid) {
        mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: 'neutral' });
        for (const el of body.querySelectorAll('figure.dg .mmd')) {
          const d = ds[Number(el.dataset.i)];
          try { const { svg } = await mermaid.render(`dg_${s.replace(/[^a-z0-9]/gi, '_')}_${el.dataset.i}`, d.src); el.innerHTML = svg; }
          catch (err) { el.innerHTML = `<div class="mmd-err">diagram source did not render: ${esc(String(err && err.message || err).slice(0, 120))}</div>`; }
        }
      } else { for (const el of body.querySelectorAll('figure.dg .mmd')) el.innerHTML = '<div class="mmd-err">mermaid did not load; source held in the model</div>'; }
    }
  } catch (e) { const b = document.getElementById('flows-body'); if (b) b.innerHTML = `<p class="empty"><strong>Cannot reach the model</strong> for diagrams &mdash; fetch failure. ${esc(String(e && e.message || e))}</p>`; }

  // Runs as — the harvested launchd units whose runsService edge names this service.
  try {
    const body = document.getElementById('runsas-body');
    const [inst, jobs] = await Promise.all([fetchJSON('/serviceinstances?limit=500'), fetchJSON('/scheduledjobs?limit=500')]);
    const mine = r => String(r.runsService || '') === s || String(r.runsService || '').endsWith(':' + s);
    const rows = [...(inst.data || []).filter(mine).map(r => ({ ...r, kind: 'instance' })), ...(jobs.data || []).filter(mine).map(r => ({ ...r, kind: 'job' }))];
    if (!rows.length) { body.innerHTML = `<p class="empty">No harvested unit names this service (${(inst.data || []).length} instances, ${(jobs.data || []).length} jobs served). If one should, map it in platform/config/service-instance-map.json.</p>`; }
    else {
      const tr = rows.map(r => `<tr><td>${esc(r.launchdLabel || r.label || r.name)}</td><td>${esc(r.kind)}</td><td>${esc(r.onMachine || '')}</td><td>${esc(r.runState || r.lastExitCode || '')}</td><td>${esc(String(r.lastObserved || '').slice(0, 16))}</td></tr>`).join('');
      body.innerHTML = `<p><strong>${rows.length}</strong> unit(s)</p><table><thead><tr><th>Unit</th><th>Kind</th><th>Machine</th><th>State</th><th>Observed</th></tr></thead><tbody>${tr}</tbody></table>`;
    }
  } catch (e) { const b = document.getElementById('runsas-body'); if (b) b.innerHTML = `<p class="empty"><strong>Cannot reach the model</strong> for units &mdash; fetch failure. ${esc(String(e && e.message || e))}</p>`; }

  // The hosting domain: chorus:hosts lives in the ontology graph and is not on the served
  // row, so ask the read-only SPARQL door for it; then compose its facets.
  try {
    const el = document.getElementById('domain-facets');
    const q = `PREFIX chorus: <https://jeffbridwell.com/chorus#> SELECT ?d WHERE { GRAPH <urn:chorus:ontology> { ?d chorus:hosts chorus:${s} } } LIMIT 1`;
    const r = await fetch(window.basePath('/sparql-read'), { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/sparql-results+json' }, body: JSON.stringify({ query: q }) });
    if (!r.ok) throw new Error(`sparql-read ${r.status}`);
    const j = await r.json();
    const iri = String(((((j.results || {}).bindings || [])[0] || {}).d || {}).value || '');
    if (!iri) { el.innerHTML = '<details class="fold" open><summary>Hosting domain <span class="src">chorus:hosts</span></summary><div class="body"><p class="empty">No domain hosts this service in the model &mdash; add <code>&lt;domain&gt; chorus:hosts chorus:' + esc(s) + '</code>.</p></div></details>'; }
    else {
      const local = iri.split('#').pop();
      const d = local.replace(/-domain$/, '');
      const fid = await resolveFacetId(d);
      const heading = t => ({ 'API Contract': 'Interfaces', 'Persistence': 'Data', 'Dependencies': 'Depends on', 'Tests': 'Tests', 'Code': 'Code', 'Logs': 'Logs', 'Alerts': 'Alerts' })[t] || t;
      await renderFacetTables(el, fid, { only: ['API Contract', 'Persistence', 'Dependencies', 'Tests', 'Code', 'Logs', 'Alerts'], heading, src: `from domain <a href="domain.html?d=${encodeURIComponent(d)}">${esc(d)}</a> &middot; materialized &middot; live` });
    }
  } catch (e) { const el = document.getElementById('domain-facets'); if (el) el.innerHTML = `<p class="empty"><strong>Cannot reach the hosting domain</strong> &mdash; fetch failure, not an empty design. ${esc(String(e && e.message || e))}</p>`; }
})();
</script>
</body></html>
