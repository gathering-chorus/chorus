<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model — Athena</title>
<!-- #3706 — the class-model view. Wireframe agreed with Jeff 2026-07-31: pick a class
     from the list (left), see it and its one-hop associations as UML boxes with elbow
     connectors (centre), full attribute table + provenance (right).
     PROJECTED live from owl-api on every load — GET / (Discovery: the shaped primitives)
     + GET /schema/<class> per class. No hand-maintained class list; if the model
     changes this page changes. Supersedes the census shape (rejected 2026-07-30 —
     counts answer "how many", not "what are the classes and what is in them").
     Legacy is filtered OUT by default. What the page cannot draw, it says. -->
<!-- #3739 — the DOMAIN layer, default view. Nodes are domains, edges are induced
     by definesVocabulary + rdfs:domain/range via /api/athena/model-relationships —
     generated from the live graph on every load, no hand-maintained node or edge
     list. Isolated domains render dashed and are NAMED: an unconnected domain is
     a finding about the model, not something to hide. Click a domain to drill to
     its classes and their typed edges; every edge links to its target. -->
<script>window.OWL_PORT = 3360;</script>
<link rel="stylesheet" href="athena-flow.css"><script src="athena-flow.js"></script><script>mountJourneyNav('model');</script>
<script src="/js/vendor/mermaid.min.js"></script>
<style>
  .mwrap{display:grid;grid-template-columns:218px minmax(0,1fr) 300px;
         border:1px solid var(--line,#d8dee6);border-radius:4px;overflow:hidden;
         min-height:560px;background:var(--panel,#fff)}
  @media (max-width:1000px){.mwrap{grid-template-columns:1fr}}
  .mcol{padding:12px 13px;min-width:0}
  .mcol+.mcol{border-left:1px solid var(--line,#e6eaef)}
  @media (max-width:1000px){.mcol+.mcol{border-left:0;border-top:1px solid var(--line,#e6eaef)}}
  .mlab{font:600 9.5px system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;
        color:var(--muted,#8a94a3);margin-bottom:7px;display:block}
  .mchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .mchip{font:500 11.5px system-ui,sans-serif;padding:5px 9px;border:1px solid var(--line,#cdd5de);
         background:var(--panel,#fff);color:var(--muted,#5b6675);border-radius:2px;cursor:pointer}
  .mchip:hover{border-color:#0d6a89}
  .mchip[aria-pressed="true"]{background:#16202b;border-color:#16202b;color:#fff;font-weight:600}
  #mq{width:100%;padding:6px 8px;border:1px solid var(--line,#cdd5de);border-radius:2px;
      font:400 12px ui-monospace,Menlo,monospace;margin-bottom:9px;background:var(--panel,#fff);color:inherit}
  .mlist{max-height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
  .mli{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:2px;
       font:500 12px ui-monospace,Menlo,monospace;color:inherit;background:none;
       border:1px solid transparent;cursor:pointer;text-align:left;width:100%}
  .mli:hover{background:var(--hover,#f4f7fa)}
  .mli[aria-current="true"]{background:var(--hover,#f4f7fa);border-color:#0d6a89}
  .mli small{margin-left:auto;color:var(--muted,#a8b0bb);font:400 10px ui-monospace,monospace}
  .mstage{position:relative;overflow-x:auto;
          background:radial-gradient(circle,var(--line,#e9edf2) 1px,transparent 1px) 0 0/22px 22px}
  .mplane{position:relative}

  .mbox.main{width:190px;border:2px solid #0d6a89}

  .mtag{margin-left:auto;font:600 8px system-ui,sans-serif;letter-spacing:.06em;

  .mbb{padding:4px 0}

       color:var(--muted,#5b6675);white-space:nowrap}

  .minsp h2{margin:0 0 8px;font:600 16px ui-monospace,monospace;word-break:break-word}

  .mrel button:hover{text-decoration:underline}

  .mstrip{display:flex;gap:20px;flex-wrap:wrap;padding:11px 14px;
          border:1px solid var(--line,#d8dee6);border-top:0;background:var(--hover,#f6f8fa);
          border-radius:0 0 4px 4px;font:400 10.5px system-ui,sans-serif;color:var(--muted,#5b6675)}
  .mtally{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 14px;font-variant-numeric:tabular-nums}
  .mtally b{font:600 16px ui-monospace,monospace}
  .mtally span{font-size:11px;color:var(--muted,#5b6675);margin-left:5px}
</style>
<script>/* #3810 — the page teaches itself its mount, with nothing to fetch.
   A root-absolute src on the loader tag is the trap: from /chorus/ the browser resolves it
   against the apex, asks the garden site, gets a 404 — so the file that would have told
   this page where it lives can never load. Chicken-and-egg, and it left three correct
   fixes underneath it inert. Relative src was rejected: it breaks the no-trailing-slash
   entry and needs ../ depth per page, which is per-page compensation for a mount.
   No request, so nothing can escape the mount. At root BASE is '' and URLs are unchanged. */
(function(){var m=document.querySelector('meta[name="chorus-base"]'),b=m&&m.getAttribute('content')||null;
if(b===null){var p=(location&&location.pathname)||'';b=(p==='/chorus'||p.indexOf('/chorus/')===0)?'/chorus':'';}
b=b.replace(/\/+$/,'');window.CHORUS_BASE=b;
window.basePath=function(x){if(!x)return b||'/';if(/^[a-z]+:\/\//i.test(x)||x.indexOf('//')===0)return x;
return b+(x.charAt(0)==='/'?x:'/'+x);};
/* the DOM-rewriter still has a job (root-absolute hrefs must stay inside the mount);
   it is fetched THROUGH the base this snippet just computed, so it cannot escape. */
var s=document.createElement('script');s.src=window.basePath('/js/base-path.js');document.head.appendChild(s);}());</script>
</head>
<body><div class="wrap wide">
<div class="crumb"><a href="value-stream.html">value stream</a> &rarr; model</div>
<h1>Model <span class="kind">&mdash; classes &amp; relations</span></h1>
<div class="mtally" id="tally"></div>
<div id="main"><p class="empty">loading live from the model&hellip;</p></div>
</div>

<script>
(async function () {
  const main = document.getElementById('main');
  let CLASSES = {}, EDGES = [], focus = null, q = '';
  let fState = { target: 1, legacy: 0, unclassified: 1 };
  // #3739 — the domain layer. REL is the induced model from the live graph;
  // layer is 'domains' (default), 'drill' (one domain's classes) or 'classes'.
  let REL = null, layer = 'domains', drillDomain = null;

  const stateOf = k => {
    const s = (CLASSES[k] || {}).state;
    if (s === 'target' || s === 'v2') return 'target';
    if (s === 'legacy' || s === 'v1') return 'legacy';
    return 'unclassified';
  };
  const pass = k => !!fState[stateOf(k)] && (!q || k.toLowerCase().includes(q));
  const W = k => (k === focus ? 190 : 158);
  const H = k => {
    const n = CLASSES[k].attrs.length;
    return 30 + Math.min(n, 8) * 16 + (n > 8 ? 15 : 0) + (n ? 9 : 20);
  };

  try {
    // #3706 — ONE request. GET /schema is the bulk SchemaSet: every shaped class
    // with its fields, mandatory floor and modelVersion, from the same
    // RouteTables the per-class /schema/<class> route reads. The first cut of
    // this page fetched Discovery + a schema + a collection PER CLASS — 42
    // round-trips to draw one screen. Milliseconds on loopback; it hung on
    // Jeff's phone over wifi through the /owl proxy. A view of the model should
    // cost one call.
    const set = await fetchJSON('/schema');
    for (const c of (set.classes || [])) {
      const kind = c.kind, schema = c, ver = c.modelVersion;
      const mand = new Set(schema.mandatory || []);
      const attrs = (schema.fields || []).map(f => {
        const i = f.indexOf('|');
        const n = i < 0 ? f : f.slice(0, i);
        const kindStr = i < 0 ? '' : f.slice(i + 1);
        const edge = kindStr.startsWith('edge:');
        const t = edge ? kindStr.slice(5)
          : kindStr.startsWith('datatype:') ? kindStr.slice(9) : 'untyped';
        return { n, t, edge, req: mand.has(n) };
      });
      CLASSES[kind] = { attrs, state: ver || 'unclassified' };
    }
    Object.keys(CLASSES).forEach(k =>
      CLASSES[k].attrs.filter(a => a.edge).forEach(a => EDGES.push([k, a.n, a.t])));

    if (!Object.keys(CLASSES).length) {
      main.innerHTML = '<div class="err">The model API served no shaped classes — that is the graph\'s answer, not a fetch failure.</div>';
      return;
    }
    focus = CLASSES.Domain ? 'Domain' : Object.keys(CLASSES).sort()[0];
  } catch (e) { fetchFailed(main, e); return; }

  // #3739 — the relationships endpoint is chorus-api itself (same origin), not
  // the owl proxy. A failed fetch falls back to the class layer with the domain
  // layer reporting WHY — never an empty diagram read as "no relationships".
  try {
    const r = await fetch('/api/athena/model-relationships');
    REL = r.ok ? await r.json() : { storeReachable: false, http: r.status };
  } catch (e) { REL = { storeReachable: false, err: String(e) }; }
  if (typeof mermaid !== 'undefined') mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
  route();

  function route() {
    if (layer === 'domains') renderDomains();
    else if (layer === 'drill') renderDrill();
    else render();
  }

  function layerBar(active) {
    const b = (id, txt) => '<button class="mchip" aria-pressed="' + (active === id) +
      '" data-layer="' + id + '">' + txt + '</button>';
    return '<div class="mchips" style="margin-bottom:10px">' + b('domains', 'Domains') +
      (active === 'drill' && drillDomain ? b('drill', esc(drillDomain)) : '') +
      b('classes', 'Classes') + '</div>';
  }

  function bindLayer() {
    Array.prototype.forEach.call(main.querySelectorAll('[data-layer]'), function (el) {
      el.onclick = function () { layer = el.getAttribute('data-layer'); route(); };
    });
  }

  async function renderDomains() {
    if (!REL || !REL.storeReachable) {
      main.innerHTML = layerBar('domains') +
        '<div class="err">The domain layer could not be read from the store' +
        (REL && REL.http ? ' (HTTP ' + esc(String(REL.http)) + ')' : '') +
        ' — this is NOT an empty model. The class layer below still serves.</div>';
      bindLayer(); return;
    }
    const edges = REL.domainEdges || [], iso = REL.isolatedDomains || [];
    const ids = {}, names = [];
    (REL.domains || []).forEach(function (d, i) { ids[d] = 'd' + i; names.push(d); });
    const nCls = d => ((REL.vocabulary || {})[d] || []).length;
    let src = 'graph LR\n';
    const inGraph = new Set();
    edges.forEach(function (e) { inGraph.add(e.from); inGraph.add(e.to); });
    inGraph.forEach(function (d) {
      src += '  ' + ids[d] + '["' + d + ' (' + nCls(d) + ')"]\n';
    });
    edges.forEach(function (e) {
      src += '  ' + ids[e.from] + ' -->|' + e.count + '| ' + ids[e.to] + '\n';
    });
    let svg = '';
    try {
      const out = await mermaid.render('erd3739', src);
      svg = out.svg;
    } catch (e) {
      main.innerHTML = layerBar('domains') + '<div class="err">mermaid could not lay out the domain graph: ' +
        esc(String(e)) + '</div>'; bindLayer(); return;
    }
    const total = edges.reduce(function (s, e) { return s + e.count; }, 0);
    main.innerHTML = layerBar('domains') +
      '<div class="mwrap" style="display:block"><div class="mcol mstage" id="erdstage" style="overflow:auto">' + svg + '</div></div>' +
      '<div class="mstrip">' +
        '<div><b>' + inGraph.size + '</b> connected domains, <b>' + edges.length + '</b> domain&rarr;domain edges, ' +
          '<b>' + total + '</b> class-level properties behind them &mdash; induced from the live graph on this load.</div>' +
        '<div><b>' + iso.length + '</b> isolated (vocabulary, zero relationships): ' +
          (iso.length ? iso.map(function (d) { return '<button class="mchip" data-drill="' + esc(d) + '" style="padding:1px 6px">' + esc(d) + '</button>'; }).join(' ')
                      : 'none') +
          ' &mdash; an isolated domain is a real finding about the model.</div>' +
        '<div>Click a domain to drill to its classes and edges.</div>' +
      '</div>';
    document.getElementById('tally').innerHTML =
      '<div><b>' + (REL.domains || []).length + '</b><span>domains</span></div>' +
      '<div><b>' + edges.length + '</b><span>edges</span></div>' +
      '<div><b style="color:#a8226b">' + iso.length + '</b><span>isolated</span></div>';
    bindLayer();
    // every rendered node is a drill link — mermaid ids embed ours (flowchart-dN-…)
    names.forEach(function (d) {
      Array.prototype.forEach.call(
        main.querySelectorAll('[id*="flowchart-' + ids[d] + '-"]'),
        function (node) { node.style.cursor = 'pointer';
          node.onclick = function () { drillDomain = d; layer = 'drill'; route(); }; });
    });
    Array.prototype.forEach.call(main.querySelectorAll('[data-drill]'), function (el) {
      el.onclick = function () { drillDomain = el.getAttribute('data-drill'); layer = 'drill'; route(); };
    });
  }

  function renderDrill() {
    const d = drillDomain;
    if (!REL || !REL.storeReachable || !d) { layer = 'domains'; return renderDomains(); }
    const owned = (REL.vocabulary || {})[d] || [];
    const ce = (REL.classEdges || []);
    const rows = owned.map(function (cls) {
      const out = ce.filter(function (e) { return e.fromClass === cls; });
      const inc = ce.filter(function (e) { return e.toClass === cls && e.fromClass !== cls; });
      const lin = function (e, dir) {
        const target = dir === 'out' ? e.toClass : e.fromClass;
        const tDom = dir === 'out' ? e.toDomain : e.fromDomain;
        const jump = tDom && tDom !== d
          ? '<button data-drill="' + esc(tDom) + '">' + esc(target) + ' &middot; ' + esc(tDom) + '</button>'
          : (CLASSES[target] ? '<button data-class="' + esc(target) + '">' + esc(target) + '</button>' : esc(target));
        return '<div class="mrel">' + (dir === 'out'
          ? '<em>' + esc(e.property) + '</em> &rarr; ' + jump
          : jump + ' <em>' + esc(e.property) + '</em> &rarr; this') + '</div>';
      };
      return '<div class="msect"><span class="mlab">' + esc(cls) +
        (CLASSES[cls] ? ' &mdash; <button data-class="' + esc(cls) + '" style="font:inherit">class diagram</button>' : ' <small>(no shape &mdash; not served)</small>') + '</span>' +
        (out.length || inc.length
          ? out.map(function (e) { return lin(e, 'out'); }).join('') + inc.map(function (e) { return lin(e, 'in'); }).join('')
          : '<p class="mempty">no typed edges — isolated class</p>') + '</div>';
    }).join('');
    main.innerHTML = layerBar('drill') +
      '<div class="mwrap" style="display:block"><div class="mcol">' +
      '<h2 style="font:600 16px ui-monospace,monospace;margin:0 0 10px">' + esc(d) +
      ' <small style="color:var(--muted,#8a94a3)">' + owned.length + ' classes</small></h2>' +
      (rows || '<p class="mempty">This domain declares no vocabulary.</p>') + '</div></div>';
    bindLayer();
    Array.prototype.forEach.call(main.querySelectorAll('[data-drill]'), function (el) {
      el.onclick = function () { drillDomain = el.getAttribute('data-drill'); route(); };
    });
    Array.prototype.forEach.call(main.querySelectorAll('[data-class]'), function (el) {
      el.onclick = function () { focus = el.getAttribute('data-class'); layer = 'classes'; route(); };
    });
  }

  function render() {
    const keys = Object.keys(CLASSES).filter(pass).sort();
    if (keys.length && !keys.includes(focus)) focus = keys[0];

    const out = [], inc = [], so = new Set(), si = new Set();
    EDGES.forEach(([a, p, b]) => {
      if (a === focus && b !== focus && CLASSES[b] && !so.has(b)) { so.add(b); out.push({ k: b, p }); }
      if (b === focus && a !== focus && CLASSES[a] && !si.has(a)) { si.add(a); inc.push({ k: a, p }); }
    });

    // column pitch adapts to the stage width so the outgoing column is never
    // clipped off the right edge on a narrow window (the boxes still scroll if
    // the viewport is genuinely too small, but the default fits).
    const stageW = (document.querySelector('.mstage') || {}).clientWidth || 700;
    const COL = Math.max(196, Math.min(268, Math.floor((stageW - 190) / 2)));
    const GAP = 20, X0 = 14, TOP = 26;
    const stack = a => a.length ? a.reduce((s, i) => s + H(i.k) + GAP, -GAP) : 0;
    const hF = H(focus);
    const tall = Math.max(hF, stack(inc), stack(out), 230);
    const pos = { [focus]: [X0 + COL, TOP + (tall - hF) / 2] };
    let y = TOP + (tall - stack(inc)) / 2;
    inc.forEach(i => { pos[i.k] = [X0, y]; y += H(i.k) + GAP; });
    y = TOP + (tall - stack(out)) / 2;
    out.forEach(i => { pos[i.k] = [X0 + COL * 2, y]; y += H(i.k) + GAP; });

    let wires = '<defs><marker id="mar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" ' +
      'orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#0d6a89" stroke-width="1.3"/></marker></defs>';
    const wire = (a, b, p) => {
      const A = pos[a], B = pos[b]; if (!A || !B) return;
      const x1 = A[0] + W(a), y1 = A[1] + H(a) / 2;
      const x2 = B[0], y2 = B[1] + H(b) / 2, mx = (x1 + x2) / 2;
      wires += '<path class="mlink" marker-end="url(#mar)" d="M' + x1 + ' ' + y1 + ' H' + mx +
        ' V' + y2 + ' H' + x2 + '"/><text class="mlbl" x="' + mx + '" y="' + ((y1 + y2) / 2 - 5) +
        '" text-anchor="middle">' + esc(p) + '</text>';
    };
    inc.forEach(i => wire(i.k, focus, i.p));
    out.forEach(i => wire(focus, i.k, i.p));

    const boxes = Object.keys(pos).map(k => {
      const c = CLASSES[k], st = stateOf(k);
      const rows = c.attrs.length
        ? c.attrs.slice(0, 8).map(a =>
            '<div class="mat' + (a.edge ? ' edge' : '') + '"><span class="mn">' + esc(a.n) +
            (a.req ? '<span class="req"> *</span>' : '') + '</span><span class="mv">' + esc(a.t) + '</span></div>'
          ).join('') + (c.attrs.length > 8 ? '<div class="more">+ ' + (c.attrs.length - 8) + ' more</div>' : '')
        : '<div class="none">no shape attributes</div>';
      return '<div class="mbox' + (k === focus ? ' main' : '') + '" data-go="' + esc(k) +
        '" style="left:' + pos[k][0] + 'px;top:' + pos[k][1] + 'px"><div class="mbh">' + esc(k) +
        '<span class="mtag ' + st + '">' + (st === 'unclassified' ? 'UNCL' : st.toUpperCase()) +
        '</span></div><div class="mbb">' + rows + '</div></div>';
    }).join('');

    const c = CLASSES[focus];
    const insp =
      '<div class="msect"><span class="mlab">Class</span><h2>' + esc(focus) + '</h2>' +
        '<span class="mtag ' + stateOf(focus) + '">' + stateOf(focus).toUpperCase() + '</span></div>' +
      '<div class="msect"><span class="mlab">Attributes — ' + c.attrs.length + '</span>' +
      (c.attrs.length
        ? '<table><tr><th>name</th><th style="text-align:right">type</th></tr>' +
          c.attrs.map(a => '<tr><td class="tn">' + esc(a.n) +
            (a.req ? ' <span style="color:#a8226b">*</span>' : '') + '</td><td class="tv' +
            (a.edge ? ' edge' : '') + '">' + esc(a.t) + '</td></tr>').join('') + '</table>' +
          '<p class="mempty" style="margin-top:5px">* required — the shape\'s sh:minCount &ge; 1 floor.</p>'
        : '<p class="mempty">This class has a shape but no direct-path attributes.</p>') + '</div>' +
      '<div class="msect"><span class="mlab">Associations out — ' + out.length + '</span>' +
      (out.length ? out.map(i => '<div class="mrel"><em>' + esc(i.p) + '</em> &rarr; <button data-go="' +
          esc(i.k) + '">' + esc(i.k) + '</button></div>').join('') : '<p class="mempty">none</p>') + '</div>' +
      '<div class="msect"><span class="mlab">Associations in — ' + inc.length + '</span>' +
      (inc.length ? inc.map(i => '<div class="mrel"><button data-go="' + esc(i.k) + '">' + esc(i.k) +
          '</button> <em>' + esc(i.p) + '</em> &rarr; this</div>').join('') : '<p class="mempty">none</p>') + '</div>' +
      '<div class="msect"><span class="mlab">Provenance</span><div class="mrel">urn:chorus:ontology</div>' +
      '<div class="mrel">shape: chorus:' + esc(focus) + 'Shape</div>' +
      '<p class="mempty" style="margin-top:4px">Projected from the shape on every load — never a stored copy.</p></div>';

    main.innerHTML = layerBar('classes') +
      '<div class="mwrap"><div class="mcol"><span class="mlab">State</span>' +
        '<div class="mchips" id="fst"></div><span class="mlab">Classes — ' + keys.length + '</span>' +
        '<input id="mq" type="search" placeholder="find a class…" aria-label="Find a class" value="' + esc(q) + '">' +
        '<div class="mlist">' + keys.map(k => '<button class="mli" data-go="' + esc(k) + '" aria-current="' +
          (k === focus) + '">' + esc(k) + '<small>' + CLASSES[k].attrs.length + '</small></button>').join('') +
        '</div></div>' +
      '<div class="mcol mstage"><div class="mplane" style="height:' + Math.max(tall + TOP + 50, 560) +
        'px;width:' + (X0 + COL * 2 + 220) + 'px"><svg>' + wires + '</svg>' + boxes + '</div></div>' +
      '<div class="mcol minsp">' + insp + '</div></div>' +
      '<div class="mstrip">' +
        '<div><b>' + Object.keys(CLASSES).length + '</b> classes are SERVED — a class is served only if it has a SHACL shape.</div>' +
        '<div>Shapeless classes cannot appear here. Their retirement is measured in the graph, not served (the API serves the target model).</div>' +
        '<div>Attribute <b>source</b> (rdfs:domain vs shape) is not projected yet — this page shows the shape.</div>' +
      '</div>';

    const cnt = s => Object.keys(CLASSES).filter(k => stateOf(k) === s).length;
    document.getElementById('tally').innerHTML =
      '<div><b style="color:#177a56">' + cnt('target') + '</b><span>target</span></div>' +
      '<div><b style="color:#8f5f0d">' + cnt('legacy') + '</b><span>legacy</span></div>' +
      '<div><b style="color:#a8226b">' + cnt('unclassified') + '</b><span>unclassified</span></div>' +
      '<div><b>' + keys.length + '</b><span>in filter</span></div>';

    const fst = document.getElementById('fst');
    [['target', 'Target'], ['legacy', 'Legacy'], ['unclassified', 'Unclassified']].forEach(function (p) {
      const b = document.createElement('button');
      b.className = 'mchip'; b.textContent = p[1];
      b.setAttribute('aria-pressed', !!fState[p[0]]);
      b.onclick = function () { fState[p[0]] = !fState[p[0]]; render(); };
      fst.appendChild(b);
    });
    document.getElementById('mq').oninput = function (e) { q = e.target.value.toLowerCase().trim(); render(); };
    Array.prototype.forEach.call(main.querySelectorAll('[data-go]'), function (el) {
      el.onclick = function () {
        const k = el.getAttribute('data-go');
        if (CLASSES[k]) { focus = k; render(); }
      };
    });
    bindLayer();
  }
})();
</script>
</body></html>
