<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Atlas — Athena</title>
<script>/* #4024 — the mount resolver every Chorus page carries (#3798): the page must
   know its own mount (llug.com/chorus) before any root-absolute src/href/fetch. */
(function(){var m=document.querySelector('meta[name="chorus-base"]'),b=m&&m.getAttribute('content')||null;
if(b===null){var p=(location&&location.pathname)||'';b=(p==='/chorus'||p.indexOf('/chorus/')===0)?'/chorus':'';}
b=b.replace(/\/+$/,'');window.CHORUS_BASE=b;
window.basePath=function(x){if(!x)return b||'/';if(/^[a-z]+:\/\//i.test(x)||x.indexOf('//')===0)return x;
return b+(x.charAt(0)==='/'?x:'/'+x);};
var s=document.createElement('script');s.src=window.basePath('/js/base-path.js');document.head.appendChild(s);}());</script>
<!-- #3992 — the OWL model as UML, per domain, generated from the store on every
     load. One diagram per domain (classes as boxes with datatype attributes,
     object properties as labelled edges with SHACL multiplicities, subclass
     triangles); cross-domain edges render dashed with the target's home domain
     named. Zero hardcoded model content: the page draws whatever
     /api/athena/class-atlas returns, which walks definesVocabulary live —
     "see our domains and relationships, not take-your-word-for-it" (Jeff). -->
<link rel="stylesheet" href="athena-flow.css"><script src="athena-flow.js"></script><script>mountJourneyNav('class-atlas');</script>
<script>document.write('<script src="'+window.basePath('/js/vendor/mermaid.min.js')+'"><\/script>');</script>
<style>
  .anav{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 16px}
  .anav a{font:500 11.5px system-ui,sans-serif;padding:5px 9px;border:1px solid var(--line,#cdd5de);
          border-radius:2px;color:var(--muted,#5b6675);text-decoration:none;background:var(--panel,#fff)}
  .anav a:hover{border-color:#0d6a89;color:#0d6a89}
  .anav a small{color:var(--muted,#a8b0bb);margin-left:4px}
  .adom{border:1px solid var(--line,#d8dee6);border-radius:4px;background:var(--panel,#fff);
        margin-bottom:18px;overflow:hidden}
  .adom h2{font:600 13px ui-monospace,Menlo,monospace;padding:9px 13px;margin:0;
           border-bottom:1px solid var(--line,#e6eaef);background:var(--hover,#f6f8fa)}
  .adom h2 small{font-weight:400;color:var(--muted,#8a94a3);margin-left:8px}
  .adia{padding:10px;overflow-x:auto}
  .astatus{font:400 12.5px system-ui,sans-serif;color:var(--muted,#5b6675);padding:14px}
  .astatus.err{color:#a8226b;font-weight:600}
  .alegend{font:400 11px system-ui,sans-serif;color:var(--muted,#8a94a3);margin:0 0 14px}
</style></head>
<body>
<main style="max-width:1200px;margin:0 auto;padding:16px">
<h1 style="font:300 26px system-ui,sans-serif;margin:6px 0 2px">Class Atlas</h1>
<p class="alegend">UML per domain, live from <code>urn:chorus:ontology</code> —
solid edges stay in-domain, <em>dashed edges leave the domain</em> (target's home in the label),
<code>*</code> marks a SHACL-required attribute, multiplicities are <code>min..max</code>.</p>
<nav class="anav" id="nav"></nav>
<div id="out" class="astatus">Loading the model…</div>
</main>
<script>
mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'neutral' });

// mermaid identifiers must be bare words; labels carry the truth.
const ident = (s) => String(s).replace(/[^A-Za-z0-9_]/g, '_');

// #4053 AC3 — a cross-domain target draws as an EMPTY box, so from this diagram
// you cannot tell a rich class from a stub. Carry each class's size across the
// whole atlas and stamp it on the referenced box.
function classSizes(atlas) {
  const sizes = new Map();
  for (const d of atlas.domains) {
    for (const c of d.classes) sizes.set(c.name, { props: c.attributes.length + c.edges.length, home: d.name });
  }
  return sizes;
}

function domainDiagram(dom, sizes) {
  const L = ['classDiagram'];
  const drawn = new Set(dom.classes.map((c) => c.name));
  for (const cls of dom.classes) {
    L.push(`class ${ident(cls.name)} {`);
    for (const a of cls.attributes) {
      const req = a.min >= 1 ? '*' : '';
      // #4053 — an enum names its legal values. Drawing `any status` when the
      // shape says sh:in (exploring building operating retiring) told the reader
      // the constraint was absent; the tightest field must not read as the loosest.
      const type = a.allowed && a.allowed.length ? a.allowed.join('|') : (a.type || 'any');
      L.push(`  ${type} ${ident(a.name)}${req}`);
    }
    L.push('}');
    // #4053 — DECLARED (the pen) and SERVED (athena-make mounted it) are two
    // claims. A class served with 0 rows is NOT the same as one that works, and
    // a class the pen declares that nothing serves must say so on the picture —
    // otherwise a green athena-make verb is unfalsifiable here.
    if (cls.served === false) {
      L.push(`note for ${ident(cls.name)} "DECLARED — not served by athena-make"`);
    } else if (cls.rowCount === 0) {
      L.push(`note for ${ident(cls.name)} "served · 0 rows — mounted and empty"`);
    } else if (typeof cls.rowCount === 'number') {
      L.push(`note for ${ident(cls.name)} "served · ${cls.rowCount} rows"`);
    } else if (cls.served) {
      L.push(`note for ${ident(cls.name)} "served · count unavailable"`);
    }
    for (const p of cls.parents) L.push(`${ident(p)} <|-- ${ident(cls.name)}`);
    for (const e of cls.edges) {
      const arrow = e.crossDomain ? '..>' : '-->';
      L.push(`${ident(cls.name)} ${arrow} "${e.multiplicity}" ${ident(e.to)} : ${ident(e.name)}`);
      // #4053 AC3 — say how big the target is and where it lives, once, so an
      // empty box means "drawn elsewhere", never "nothing there".
      if (!drawn.has(e.to) && sizes && sizes.has(e.to)) {
        drawn.add(e.to);
        const s = sizes.get(e.to);
        L.push(`class ${ident(e.to)} {`);
        L.push(`  «${s.props} properties · ${s.home}»`);
        L.push('}');
      }
    }
  }
  return L.join('\n');
}

(async () => {
  const out = document.getElementById('out');
  let atlas;
  try {
    const r = await fetch(window.basePath('/api/athena/class-atlas'));
    atlas = await r.json();
    if (!r.ok || atlas.storeReachable === false) throw new Error('store-unreachable');
  } catch {
    // The store said nothing — say THAT, never render an empty model as truth.
    out.className = 'astatus err';
    out.textContent = 'Store unreachable — the atlas cannot be drawn (this is a finding, not an empty model).';
    return;
  }
  const nav = document.getElementById('nav');
  out.className = ''; out.textContent = '';
  // #4053 — if athena-make could not be asked, say so ONCE at the top rather
  // than letting every class read as "not served". Could-not-ask and
  // not-served are different findings and must not collapse into one.
  if (atlas.servedReachable === false) {
    const warn = document.createElement('div');
    warn.className = 'astatus err';
    warn.textContent = 'athena-make unreachable at ' + (atlas.servedFrom || '?') +
      ' — served status and row counts are UNKNOWN below, not absent.';
    out.appendChild(warn);
  }
  const SIZES = classSizes(atlas);
  for (const dom of atlas.domains) {
    const a = document.createElement('a');
    a.href = '#dom-' + ident(dom.name);
    a.textContent = dom.name;
    const n = document.createElement('small');
    n.textContent = String(dom.classes.length);
    a.appendChild(n);
    nav.appendChild(a);

    const sec = document.createElement('section');
    sec.className = 'adom'; sec.id = 'dom-' + ident(dom.name);
    const h = document.createElement('h2');
    h.textContent = dom.name;
    const hs = document.createElement('small');
    hs.textContent = dom.classes.length + ' class' + (dom.classes.length === 1 ? '' : 'es');
    h.appendChild(hs);
    const div = document.createElement('div'); div.className = 'adia';
    sec.appendChild(h); sec.appendChild(div);
    out.appendChild(sec);
    try {
      const { svg } = await mermaid.render('atlas_' + ident(dom.name), domainDiagram(dom, SIZES));
      div.innerHTML = svg;
    } catch (e) {
      div.textContent = 'diagram failed for ' + dom.name + ': ' + e.message;
    }
  }
})();
</script>
</body></html>
