<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — Athena</title>
<!-- #3635 — the Jeff-approved product INSTANCE page (2026-07-12 mock), ?p=<name>.
     Replaces the #3420 skeleton. Hand-authored pending the generator upgrade. -->
<script>window.OWL_PORT = 3360;</script>
<link rel="stylesheet" href="athena-flow.css"><style>/* #4045 — section attributes are multi-paragraph text; keep their line breaks */ td.attr-text p{white-space:pre-line;margin:0}</style><script src="athena-flow.js"></script><script>mountJourneyNav('products');</script><script>/* #3810 — the page teaches itself its mount, with nothing to fetch.
   A root-absolute src on the loader tag is the trap: from /chorus/ the browser resolves it
   against the apex, asks the garden site, gets a 404 — so the file that would have told
   this page where it lives can never load. Chicken-and-egg, and it left three correct
   fixes underneath it inert. Relative src was rejected: it breaks the no-trailing-slash
   entry and needs ../ depth per page, which is per-page compensation for a mount.
   No request, so nothing can escape the mount. At root BASE is '' and URLs are unchanged. */
(function(){var m=document.querySelector('meta[name="chorus-base"]'),b=m&&m.getAttribute('content')||null;
if(b===null){var p=(location&&location.pathname)||'';b=(p==='/chorus'||p.indexOf('/chorus/')===0)?'/chorus':'';}
b=b.replace(/\/+$/,'');window.CHORUS_BASE=b;
window.basePath=function(x){if(!x)return b||'/';if(/^[a-z]+:\/\//i.test(x)||x.indexOf('//')===0)return x;
return b+(x.charAt(0)==='/'?x:'/'+x);};
/* the DOM-rewriter still has a job (root-absolute hrefs must stay inside the mount);
   it is fetched THROUGH the base this snippet just computed, so it cannot escape. */
var s=document.createElement('script');s.src=window.basePath('/js/base-path.js');document.head.appendChild(s);}());</script>
</head>
<body><div class="wrap">
<div class="crumb" id="crumb"><a href="value-stream.html">value stream</a> &rarr; <a href="products.html">products</a></div>
<h1 id="title">Product</h1>
<div id="main"><p class="empty">loading live from the model&hellip;</p></div>
</div>
<script>
(async function () {
  const main = document.getElementById('main');
  const p = new URLSearchParams(location.search).get('p');
  if (!p) { main.innerHTML = '<div class="err">No product named — open as product.html?p=&lt;name&gt;, e.g. from <a class="edge" href="products.html">the products page</a>.</div>'; return; }
  try {
    // edges (ownedBy/atStep/hasDomain) live on the COLLECTION row; literals on the
    // entity read; containment in the has-child fold. Merge all three.
    // #4045 — the SHAPE is fetched too: every property the model declares for a
    // Product is rendered, present or not, so an attribute can never be served yet
    // invisible (Jeff, 2026-09-02: "we have a pretty rich product model yet many of
    // the attributes are not visible to me"). Documents resolve hasDesignDoc to a link.
    const [entEnv, collEnv, kidFold, apiSpec, docEnv] = await Promise.all([
      fetchJSON(`/products/${encodeURIComponent(p)}`),
      fetchJSON('/products'),
      fetchJSON(`/products/${encodeURIComponent(p)}/has-child`).catch(() => null),
      fetchJSON('/products/openapi.json').catch(() => null),
      fetchJSON('/documents').catch(() => null)]);
    const shape = (apiSpec && apiSpec.components && apiSpec.components.schemas && apiSpec.components.schemas.Product && apiSpec.components.schemas.Product.properties) || {};
    const docsByName = Object.fromEntries((((docEnv || {}).data) || []).map(r => [r.name, r]));
    const lit = (Array.isArray(entEnv.data) ? entEnv.data[0] : entEnv.data) || {};
    const row = ((collEnv.data || []).find(r => r.name === p)) || {};
    const e = { ...row, ...Object.fromEntries(Object.entries(lit).filter(([, v]) => v !== '' && v != null)) };
    e.hasChild = (kidFold && kidFold.hasChild) || [];
    if (!Object.keys(lit).length && !Object.keys(row).length) { main.innerHTML = `<div class="err">The model has no product named "${esc(p)}" — that is the graph's answer, not a fetch failure.</div>`; return; }
    const label = e.label || p[0].toUpperCase() + p.slice(1);
    document.title = `${label} — Product — Athena`;
    document.getElementById('title').innerHTML = `${esc(label)} <span class="kind">&mdash; Product</span>`;
    const step = stepLocal(e.atStep);
    document.getElementById('crumb').innerHTML =
      `<a href="value-stream.html">value stream</a> &rarr; <a href="value-stream.html">${esc(step[0] ? step[0].toUpperCase() + step.slice(1) : '?')}</a> &rarr; <a href="products.html">products</a> &rarr; ${esc(p)}`;

    const doms = asArray(e.hasDomain).sort();
    // domain edges (owner, vocabulary) live on the /domains COLLECTION rows
    let domRowsByName = {};
    if (doms.length) {
      try { domRowsByName = Object.fromEntries(((await fetchJSON('/domains')).data || []).map(r => [r.name, r])); } catch (_) {}
    }
    const domRows = doms.map(d => {
      const de = domRowsByName[d] || {};
      const vocab = asArray(de.definesVocabulary);
      return `<tr><td><a class="edge" href="domain.html?d=${encodeURIComponent(d)}">${esc(d)}</a></td>` +
        `<td>${ownerDot(de.ownedBy)}</td>` +
        `<td>${vocab.length} class${vocab.length !== 1 ? 'es' : ''}</td>` +
        `<td><a class="edge" href="${owlBase()}/domains/${encodeURIComponent(d)}">:3360 &#10003;</a></td></tr>`;   /* #4010 — was ${OWL}, a name nothing defines; the ReferenceError killed the whole render, so every product page showed "Cannot reach the model API" while the API was fine */
    });
    const kids = asArray(e.hasChild).sort();

    // Every shape property, in one table. Provenance fields fold into one line;
    // the narrative ones already rendered above are listed again here on purpose —
    // this table is the complete answer to "what does the model say about spine".
    const PROV = new Set(['iri', 'type', 'created', 'creator', 'modified', 'label']);
    const edgeLink = (prop, v) => {
      const n = String(v).replace(/^.*[#/]/, '');
      if (prop === 'hasDomain') return `<a class="edge" href="domain.html?d=${encodeURIComponent(n)}">${esc(n)}</a>`;
      if (prop === 'ownedBy') return ownerDot(n);
      if (prop === 'atStep') return stepBadge(n);
      if (prop === 'hasDesignDoc' || prop === 'hasServiceDesign') {
        const d = docsByName[n];
        return d && d.docHref ? `<a class="edge" href="${esc(basePath(d.docHref))}">${esc(d.docTitle || n)}</a>` : `${esc(n)} <span class="src">(no served Document row)</span>`;
      }
      if (prop === 'hasChild') return `<a class="edge" href="product.html?p=${encodeURIComponent(n)}">${esc(n)}</a>`;
      return esc(n);
    };
    const attrRows = Object.entries(shape).filter(([k]) => !PROV.has(k)).sort(([a], [b]) => a.localeCompare(b)).map(([k, def]) => {
      const isEdge = !!def.$ref;
      const vals = asArray(e[k]).filter(v => v !== '' && v != null);
      const cell = vals.length
        ? (isEdge ? vals.map(v => edgeLink(k, v)).join(' ') : `<p>${esc(vals.join('\n'))}</p>`)
        : '<span class="empty">not set</span>';
      return `<tr><td><code>chorus:${esc(k)}</code></td><td class="kind">${isEdge ? 'edge' : 'field'}</td><td class="${isEdge ? '' : 'attr-text'}">${cell}</td></tr>`;
    });
    const provLine = ['iri', 'created', 'creator', 'modified'].filter(k => e[k]).map(k => `${k}: ${esc(String(e[k]).slice(0, 40))}`).join(' &middot; ');
    const designDoc = asArray(e.hasDesignDoc).map(v => docsByName[String(v).replace(/^.*[#/]/, '')]).find(Boolean);

    main.innerHTML = `
<div class="promise"><strong>vision:</strong> ${esc(e.vision || '')}</div>
${designDoc && designDoc.docHref ? `<p class="vp"><strong>product design:</strong> <a class="edge" href="${esc(basePath(designDoc.docHref))}">${esc(designDoc.docTitle || designDoc.name)}</a> <span class="src">chorus:hasDesignDoc</span></p>` : `<p class="vp"><strong>product design:</strong> <span class="empty">none registered</span> <span class="src">chorus:hasDesignDoc</span></p>`}
<div class="stats">
  <div class="stat"><div class="v">${ownerDot(e.ownedBy)}</div><div class="l">Owner (ownedBy)</div></div>
  <div class="stat"><div class="v">${stepBadge(e.atStep)}</div><div class="l">Step (atStep)</div></div>
  <div class="stat"><div class="v">${esc(e.status || 'no status')}</div><div class="l">Status</div></div>
  <div class="stat"><div class="v">${doms.length}</div><div class="l">Domains</div></div>
</div>
<details class="fold" open><summary>Value Proposition <span class="src">chorus:valueProposition</span></summary><div class="body"><p>${esc(e.valueProposition || '')}</p></div></details>
${e.audience ? `<details class="fold" open><summary>Audience <span class="src">chorus:audience</span></summary><div class="body"><p>${esc(e.audience)}</p></div></details>` : ''}
<details class="fold" open><summary>Domains (hasDomain) <span class="src">model edges &rarr; live domain pages</span></summary><div class="body">
${doms.length ? `<table><tr><th>Domain</th><th>Owner</th><th>Vocabulary</th><th>Live</th></tr>${domRows.join('')}</table>` : '<div class="empty">no domains declared</div>'}</div></details>
<details class="fold" open><summary>Children (hasChild) <span class="src">chorus:hasChild</span></summary><div class="body">
${kids.length ? kids.map(c => `<a class="chip" href="product.html?p=${encodeURIComponent(c)}">${esc(c)}</a>`).join(' ') : `<div class="empty">none &mdash; ${esc(p)} is a leaf product</div>`}</div></details>
${e.gaps ? `<details class="fold" open><summary>Gaps <span class="src">chorus:gaps &mdash; honest, from the model</span></summary><div class="body"><p>${esc(e.gaps)}</p></div></details>` : ''}
<details class="fold" open><summary>Every attribute the model declares (${attrRows.length}) <span class="src">GET /products/openapi.json &rarr; Product</span></summary><div class="body">
${attrRows.length ? `<table><tr><th>Property</th><th></th><th>Value</th></tr>${attrRows.join('')}</table>` : '<div class="empty">shape unavailable — the API did not serve its schema</div>'}
${provLine ? `<p class="src">${provLine}</p>` : ''}</div></details>
${srcNote(`GET /products/${esc(p)}`)}`;
  } catch (e) { fetchFailed(main, e); }
})();
</script>
</body></html>
