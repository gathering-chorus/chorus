<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — Athena</title>
<!-- #4045 — the product page as a RENDERED DESIGN, phone-first (was the v2 mock; Jeff read it on his phone and worked from it, 2026-09-02 11:38).
     Jeff, 2026-09-02 10:51: "think about the ux of having a properties table on phone —
     the tail of the doc should be more like a rendered designed page and less like a
     simple tree of attributes." Same data as product.html (every shape property, live
     from the model); the difference is the rendering: the sections read as the design
     doc they came from, in design order, with the model's own tables and lists, and
     nothing wider than a phone. The #3635 attribute-table version it replaces is in git. -->
<script>window.OWL_PORT = 3360;</script>
<link rel="stylesheet" href="athena-flow.css"><script src="athena-flow.js"></script><script>mountJourneyNav('products');</script>
<script>(function(){var m=document.querySelector('meta[name="chorus-base"]'),b=m&&m.getAttribute('content')||null;
if(b===null){var p=(location&&location.pathname)||'';b=(p==='/chorus'||p.indexOf('/chorus/')===0)?'/chorus':'';}
b=b.replace(/\/+$/,'');window.CHORUS_BASE=b;
window.basePath=function(x){if(!x)return b||'/';if(/^[a-z]+:\/\//i.test(x)||x.indexOf('//')===0)return x;return b+(x.charAt(0)==='/'?x:'/'+x);};
var s=document.createElement('script');s.src=window.basePath('/js/base-path.js');document.head.appendChild(s);}());</script>
<script>document.write('<script src="'+window.basePath('/js/vendor/mermaid.min.js')+'"><\/script>');</script>   <!-- #4094 — after basePath exists; same include class-atlas.html uses -->
<style>
  /* phone-first: the page is a single column of readable measure; nothing scrolls sideways */
  /* on a wide screen: 1in margins either side, no fixed column (Jeff 2026-09-03: "1 inch right and left so I don't scroll so much on mac"); phone keeps 16px */
  .wrap { max-width: none; padding: 16px 1in; }
  .hero { margin: 6px 0 10px; }
  .hero h1 { font-size: 1.6rem; line-height: 1.2; }
  .hero .meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 8px; font-size: .85rem; color: var(--muted); }
  .hero .meta a { color: var(--accent); text-decoration: none; }
  .hero .meta .changed code { font-size: .8em; }   /* #4101 — version is the write's commit, never typed */
  .vision { font-size: 1.05rem; line-height: 1.45; border-left: 4px solid var(--accent); padding: 8px 14px; margin: 14px 0; background: var(--surface); border-radius: 0 6px 6px 0; }
  .vision .k { display: block; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .lede { font-size: .98rem; margin: 0 0 10px; }
  .lede .k { font-weight: 600; margin-right: 6px; }
  /* section jump list — horizontal scroll on phone, wraps on desktop */
  nav.toc { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 10px; margin: 6px 0 4px; scrollbar-width: none; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  nav.toc::-webkit-scrollbar { display: none; }
  nav.toc a { flex: 0 0 auto; font-size: .78rem; padding: 4px 11px; border: 1px solid var(--border); border-radius: 12px; color: var(--muted); text-decoration: none; background: var(--surface); }
  nav.toc a.filled { color: var(--text); border-color: #c9ced6; }
  @media (min-width: 700px) { nav.toc { flex-wrap: wrap; position: static; } }
  /* a section is a chapter: numbered heading, then the model's text rendered as prose */
  /* each chapter is a fold (Jeff 2026-09-03 10:08: "the folds need to be able to expand and collapse"); open by default, click the heading to collapse; state remembered per chapter in this browser */
  section.ch, details.ch { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  details.ch > summary { list-style: none; cursor: pointer; }
  details.ch > summary::-webkit-details-marker { display: none; }
  details.ch > summary h2 { margin: 0; }
  details.ch > summary h2 .n::before { content: '\25B8'; display: inline-block; width: 1em; color: var(--muted); font-size: .8em; transition: transform .12s; }
  details.ch[open] > summary h2 .n::before { transform: rotate(90deg); }
  details.ch[open] > summary { margin-bottom: 8px; }
  /* #4094 — the design's diagrams, rendered from chorus:diagram (mermaid source, %% caption first line) */
  figure.dg { margin: 0 0 14px; }
  figure.dg figcaption { font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
  figure.dg .mmd { overflow-x: auto; }
  figure.dg .mmd svg { max-width: 100%; height: auto; font-size: 16px; line-height: 1.25; }
  /* mermaid measures its labels outside this page's chapter CSS; the chapter's p/span rules must not reach them, or every box clips (seen on round 1) */
  figure.dg .mmd p, figure.dg .mmd span { margin: 0; font-size: inherit; line-height: inherit; }
  figure.dg .mmd-err { color: var(--muted); font-style: italic; font-size: .85rem; }
  /* #4102 — history: one fold per prior version, each a field-by-field diff */
  details.rev { margin: 6px 0; padding: 6px 10px; border: 1px dashed var(--border); border-radius: 6px; }
  details.rev > summary { cursor: pointer; font-size: .9rem; }
  details.rev .was { color: #a33; text-decoration: line-through; }
  details.rev .now { color: #262; }
  .foldall { display: flex; gap: 12px; justify-content: flex-end; font-size: .8rem; margin: 4px 0 -4px; }
  .foldall a { color: var(--accent); text-decoration: none; cursor: pointer; }
  section.ch h2, details.ch h2 { font-size: 1.08rem; margin-bottom: 8px; display: flex; align-items: baseline; gap: 8px; }
  .ch h2 .n { color: var(--muted); font-weight: 400; font-size: .85rem; min-width: 1.4em; }
  .ch h2 .src { margin-left: auto; font-size: .68rem; color: var(--muted); font-weight: 400; }
  .ch p { margin: 0 0 8px; font-size: .93rem; }
  .ch p:last-child { margin-bottom: 0; }
  .ch ul, .ch ol { margin: 0 0 8px 1.2em; font-size: .93rem; }
  .ch li { margin-bottom: 3px; }
  .ch .unwritten { color: var(--muted); font-style: italic; font-size: .88rem; }
  section.ch.empty { padding: 8px 16px; background: transparent; border-style: dashed; }
  section.ch.empty h2 { margin: 0; font-size: .95rem; color: var(--muted); }
  /* the model's tables: real tables on desktop; on a phone each row becomes a card with labelled cells */
  .mt { width: 100%; border-collapse: collapse; font-size: .86rem; margin: 6px 0 10px; }
  .mt th { text-align: left; font-size: .68rem; text-transform: uppercase; color: var(--muted); padding: 5px 6px; border-bottom: 1px solid var(--border); }
  .mt td { padding: 6px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  .mt td:first-child { font-weight: 600; white-space: nowrap; }
  @media (max-width: 640px) {
    .wrap { padding: 16px; }
    .mt thead { display: none; }
    .mt, .mt tbody, .mt tr, .mt td { display: block; width: 100%; }
    .mt tr { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; margin: 0 0 8px; background: var(--bg); }
    .mt td { border: 0; padding: 3px 0; white-space: normal; }
    .mt td:first-child { font-size: .95rem; padding-bottom: 4px; }
    .mt td[data-l]::before { content: attr(data-l); display: block; font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  }
  /* composition: domain chips with owner dots, one per line on phone */
  .doms { display: flex; flex-wrap: wrap; gap: 6px; }
  .doms a { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--accent); text-decoration: none; font-size: .86rem; }
  .doms a .c { color: var(--muted); font-size: .74rem; }
  .prov { font-size: .72rem; color: var(--muted); margin-top: 18px; line-height: 1.6; }
  .prov code { font-size: .72rem; }
</style>
</head>
<body><div class="wrap">
<div class="crumb" id="crumb"><a href="value-stream.html">value stream</a> &rarr; <a href="products.html">products</a></div>
<div id="main"><p class="empty">loading live from the model&hellip;</p></div>
</div>
<script>
(async function () {
  const main = document.getElementById('main');
  // #4045 — a phone that autolinks 'p=spine.' hands us 'spine.'; trailing punctuation is noise, not a product name.
  const p = (new URLSearchParams(location.search).get('p') || '').replace(/[.,;:!?)\]]+$/, '') || null;
  if (!p) { main.innerHTML = '<div class="err">No product named — open as product.html?p=&lt;name&gt;.</div>'; return; }
  try {
    const [entEnv, collEnv, apiSpec, docEnv, domEnv] = await Promise.all([
      fetchJSON(`/products/${encodeURIComponent(p)}`),
      fetchJSON('/products'),
      fetchJSON('/products/openapi.json').catch(() => null),
      fetchJSON('/documents').catch(() => null),
      fetchJSON('/domains').catch(() => null)]);
    const lit = (Array.isArray(entEnv.data) ? entEnv.data[0] : entEnv.data) || {};
    const row = ((collEnv.data || []).find(r => r.name === p)) || {};
    // the entity read serves one string for a repeated literal (the last value); the collection row keeps the list —
    // so a repeated property (chorus:diagram, #4094) is read from the row, everything else from the entity
    const e = { ...row, ...Object.fromEntries(Object.entries(lit).filter(([k, v]) => v !== '' && v != null && !Array.isArray(row[k]))) };
    if (!Object.keys(lit).length && !Object.keys(row).length) { main.innerHTML = `<div class="err">The model has no product named "${esc(p)}".</div>`; return; }
    const shape = (apiSpec && apiSpec.components && apiSpec.components.schemas && apiSpec.components.schemas.Product && apiSpec.components.schemas.Product.properties) || {};
    const docsByName = Object.fromEntries((((docEnv || {}).data) || []).map(r => [r.name, r]));
    const domsByName = Object.fromEntries((((domEnv || {}).data) || []).map(r => [r.name, r]));
    const label = e.label || p[0].toUpperCase() + p.slice(1);
    document.title = `${label} — Product — Athena`;
    const step = stepLocal(e.atStep);
    document.getElementById('crumb').innerHTML =
      `<a href="value-stream.html">value stream</a> &rarr; <a href="value-stream.html">${esc(step ? step[0].toUpperCase() + step.slice(1) : '?')}</a> &rarr; <a href="products.html">products</a> &rarr; ${esc(p)}`;
    const designDoc = asArray(e.hasDesignDoc).map(v => docsByName[String(v).replace(/^.*[#/]/, '')]).find(Boolean);
    const doms = asArray(e.hasDomain).sort();

    // ── text → design: the model's strings are the doc's sections. Lines with " | "
    //    are table rows (first row = header); "1. " / "- " lines are lists; the rest,
    //    paragraphs. Tables become labelled cards under 640px (CSS above).
    const render = (txt) => {
      const lines = String(txt || '').split('\n').map(l => l.trim()).filter(Boolean);
      let html = '', i = 0;
      const isRow = l => l.includes(' | ');
      while (i < lines.length) {
        if (isRow(lines[i])) {
          const rows = []; while (i < lines.length && isRow(lines[i])) { rows.push(lines[i].replace(/^\s*\|\s*/, '').replace(/\s*\|\s*$/, '').split(' | ').map(c => c.trim())); i++; }
          const head = rows.shift();
          html += `<table class="mt"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</thead><tbody>` +
            rows.map(r => `<tr>${r.map((c, k) => `<td${k ? ` data-l="${esc(head[k] || '')}"` : ''}>${esc(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
        } else if (/^(\d+[.)]|[-•])\s/.test(lines[i])) {
          const ordered = /^\d/.test(lines[i]); const items = [];
          while (i < lines.length && /^(\d+[.)]|[-•])\s/.test(lines[i])) { items.push(lines[i].replace(/^(\d+[.)]|[-•])\s/, '')); i++; }
          html += `<${ordered ? 'ol' : 'ul'}>${items.map(t => `<li>${esc(t)}</li>`).join('')}</${ordered ? 'ol' : 'ul'}>`;
        } else { html += `<p>${esc(lines[i])}</p>`; i++; }
      }
      return html;
    };

    // ── the design order: what a product design says, chapter by chapter
    const chapters = [
      ['promise',       'Promise'],
      ['audience',      'Audience'],
      ['structure',     'Structure'],
      ['composition',   'Composition'],          // rendered from hasDomain, not a string
      ['model',         'The Model (OWL + SHACL)'],
      ['pagesAndFlow',  'Pages & Flow'],
      ['diagram',       'Flows'],                // rendered from chorus:diagram (repeatable mermaid), #4094
      ['apiSurface',    'API Surface'],
      ['asIs',          'As-Is'],
      ['toBe',          'To-Be'],
      ['notInScope',    'Not in scope'],
      ['gaps',          'Gaps'],
      ['references',    'References'],
      ['comment',       'Notes'],
    ];
    // fold state: open unless this browser collapsed it before (localStorage, per chapter); a #hash always opens its target
    const foldKey = k => `athena.product.fold.${k}`;
    const foldOpen = k => { try { return localStorage.getItem(foldKey(k)) !== 'closed'; } catch (_) { return true; } };
    // the stamp is UTC; show the viewer's own day (it read 2026-09-04 at 20:50 Boston on round 3)
    const localDay = (iso) => { const d = new Date(String(iso || '')); return isNaN(d) ? String(iso || '').slice(0, 10) : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
    const diagrams = () => asArray(e.diagram).map(String).map(v => { const ls = v.trim().split('\n'); const cap = ls[0].startsWith('%%') ? ls.shift().replace(/^%%\s*/, '') : ''; return { caption: cap, src: ls.join('\n').trim() }; }).filter(d => d.src);
    const has = k => k === 'composition' ? doms.length > 0 : k === 'diagram' ? diagrams().length > 0 : !!(e[k] && String(e[k]).trim());
    const toc = chapters.map(([k, t]) => `<a href="#${k}" class="${has(k) ? 'filled' : ''}">${esc(t)}</a>`).join('');
    const chapterHtml = chapters.map(([k, t], n) => {
      const src = k === 'composition' ? 'chorus:hasDomain' : `chorus:${k}`;
      if (!has(k)) return `<section class="ch empty" id="${k}"><h2><span class="n">${n + 1}</span>${esc(t)}<span class="src">${src} &middot; not written</span></h2></section>`;
      let body;
      if (k === 'composition') {
        body = `<div class="doms">${doms.map(d => { const de = domsByName[d] || {}; const v = asArray(de.definesVocabulary).length;
          return `<a href="domain.html?d=${encodeURIComponent(d)}">${ownerDot(de.ownedBy)}${esc(d)} <span class="c">${v} class${v !== 1 ? 'es' : ''}</span></a>`; }).join('')}</div>`;
      } else if (k === 'diagram') {
        body = diagrams().map((d, di) => `<figure class="dg"><figcaption>${esc(d.caption || `Diagram ${di + 1}`)}</figcaption><div class="mmd" data-i="${di}"></div></figure>`).join('');
      } else body = render(e[k]);
      return `<details class="ch" id="${k}"${foldOpen(k) ? ' open' : ''}><summary><h2><span class="n">${n + 1}</span>${esc(t)}<span class="src">${src}</span></h2></summary>${body}</details>`;
    }).join('');

    // ── anything the shape declares that the chapters did not place (so nothing served is invisible)
    const placed = new Set(chapters.map(([k]) => k).concat(['hasDomain', 'label', 'vision', 'valueProposition', 'status', 'ownedBy', 'atStep', 'hasDesignDoc', 'iri', 'type', 'created', 'creator', 'modified']));
    const rest = Object.keys(shape).filter(k => !placed.has(k)).sort();
    const restHtml = rest.length ? `<section class="ch" id="more"><h2><span class="n">&middot;</span>Also on the shape<span class="src">${rest.length} more</span></h2>` +
      `<p>${rest.map(k => `<code>${esc(k)}</code>: ${e[k] ? esc(asArray(e[k]).join(', ')) : '<span class="unwritten">not set</span>'}`).join(' &nbsp;&middot;&nbsp; ')}</p></section>` : '';

    const PLURAL = 'products', ROWNAME = p, CURRENT = e;
    // #4102 — History: every prior version the door kept, newest first, each diffed
    // against the version before it (the newest against the row as it is now).
    const revEnv = await fetchJSON('/revisions').catch(() => null);
    const mine = (((revEnv || {}).data) || []).filter(r => r.ofRow === `${PLURAL}/${ROWNAME}`)
      .map(r => { let snap = {}; try { snap = JSON.parse(r.snapshot || '{}'); } catch (_) {} return { v: Number(r.version) || 0, at: r.changedAt || snap.changedAt || '', snap }; })
      .sort((a, b) => b.v - a.v);
    const diffOf = (older, newer) => {
      const keys = Array.from(new Set([...Object.keys(older), ...Object.keys(newer)])).filter(k => !['version', 'changedAt', 'changedIn', 'modified', 'created', 'name'].includes(k)).sort();
      const norm = v => Array.isArray(v) ? v.map(String).sort() : (v == null ? '' : String(v));
      const out = [];
      for (const k of keys) {
        const a = norm(older[k]), b = norm(newer[k]);
        if (JSON.stringify(a) === JSON.stringify(b)) continue;
        if (Array.isArray(a) || Array.isArray(b)) {
          const A = Array.isArray(a) ? a : (a ? [a] : []), B = Array.isArray(b) ? b : (b ? [b] : []);
          out.push({ k, added: B.filter(x => !A.includes(x)), removed: A.filter(x => !B.includes(x)) });
        } else out.push({ k, from: a, to: b });
      }
      return out;
    };
    const clip = s => { s = String(s || ''); return s.length > 160 ? s.slice(0, 157) + '…' : s; };
    const histHtml = mine.length === 0
      ? `<section class="ch empty" id="history"><h2><span class="n">&middot;</span>History<span class="src">chorus:Revision &middot; no prior versions kept yet</span></h2></section>`
      : `<details class="ch" id="history"><summary><h2><span class="n">&middot;</span>History<span class="src">chorus:Revision &middot; ${mine.length} prior version${mine.length === 1 ? '' : 's'}</span></h2></summary>` +
        mine.map((r, i) => {
          const newer = i === 0 ? CURRENT : mine[i - 1].snap;
          const d = diffOf(r.snap, newer);
          const label = i === 0 ? `v${r.v} &rarr; now (v${esc(String(CURRENT.version || ''))})` : `v${r.v} &rarr; v${mine[i - 1].v}`;
          const rows = d.length === 0 ? '<p class="unwritten">saved again with no field changed</p>' : d.map(x => x.from !== undefined
            ? `<p><b>${esc(x.k)}</b><br><span class="was">${esc(clip(x.from)) || '<i>empty</i>'}</span><br><span class="now">${esc(clip(x.to)) || '<i>empty</i>'}</span></p>`
            : `<p><b>${esc(x.k)}</b> ${x.added.length ? 'added ' + x.added.map(esc).join(', ') : ''} ${x.removed.length ? 'removed ' + x.removed.map(esc).join(', ') : ''}</p>`).join('');
          return `<details class="rev"><summary>${label} <span class="src">${esc(String(r.at).slice(0, 10))}</span></summary>${rows}</details>`;
        }).join('') + '</details>';

    main.innerHTML = `
<div class="hero">
  <h1>${esc(label)} <span class="kind">&mdash; Product</span></h1>
  <div class="meta">
    <span>${ownerDot(e.ownedBy)}</span>
    <span>${stepBadge(e.atStep)}</span>
    <span><em>${esc(e.status || 'no status')}</em></span>
    ${designDoc && designDoc.docHref ? `<a href="${esc(basePath(designDoc.docHref))}">design doc &rarr;</a>` : '<span class="unwritten">no design doc registered</span>'}
    ${e.version ? `<span class="changed" title="version = how many times this row has been saved; the date is the last save; both written automatically">v${esc(String(e.version))}${e.docState ? ` &middot; ${esc(String(e.docState))}` : ''} &middot; changed ${esc(localDay(e.changedAt))}</span>` : '<span class="unwritten">not yet saved through the API</span>'}
  </div>
</div>
<div class="vision"><span class="k">vision</span>${esc(e.vision || '')}</div>
<p class="lede"><span class="k">Value proposition</span>${esc(e.valueProposition || '')}</p>
<nav class="toc">${toc}</nav>
<div class="foldall"><a data-fold="open">expand all</a><a data-fold="close">collapse all</a></div>
${chapterHtml}
${histHtml}
${restHtml}
<div class="prov">Rendered from <code>GET /products/${esc(p)}</code> &middot; ${Object.keys(shape).length} properties on the Product shape &middot; ${['created', 'modified'].filter(k => e[k]).map(k => `${k} ${esc(String(e[k]).slice(0, 10))}`).join(' &middot; ')}</div>`;
    // remember each fold's state; expand/collapse all; a toc jump opens its target
    const folds = () => Array.from(main.querySelectorAll('details.ch'));
    folds().forEach(d => d.addEventListener('toggle', () => { try { localStorage.setItem(foldKey(d.id), d.open ? 'open' : 'closed'); } catch (_) {} }));
    main.querySelectorAll('.foldall a').forEach(a => a.addEventListener('click', () => folds().forEach(d => { d.open = a.dataset.fold === 'open'; })));
    const openHash = () => { const t = location.hash && main.querySelector(`details.ch${location.hash}`); if (t) t.open = true; };
    window.addEventListener('hashchange', openHash); openHash();
    // #4094 — draw each diagram from its mermaid source; a bad source says so instead of an empty box
    if (window.mermaid) {
      mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: 'neutral' });
      const ds = diagrams();
      for (const el of main.querySelectorAll('figure.dg .mmd')) {
        const d = ds[Number(el.dataset.i)];
        try { const { svg } = await mermaid.render(`dg_${p}_${el.dataset.i}`, d.src); el.innerHTML = svg; }
        catch (err) { el.innerHTML = `<div class="mmd-err">diagram source did not render: ${esc(String(err && err.message || err).slice(0, 120))}</div>`; }
      }
    }
  } catch (err) { fetchFailed(main, err); }
})();
</script>
</body></html>
