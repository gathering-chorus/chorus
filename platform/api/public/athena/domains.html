<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domains — Athena</title>
<!-- #3635 — the Jeff-approved domains collection (2026-07-12 mock). Grouped by the
     product that claims each domain (partOf, live). Red flags mark data that doesn't
     match the ruled model — the page doubles as the cleanup worklist. Hand-authored
     pending the generator upgrade. -->
<script>window.OWL_PORT = 3360;</script>
<link rel="stylesheet" href="athena-flow.css"><script src="athena-flow.js"></script><script>mountJourneyNav('domains');</script><script>/* #3810 — the page teaches itself its mount, with nothing to fetch.
   A root-absolute src on the loader tag is the trap: from /chorus/ the browser resolves it
   against the apex, asks the garden site, gets a 404 — so the file that would have told
   this page where it lives can never load. Chicken-and-egg, and it left three correct
   fixes underneath it inert. Relative src was rejected: it breaks the no-trailing-slash
   entry and needs ../ depth per page, which is per-page compensation for a mount.
   No request, so nothing can escape the mount. At root BASE is '' and URLs are unchanged. */
(function(){var m=document.querySelector('meta[name="chorus-base"]'),b=m&&m.getAttribute('content')||null;
if(b===null){var p=(location&&location.pathname)||'';b=(p==='/chorus'||p.indexOf('/chorus/')===0)?'/chorus':'';}
b=b.replace(/\/+$/,'');window.CHORUS_BASE=b;
window.basePath=function(x){if(!x)return b||'/';if(/^[a-z]+:\/\//i.test(x)||x.indexOf('//')===0)return x;
return b+(x.charAt(0)==='/'?x:'/'+x);};
/* the DOM-rewriter still has a job (root-absolute hrefs must stay inside the mount);
   it is fetched THROUGH the base this snippet just computed, so it cannot escape. */
var s=document.createElement('script');s.src=window.basePath('/js/base-path.js');document.head.appendChild(s);}());</script>
</head>
<body><div class="wrap wide">
<div class="crumb"><a href="value-stream.html">value stream</a> &rarr; domains</div>
<h1>Domains <span class="kind">&mdash; Chorus</span></h1>
<div id="main"><p class="empty">loading live from the model&hellip;</p></div>
</div>
<script>
(async function () {
  const main = document.getElementById('main');
  try {
    const [env, prodsEnv, stepsEnv] = await Promise.all([
      fetchJSON('/domains'), fetchJSON('/products'), fetchJSON('/valuestreamsteps')]);
    const rows = (env.data || []).slice().sort((a, b) => a.name.localeCompare(b.name));
    // #3761 — the ruled step list comes from the MODEL (the chorus stream's own
    // steps), not a hardcode. #3702 removed the hardcoded STEPS_RULED from
    // athena-flow.js but left two references here, so this page threw
    // "STEPS_RULED is not defined" on every load from Jul 27 until Jeff's
    // 2026-08-06 walk caught it — the husk check passed because the error
    // message is over the 80-char floor. Derived live, it cannot dangle again.
    const STEPS_RULED = (stepsEnv.data || [])
      .filter(s => s.inStream && String(s.inStream).includes('chorus'))
      .map(s => stepLocal(s.name));
    const PRODUCT_ORDER = ['chorus', 'athena', 'borg', 'clearing', 'convergence', 'loom', 'pulse', 'werk'];

    // partOf is NOT a /domains collection field (containment lives in folds) —
    // the product that claims a domain comes from the products' own hasDomain edges.
    const claimedBy = {};
    for (const p of (prodsEnv.data || []))
      for (const d of asArray(p.hasDomain)) claimedBy[d] = p.name;

    const groups = {};
    for (const d of rows) {
      const p = claimedBy[d.name] || '(no product)';
      (groups[p] = groups[p] || []).push(d);
    }

    function dcard(d) {
      const step = stepLocal(d.atStep);
      const off = step && !STEPS_RULED.includes(step) ? '<span class="flag">step off ruled model</span>' : '';
      const legacyPart = !claimedBy[d.name] ? '<span class="flag">unclaimed by any product</span>' : '';
      const legacyOwner = d.ownedBy && !String(d.ownedBy).includes('role-') ? '<span class="flag">legacy owner naming</span>' : '';
      const vocab = asArray(d.definesVocabulary);
      const purpose = d.purpose || d.comment || '';
      return `<div class="dcard">
<h3><a href="domain.html?d=${encodeURIComponent(d.name)}">${esc(d.name)}</a>${off}${legacyPart}${legacyOwner}</h3>
<div class="meta">${ownerDot(d.ownedBy)} &middot; ${stepBadge(d.atStep)} &middot; ${esc(d.status || 'no status')}</div>
<div class="purpose">${esc(purpose.slice(0, 150))}${purpose.length > 150 ? '…' : ''}</div>
${vocab.length ? `<span class="chip">${vocab.length} class${vocab.length !== 1 ? 'es' : ''}</span>` : '<span class="empty">no vocabulary yet</span>'}
</div>`;
    }

    const keys = Object.keys(groups).sort((a, b) => {
      const ia = PRODUCT_ORDER.indexOf(a), ib = PRODUCT_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
    });
    const sections = keys.map(k =>
      `<div class="psec"><h2>${esc(k)}</h2><span class="n">${groups[k].length} domains &middot; partOf edges as stored</span></div>
<div class="dgrid">${groups[k].map(dcard).join('\n')}</div>`).join('\n');

    const nVocab = rows.filter(d => asArray(d.definesVocabulary).length).length;
    const nFlag = rows.filter(d =>
      !claimedBy[d.name] ||
      (d.ownedBy && !String(d.ownedBy).includes('role-')) ||
      (stepLocal(d.atStep) && !STEPS_RULED.includes(stepLocal(d.atStep)))).length;

    main.innerHTML = `
<div class="promise">Every domain the model holds, grouped by the product that claims it (partOf). Every field is the graph's answer, including the inconsistencies &mdash; red flags mark data off the ruled model, so this page doubles as the cleanup worklist.</div>
<div class="stats">
  <div class="stat"><div class="v">${rows.length}</div><div class="l">Domains</div></div>
  <div class="stat"><div class="v">${nVocab}</div><div class="l">With vocabulary</div></div>
  <div class="stat"><div class="v">${rows.filter(d => d.ownedBy).length}</div><div class="l">With owner</div></div>
  <div class="stat"><div class="v">${nFlag}</div><div class="l">Flagged (red)</div></div>
</div>
${sections}
${srcNote('GET /domains')}`;
  } catch (e) { fetchFailed(main, e); }
})();
</script>
</body></html>
