# #3753 — load-aware instrument thresholds (sourced by nightly-suites.sh;
# deep-health/clearing-probe share it via --load-gate). Lives beside its script consumers: platform/scripts/ is scope-irrelevant to werk-test (#3821), and only scripts read this file.
# Shell KV, no secrets. Env vars set before invocation override these.
# Cores-relative: threshold = hw.ncpu * WERK_TEST_LOAD_MAX_PER_CORE
# (10-core M1 -> 15.0 at the default).
WERK_TEST_LOAD_MAX_PER_CORE="${WERK_TEST_LOAD_MAX_PER_CORE:-1.5}"
# How long a loaded box may defer the nightly before declaring UNMEASURABLE.
WERK_TEST_LOAD_DEFER_SECS="${WERK_TEST_LOAD_DEFER_SECS:-900}"
# Recheck cadence inside the defer window.
WERK_TEST_LOAD_RECHECK_SECS="${WERK_TEST_LOAD_RECHECK_SECS:-60}"
