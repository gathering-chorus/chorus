# GENERATED by chorus-make from the graph (#4465). Do not edit: change the rows and regenerate.
description: "werk v2 — pipeline clearing-plan, generated from the graph"
queue: clearing
params:
  - CHUNK: ""
  - ROLE: ""
  - CARD: ""
  - NAVIGATOR: ""
  - JEFF: ""
env:
  - CHORUS_HOME: ${CHORUS_HOME}
  - CHORUS_WERK_BASE: ${CHORUS_WERK_BASE}
  - CHORUS_BIN: ${CHORUS_BIN}
  - CHORUS_ROOT: ${CHORUS_HOME}
  - CHORUS_TRACE_ID: ${DAG_RUN_ID}
  - GIT_CONFIG_COUNT: 1
  - GIT_CONFIG_KEY_0: safe.directory
  - GIT_CONFIG_VALUE_0: ${CHORUS_WERK_BASE}/${ROLE}-${CARD}
  - PATH: ${CHORUS_WERK_BASE}/${ROLE}-${CARD}/platform/services/werk-test/target/release:${CHORUS_WERK_BASE}/${ROLE}-bin:${PATH}
handler_on:
  failure:
    command: '${CHORUS_HOME}/platform/scripts/ops-nudge ${ROLE} "werk v2 #${CARD} clearing-plan $(python3 ${CHORUS_HOME}/platform/scripts/chorus-werk-status --why ${DAG_NAME} ${DAG_RUN_ID} || echo failed) · dagu ${DAG_RUN_ID} · /cws ${CARD}"'
steps:
  - name: skill-clearing-chunk
    description: "enforce active chunk cap"
    command: "${CHORUS_HOME}/platform/scripts/clearing-chunk enforce ${CHUNK}"
  - name: skill-clearing-prioritize
    description: "prioritize chunk cards"
    depends: [skill-clearing-chunk]
    command: "${CHORUS_HOME}/platform/scripts/clearing-chunk prioritize ${CHUNK}"
  - name: skill-clearing-sequence
    description: "sequence next card in chunk"
    depends: [skill-clearing-prioritize]
    output: CARD
    command: "${CHORUS_HOME}/platform/scripts/clearing-chunk sequence ${CHUNK}"
  - name: skill-clearing-plan-go
    description: "Jeff approval before pulling to WIP"
    depends: [skill-clearing-sequence]
    id: skill_clearing_plan_go
    action: human.task
    with:
      prompt: "Jeff approval before pulling to WIP for #${CARD}? (${JEFF} answers)"
      form:
        type: object
        properties:
          by:
            type: string
          decision:
            type: string
            enum: [go, stop]
          navigator:
            type: string
        required: [by, decision, navigator]
  - name: skill-clearing-plan-check
    description: "the plan-go came from Jeff"
    depends: [skill-clearing-plan-go]
    continue_on:
      exit_code: [2]
      mark_success: true
    command: "${CHORUS_HOME}/platform/scripts/clearing-chunk check \"${CARD}\" \"${skill_clearing_plan_go.outputs.by}\" \"${skill_clearing_plan_go.outputs.decision}\" \"${skill_clearing_plan_go.outputs.navigator}\" \"${ROLE}\""
  - name: skill-clearing-pull
    description: "pull card to WIP and create werk"
    depends: [skill-clearing-plan-check]
    preconditions:
      - condition: "${skill_clearing_plan_go.outputs.decision}"
        expected: "go"
    command: "${CHORUS_HOME}/platform/scripts/werk-card pull ${CARD} ${ROLE}"
  - name: skill-clearing-pair
    description: "execute pair pipeline"
    depends: [skill-clearing-pull]
    command: "env -u CHORUS_ROLE -u ROLE dagu --config ${CHORUS_HOME}/platform/config/dagu.yaml enqueue pair -- CARD=${CARD} ROLE=${ROLE} NAVIGATOR=${skill_clearing_plan_go.outputs.navigator} JEFF=${JEFF}"
