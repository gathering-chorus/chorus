# GENERATED by chorus-make from the graph (#4465). Do not edit: change the rows and regenerate.
description: "werk v2 — pipeline card, generated from the graph"
queue: card
params:
  - CARD: ""
  - ROLE: ""
env:
  - CHORUS_HOME: ${CHORUS_HOME}
  - CHORUS_WERK_BASE: ${CHORUS_WERK_BASE}
  - CHORUS_BIN: ${CHORUS_BIN}
  - CHORUS_ROOT: ${CHORUS_HOME}
  - CHORUS_TRACE_ID: ${DAG_RUN_ID}
  - GIT_CONFIG_COUNT: 1
  - GIT_CONFIG_KEY_0: safe.directory
  - GIT_CONFIG_VALUE_0: ${CHORUS_WERK_BASE}/${ROLE}-${CARD}
  - PATH: ${CHORUS_WERK_BASE}/${ROLE}-${CARD}/platform/services/werk-test/target/release:${CHORUS_WERK_BASE}/${ROLE}-bin:${PATH}
handler_on:
  failure:
    command: '${CHORUS_HOME}/platform/scripts/ops-nudge ${ROLE} "werk v2 #${CARD} card $(python3 ${CHORUS_HOME}/platform/scripts/chorus-werk-status --why ${DAG_NAME} ${DAG_RUN_ID} || echo failed) · dagu ${DAG_RUN_ID} · /cws ${CARD}"'
steps:
  - name: skill-werk-card-pull
    description: "pull: the card to WIP and its werk off main"
    command: "${CHORUS_HOME}/platform/scripts/werk-card pull ${CARD} ${ROLE}"
  - name: skill-werk-code
    description: "code: the role builds the card"
    depends: [skill-werk-card-pull]
    id: skill_werk_code
    action: human.task
    with:
      prompt: "code: the role builds the card for #${CARD}? (${ROLE} answers)"
      form:
        type: object
        properties:
          by:
            type: string
          decision:
            type: string
            enum: [done, stop]
        required: [by, decision]
  - name: skill-werk-card-check
    description: "the done came from the card's role"
    depends: [skill-werk-code]
    command: "${CHORUS_HOME}/platform/scripts/werk-card check ${CARD} ${ROLE} ${skill_werk_code.outputs.by} ${skill_werk_code.outputs.decision}"
  - name: skill-werk-card-handoff
    description: "hand off: athena if the card changes the model, else cicd"
    depends: [skill-werk-card-check]
    command: "${CHORUS_HOME}/platform/scripts/werk-card handoff ${CARD} ${ROLE}"
