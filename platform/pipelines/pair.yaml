# GENERATED by chorus-make from the graph (#4465). Do not edit: change the rows and regenerate.
description: "werk v2 — pipeline pair, generated from the graph"
queue: pair
params:
  - CARD: ""
  - ROLE: ""
  - NAVIGATOR: ""
env:
  - CHORUS_HOME: ${CHORUS_HOME}
  - CHORUS_WERK_BASE: ${CHORUS_WERK_BASE}
  - CHORUS_BIN: ${CHORUS_BIN}
  - CHORUS_ROOT: ${CHORUS_HOME}
  - CHORUS_TRACE_ID: ${DAG_RUN_ID}
  - GIT_CONFIG_COUNT: 1
  - GIT_CONFIG_KEY_0: safe.directory
  - GIT_CONFIG_VALUE_0: ${CHORUS_WERK_BASE}/${ROLE}-${CARD}
  - PATH: ${CHORUS_WERK_BASE}/${ROLE}-${CARD}/platform/services/werk-test/target/release:${CHORUS_WERK_BASE}/${ROLE}-bin:${PATH}
handler_on:
  failure:
    command: "${CHORUS_HOME}/platform/scripts/pair red ${CARD} ${ROLE} ${NAVIGATOR} ${DAG_RUN_ID}"
steps:
  - name: skill-pair-start
    description: "pair start: a WIP card, the pair file from its AC, the navigator told"
    command: "${CHORUS_HOME}/platform/scripts/pair start ${CARD} ${ROLE} ${NAVIGATOR}"
  - name: skill-pair-green
    description: "every AC green"
    depends: [skill-pair-start]
    id: skill_pair_green
    action: human.task
    with:
      prompt: "every AC green for #${CARD}? (${NAVIGATOR} answers)"
      form:
        type: object
        properties:
          by:
            type: string
          decision:
            type: string
            enum: [green, stop]
        required: [by, decision]
  - name: skill-pair-check
    description: "the green came from the navigator"
    depends: [skill-pair-green]
    command: "${CHORUS_HOME}/platform/scripts/pair check ${CARD} ${NAVIGATOR} ${skill_pair_green.outputs.by} ${skill_pair_green.outputs.decision}"
  - name: skill-pair-local-proof
    description: "local proof: the tests on the werk, scope diff"
    depends: [skill-pair-check]
    action: dag.run
    with:
      dag: cicd-test
      params: "CARD=${CARD} ROLE=${ROLE} TRACE=${CHORUS_TRACE_ID} SCOPE=diff"
  - name: skill-pair-hand-off
    description: "hand off: one cicd run"
    depends: [skill-pair-local-proof]
    command: "env -u CHORUS_ROLE -u ROLE dagu --config ${CHORUS_HOME}/platform/config/dagu.yaml enqueue cicd -- CARD=${CARD} ROLE=${ROLE}"
  - name: skill-pair-end
    description: "pair end: the For-Jeff summary, deregister"
    depends: [skill-pair-hand-off]
    command: "${CHORUS_HOME}/platform/scripts/pair end ${CARD} ${ROLE} ${NAVIGATOR}"
