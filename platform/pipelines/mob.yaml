# GENERATED by chorus-make from the graph (#4465). Do not edit: change the rows and regenerate.
description: "werk v2 — pipeline mob, generated from the graph"
queue: mob
params:
  - CARD: ""
  - ROLE: ""
  - NAVIGATORS: ""
env:
  - CHORUS_HOME: ${CHORUS_HOME}
  - CHORUS_WERK_BASE: ${CHORUS_WERK_BASE}
  - CHORUS_BIN: ${CHORUS_BIN}
  - CHORUS_ROOT: ${CHORUS_HOME}
  - CHORUS_TRACE_ID: ${DAG_RUN_ID}
  - GIT_CONFIG_COUNT: 1
  - GIT_CONFIG_KEY_0: safe.directory
  - GIT_CONFIG_VALUE_0: ${CHORUS_WERK_BASE}/${ROLE}-${CARD}
  - PATH: ${CHORUS_WERK_BASE}/${ROLE}-${CARD}/platform/services/werk-test/target/release:${CHORUS_WERK_BASE}/${ROLE}-bin:${PATH}
handler_on:
  exit:
    command: '${CHORUS_HOME}/platform/scripts/run-finished ${CARD} ${ROLE} ${DAG_NAME} ${DAG_RUN_ID}'
steps:
  - name: skill-mob-start
    description: "mob start: a WIP card, the seats on the card, each navigator told"
    command: "${CHORUS_HOME}/platform/scripts/mob start ${CARD} ${ROLE} ${NAVIGATORS}"
  - name: skill-mob-verified
    description: "every seat verified from its own account"
    depends: [skill-mob-start]
    id: skill_mob_verified
    action: human.task
    with:
      prompt: "every seat verified from its own account for #${CARD}? (${NAVIGATORS} answers)"
      form:
        type: object
        properties:
          by:
            type: string
          decision:
            type: string
            enum: [verified, fail, stop]
        required: [by, decision]
  - name: skill-mob-check
    description: "the runner's records hold a PASS from every seat"
    depends: [skill-mob-verified]
    command: "${CHORUS_HOME}/platform/scripts/mob check ${CARD} ${skill_mob_verified.outputs.by} ${skill_mob_verified.outputs.decision}"
  - name: skill-mob-hand-off
    description: "hand off: one cicd run"
    depends: [skill-mob-check]
    command: "env -u CHORUS_ROLE ${CHORUS_HOME}/platform/scripts/pipeline-start handoff ${CARD} ${ROLE}"
