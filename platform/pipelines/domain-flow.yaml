  - CHORUS_WERK_BASE: ${CHORUS_WERK_BASE}
  - CHORUS_BIN: ${CHORUS_BIN}
  - CHORUS_ROOT: ${CHORUS_HOME}
  - CHORUS_TRACE_ID: ${DAG_RUN_ID}
  - GIT_CONFIG_COUNT: 1
  - GIT_CONFIG_KEY_0: safe.directory
  - GIT_CONFIG_VALUE_0: ${CHORUS_WERK_BASE}/${ROLE}-${CARD}
  - PATH: ${CHORUS_WERK_BASE}/${ROLE}-${CARD}/platform/services/werk-test/target/release:${CHORUS_WERK_BASE}/${ROLE}-bin:${PATH}
handler_on:
  failure:
    command: '${CHORUS_HOME}/platform/scripts/ops-nudge ${ROLE} "werk v2 #${CARD} domain-flow $(python3 ${CHORUS_HOME}/platform/scripts/chorus-werk-status --why ${DAG_NAME} ${DAG_RUN_ID} || echo failed) · dagu ${DAG_RUN_ID} · /cws ${CARD}"'
steps:
  - name: skill-domain-flow-inventory
    description: "inventory: every use of the domain, found by the patterns on its row"
    command: "${CHORUS_HOME}/platform/scripts/domain-flow inventory DOMAIN=${DOMAIN}"
  - name: skill-domain-flow-bar
    description: "the bar for the domain, named by Jeff"
    depends: [skill-domain-flow-inventory]
    id: skill_domain_flow_bar
    action: human.task
    with:
      prompt: "the bar for the domain, named by Jeff for #${CARD}? (${APPROVER} answers)"
