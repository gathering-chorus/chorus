# memory-backup-stale.yml — #4634. A backup copy of messages or events is more than a day old.
#
# Reads ONLY the herald sensors' SensorReadings (Jeff, 2026-10-18: monitors and
# alerts run on sensor output; only sensors touch the world). READINGS_URL is
# the seam: a test hands it a file:// fixture. No reading at all is its own
# finding ("no-reading"): a silent sensor must never read as healthy.
#
# alert-runner contract: stdout must equal literal "ok" for success.

name: memory-backup-stale
description: the Bedroom copy of pulse messages.db or the spine is older than 24 hours
severity: warning
owner: silas
schedule: "17 * * * *"

check: |
  # today's and yesterday's readings only, filtered by day, so a full page can
  # never push today's rows off and read as a false red (Kade, #4634)
  if [ -n "$READINGS_URL" ]; then
    BODY=$(curl -sf -m 20 "$READINGS_URL") || { echo "no-reading:readings-unreadable"; exit 1; }
  else
    BASE="http://localhost:3360/v1/heralds/sensorreadings"
    T=$(TZ=America/New_York date +%F); Y=$(TZ=America/New_York date -v-1d +%F)
    A=$(curl -sf -m 20 "$BASE?readingDay=$T&limit=1000") || { echo "no-reading:readings-unreadable"; exit 1; }
    B=$(curl -sf -m 20 "$BASE?readingDay=$Y&limit=1000") || { echo "no-reading:readings-unreadable"; exit 1; }
    BODY=$(printf '%s\n%s' "$A" "$B" | python3 -c 'import json,sys; print(json.dumps({"data": [r for l in sys.stdin if l.strip() for r in json.loads(l).get("data", [])]}))')
  fi
  printf '%s' "$BODY" | python3 -c '
  import json, sys, datetime, zoneinfo
  rows = json.load(sys.stdin).get("data", [])
  today = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York")).date()
  TODAY, YDAY = today.isoformat(), (today - datetime.timedelta(days=1)).isoformat()
  def val(sensor, metric, day):
      for r in rows:
          if r.get("readingOfSensor") == sensor and r.get("readingMetric") == metric and str(r.get("readingDay", ""))[:10] == day and not r.get("readingRole"):
              return float(r.get("readingValue"))
      return None
  bad = []
  for s in ("messages", "events"):
      h = val(s, "backup-age", TODAY)
      if h is None: bad.append(f"no-reading:{s}-backup-age-{TODAY}")
      elif h > 24: bad.append(f"stale:{s}-copy-{int(h)}h>24h")
  print(" ".join(bad) or "ok"); sys.exit(1 if bad else 0)
  '

action: |
  OPS_NUDGE="/Users/jeffbridwell/CascadeProjects/chorus/platform/scripts/ops-nudge"
  "$OPS_NUDGE" silas "memory-backup-stale: rule the Bedroom copy of pulse messages.db or the spine is older than 24 hours: $STATUS" 2>/dev/null || true
