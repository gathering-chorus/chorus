# ci-main-red.yml — Alert when GitHub Actions on main branch is red.
# Card #2481 sub-AC 8 | ADR-026 §d (reactive posture).
#
# Branch protection (proactive) prevents merge of red PRs into main.
# This alert catches the case where main lands red anyway — direct push,
# admin override, post-merge regression on a flake — and routes to silas.
# No auto-revert (ADR-026 §d explicitly vetoes that).

name: ci-main-red
description: GitHub Actions quality workflow on main branch is failing
severity: critical
schedule: "*/10 * * * *"

check: |
  # #3709 — the body lives in the script beside this file. Inline, the
  # runner's extractor (alert-runner.sh:31) stopped at the embedded
  # python's column-0 `import`, truncating the check mid-string so what
  # ran did not parse — it could only ever report its own early-exit,
  # never CI's state. A one-line call has no column-0 line to trip on.
  # Absolute path + precedent: fuseki-harvest-stale.yml (#2327).
  /Users/jeffbridwell/CascadeProjects/chorus/proving/domains/alerts/ci-main-red.check.sh

action: |
  # Daily cooldown — don't re-nudge silas every 10 minutes for the same red.
  COOLDOWN="/tmp/alert-ci-main-red-$(date '+%Y-%m-%d')"
  if [ -f "$COOLDOWN" ]; then
    exit 0
  fi
  touch "$COOLDOWN"
  OPS_NUDGE="/Users/jeffbridwell/CascadeProjects/chorus/platform/scripts/ops-nudge"
  "$OPS_NUDGE" silas "ci-main-red: $STATUS (quality.yml on main — red:<url> means completed+failure; unverifiable:GH_TOKEN-absent means CI state could not be checked)" 2>/dev/null || true
