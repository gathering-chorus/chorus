# crawler-stale.yml — the live crawler (chorus-crawl, #4173) has not completed a
# full pass in a day, or its last pass could not vouch for the graph.
#
# History: #2817 wrote this for com.chorus.crawler-index; #3380 tombstoned it
# when that loop was retired (2026-06-12); #4154/#4173 made a new crawler live
# and left the tombstone in place, so the alert stayed silent for three months
# while the thing it guards ran nightly (found by the 2026-09-17 nightly, #4197).
#
# What it reads — the crawler's own evidence, nothing else:
#   CRAWL_LOG        ~/Library/Logs/Chorus/crawl-nightly.log (the 04:30 launchd pass)
#   .chorus-crawl-watermark  at CHORUS_ROOT — the commit the graph is known to match
# Stale when: no log · the log has not been written in 26 h · the last pass held
# its watermark ("watermark HELD" — deletes refused or a write failed) · no
# watermark file at all. Seams CRAWL_LOG / CHORUS_ROOT exist so the live test can
# hand the check a fixture (test-crawler-alerts-live.sh).
#
# alert-runner contract: stdout must equal literal "ok" for success.

name: crawler-stale
description: chorus-crawl has not completed a full pass in 26h, or its last pass held the watermark
severity: warning
owner: kade
schedule: "*/5 * * * *"

check: |
  LOG="${CRAWL_LOG:-$HOME/Library/Logs/Chorus/crawl-nightly.log}"
  ROOT="${CHORUS_ROOT:-/Users/jeffbridwell/CascadeProjects/chorus}"
  MAX_AGE_SEC=93600
  if [ ! -f "$LOG" ]; then echo "no-crawl-log:$LOG"; exit 1; fi
  NOW=$(date +%s); MT=$(stat -f %m "$LOG" 2>/dev/null || stat -c %Y "$LOG")
  AGE=$((NOW - MT))
  if [ "$AGE" -gt "$MAX_AGE_SEC" ]; then echo "stale:last-pass-${AGE}s-ago>${MAX_AGE_SEC}s"; exit 1; fi
  # the LAST pass = from the last "chorus-crawl: full|delta" header to the end
  LAST=$(awk '/^chorus-crawl: (full|delta)/{buf=""} {buf=buf $0 "\n"} END{printf "%s", buf}' "$LOG")
  if [ -z "$LAST" ]; then echo "no-pass-in-log"; exit 1; fi
  if printf '%s' "$LAST" | grep -q "watermark HELD"; then echo "held:last-pass-could-not-vouch-for-the-graph"; exit 1; fi
  if [ ! -s "$ROOT/.chorus-crawl-watermark" ]; then echo "no-watermark:$ROOT/.chorus-crawl-watermark"; exit 1; fi
  echo "ok"
  exit 0

action: |
  OPS_NUDGE="/Users/jeffbridwell/CascadeProjects/chorus/platform/scripts/ops-nudge"
  "$OPS_NUDGE" kade "crawler-stale: chorus-crawl has no fresh full pass or held its watermark. Read ~/Library/Logs/Chorus/crawl-nightly.log (last pass) and launchctl list com.chorus.crawl-nightly" 2>/dev/null || true
