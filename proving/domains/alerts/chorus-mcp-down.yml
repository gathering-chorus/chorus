# chorus-mcp-down.yml — Alert when the tool runner (the MCP endpoint every
# session and job calls) stops answering.
# Card #2475 | observability thread 2 of 5; retargeted by #4515, when the old
# MCP server on :3341 was retired and the tool runner (:3342) took its place.
#
# When the runner is down, every tool call fails, including
# chorus_nudge_message. The full MCP round trip (credential + tools/list on the
# 2026-07-28 release) is chorus-health's mcp-round-trip check; this alert is the
# fast liveness leg: the runner's /health, status only, no credential needed.

name: chorus-mcp-down
description: tool runner (:3342) /health not answering
severity: critical
schedule: "*/5 * * * *"

check: |
  CODE=$(curl -s -o /dev/null --max-time 5 -w '%{http_code}' "http://127.0.0.1:3342/health" 2>/dev/null)
  case "$CODE" in
    200) echo "ok"; exit 0 ;;
    *)   echo "chorus-mcp-down:status=${CODE:-000}"; exit 1 ;;
  esac

action: |
  COOLDOWN="/tmp/alert-chorus-mcp-down-$(date '+%Y-%m-%d-%H')"
  if [ -f "$COOLDOWN" ]; then
    exit 0
  fi
  touch "$COOLDOWN"
  OPS_NUDGE="/Users/jeffbridwell/CascadeProjects/chorus/platform/scripts/ops-nudge"
  "$OPS_NUDGE" silas "chorus-mcp-down: the tool runner (:3342) /health is not answering. Every tool call (chorus_nudge_message, etc.) fails for every role. Check com.chorus.runner." 2>/dev/null || true
