# messages-not-kept.yml — #4634. Messages were sent that Buzz did not keep (sent and kept differ for yesterday).
#
# Reads ONLY the herald sensors' SensorReadings (Jeff, 2026-10-18: monitors and
# alerts run on sensor output; only sensors touch the world). READINGS_URL is
# the seam: a test hands it a file:// fixture. No reading at all is its own
# finding ("no-reading"): a silent sensor must never read as healthy.
#
# alert-runner contract: stdout must equal literal "ok" for success.

name: messages-not-kept
description: yesterday's messages-sent and messages-kept readings differ
severity: warning
owner: silas
schedule: "17 * * * *"

check: |
  URL="${READINGS_URL:-http://localhost:3360/v1/heralds/sensorreadings?limit=5000}"
  BODY=$(curl -sf -m 20 "$URL") || { echo "no-reading:readings-unreadable"; exit 1; }
  printf '%s' "$BODY" | python3 -c '
  import json, sys, datetime, zoneinfo
  rows = json.load(sys.stdin).get("data", [])
  today = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York")).date()
  TODAY, YDAY = today.isoformat(), (today - datetime.timedelta(days=1)).isoformat()
  def val(sensor, metric, day):
      for r in rows:
          if r.get("readingOfSensor") == sensor and r.get("readingMetric") == metric and str(r.get("readingDay", ""))[:10] == day and not r.get("readingRole"):
              return float(r.get("readingValue"))
      return None
  sent, kept = val("messages", "messages-sent", YDAY), val("messages", "messages-kept", YDAY)
  if sent is None: print(f"no-reading:messages-sent-{YDAY}"); sys.exit(1)
  if kept is None: print(f"no-reading:messages-kept-{YDAY}"); sys.exit(1)
  if sent != kept: print(f"gap:sent-{int(sent)}-kept-{int(kept)}-on-{YDAY}"); sys.exit(1)
  print("ok")
  '

action: |
  OPS_NUDGE="/Users/jeffbridwell/CascadeProjects/chorus/platform/scripts/ops-nudge"
  "$OPS_NUDGE" silas "messages-not-kept: rule yesterday's messages-sent and messages-kept readings differ; values from the sensor readings, see /v1/heralds/sensorreadings" 2>/dev/null || true
