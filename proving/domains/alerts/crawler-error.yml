# crawler-error.yml — the live crawler's last pass failed writes or refused a
# mass delete.
#
# History: #2817 for com.chorus.crawler-index (consecutive domain failures);
# #3380 tombstoned it when that loop was retired; #4197 re-pointed it at the
# crawler that runs now (chorus-crawl, #4173). The old check counted
# crawler.domain.failed spine events; the new one reads the run line the
# crawler prints, the same line the nightly TOTAL reads (#4180 crawl_line).
#
# Fires when the LAST pass carries failed=N with N>0, "MASS DELETE REFUSED"
# (#4185: the tree is not the tree the graph describes — wrong CHORUS_ROOT), or
# "the run is RED". Seam CRAWL_LOG for the live test's fixtures.
#
# alert-runner contract: stdout must equal literal "ok" for success.

name: crawler-error
description: chorus-crawl's last pass failed writes or refused a mass delete
severity: warning
owner: kade
schedule: "*/5 * * * *"

check: |
  LOG="${CRAWL_LOG:-$HOME/Library/Logs/Chorus/crawl-nightly.log}"
  if [ ! -f "$LOG" ]; then echo "ok"; exit 0; fi   # absence is crawler-stale's to say, not this alert's
  LAST=$(awk '/^chorus-crawl: (full|delta)/{buf=""} {buf=buf $0 "\n"} END{printf "%s", buf}' "$LOG")
  FAILED=$(printf '%s' "$LAST" | grep -o 'failed=[0-9]*' | tail -1 | cut -d= -f2)
  if [ -n "$FAILED" ] && [ "$FAILED" -gt 0 ] 2>/dev/null; then echo "write-failures:$FAILED"; exit 1; fi
  if printf '%s' "$LAST" | grep -q "MASS DELETE REFUSED"; then echo "mass-delete-refused:wrong-tree-or-wrong-store"; exit 1; fi
  if printf '%s' "$LAST" | grep -q "the run is RED"; then echo "run-red"; exit 1; fi
  echo "ok"
  exit 0

action: |
  OPS_NUDGE="/Users/jeffbridwell/CascadeProjects/chorus/platform/scripts/ops-nudge"
  "$OPS_NUDGE" kade "crawler-error: chorus-crawl's last pass failed writes or refused a mass delete. Read the last pass in ~/Library/Logs/Chorus/crawl-nightly.log" 2>/dev/null || true
