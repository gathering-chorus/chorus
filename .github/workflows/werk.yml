name: werk

# werk — THE pipeline. ONE job, ONE run (#3499). There is no demo-half / land-half:
# the GO is given AT INVOKE (the `go` input), werk-demo PROVES in-run (gates, gathers,
# block-on-replies) and its EXIT CODE drives whether the next step runs. No inputs.go
# job fork, no second invocation, no cross-run witness — the demo→merge edge is a
# native in-run dependency, so it can't round-churn.
#
# werk-demo exit contract (#3237, go-at-invoke world — Wren aed9dd4e):
#   0 = proven AND go==true  → continue to merge  (gates recorded + both gathers replied in time)
#   2 = clean stop, job GREEN → presented, NOT landed  (go==false present-only / timeout / gates-pending)
#   1 = real error           → job fails red
# The demo step maps that rc to a step output `proven`; merge→sync→deploy→accept are
# gated `if: steps.demo.outputs.proven == 'true'`. rc=2 → those skip, job stays green.
#
# Every verb runs THROUGH MCP via chorus-mcp-call.sh (the single toolchain). Stop-on-
# failure is the GHA default — any verb's non-zero exit halts the job; nothing half-lands.

on:
  workflow_dispatch:
    inputs:
      card_id:
        description: "Card # to run through the pipeline (e.g. 3236). The trace key end-to-end."
        required: true
        type: string
      role:
        description: "Builder role whose werk runs (kade / silas / wren)."
        required: true
        type: string
      go:
        description: "GO AT INVOKE. {true|go|yes} = prove-and-land (merge→sync→deploy→accept if proven). false/absent = present-only, stop green."
        required: false
        type: string
        default: "false"
      accepter:
        description: "Authorizing identity (jeff / wren) (DEC-048) — whose GO lands the card. Required for a landing run (go=true); ignored present-only."
        required: false
        type: string
        default: ""

jobs:
  werk:
    runs-on: macos-latest
    # CHORUS_HOME / CHORUS_WERK_BASE / PATH inherited from the local shell act runs in
    # (chorus-env-setup.sh provides them). The workflow MUST NOT hardcode them.
    env:
      CARD_ID: ${{ inputs.card_id }}
      ROLE: ${{ inputs.role }}
      GO: ${{ inputs.go }}
      ACCEPTER: ${{ inputs.accepter }}
      # #3745 — act sets CI=true, which the #3615 membrane classifies as a build
      # context and refuses live-spine writes. This pipeline is a prod-adjacent
      # RUNNER (its verbs legitimately emit real spine events), so it declares
      # the explicit prod contract (membrane-surfaces.json context_contract).
      # Suites the pipeline RUNS still get test seams from test_helper/jest env
      # — declaring prod here does not leak into their own-world overrides.
      CHORUS_CONTEXT: prod

    steps:
      - name: shared-trace
        # Mint ONE trace for the whole run, propagate via $GITHUB_ENV so every later step
        # (and every verb subprocess the MCP server spawns) inherits CHORUS_TRACE_ID.
        run: |
          trace="$(date +%s%N)-$$"
          echo "CHORUS_TRACE_ID=$trace" >> "$GITHUB_ENV"
          echo "minted trace=$trace for card=#${CARD_ID} role=${ROLE} go=${GO} accepter=${ACCEPTER:-<none>}"
          mkdir -p "${CHORUS_HOME}/ops/logs" 2>/dev/null || true
          ts=$(($(date +%s)*1000))  # BSD date has no %3N (#3266)
          printf '{"ts":%s,"event":"werk.started","card_id":%s,"role":"%s","go":"%s","accepter":"%s","trace_id":"%s"}\n' \
            "$ts" "${CARD_ID}" "${ROLE}" "${GO}" "${ACCEPTER}" "$trace" \
            >> "${CHORUS_HOME}/ops/logs/werk.jsonl" 2>/dev/null || true

      # ═══ #3921/#3943 — A GO IS THREE STEPS, NOT ANOTHER LOOP. ═══
      # go=true used to re-run build+test+demo (p95 25min) on the EXACT commit
      # the human just saw presented. #3921's pin-based compare never fired: the
      # go-launch rewrites the run pin (phase=running, fresh patchId) before this
      # step reads it — observed on the #3925/#3945/#3929 lands, three full
      # re-proves of presented rounds in one evening. #3943 moves the input to
      # the werk-demo WITNESS (demo.presented lines), written at present time
      # and never rewritten. On go: witness matches HEAD → Half-A is skipped and
      # the land is merge→deploy-canonical→accept. Drift or a missing witness
      # REFUSES the go by name (supersede guard) — a go never silently re-proves.
      - name: proven-round
        id: provenround
        run: |
          SKIP=false
          LANDED=false
          case "${GO}" in true|go|yes)
            WERKDIR0="${CHORUS_WERK_BASE:-/Users/jeffbridwell/CascadeProjects/chorus-werk}/${ROLE}-${CARD_ID}"
            # #3955 AC1 — a retry after its own squash-merge: the werk tree is
            # content-identical to origin/main, so commit/push/merge have nothing
            # to do (a rebase would only conflict — run 53's wedge). The land's
            # remaining job is deploy+accept.
            if git -C "$WERKDIR0" diff --quiet origin/main HEAD 2>/dev/null                && [ -z "$(git -C "$WERKDIR0" status --porcelain 2>/dev/null | head -1)" ]; then
              LANDED=true
              SKIP=true
              echo "already_landed=true" >> "$GITHUB_OUTPUT"
              echo "skip_prove=true" >> "$GITHUB_OUTPUT"
              echo "proven-round: werk tree == origin/main — content landed; deploy+accept only"
              exit 0
            fi
            echo "already_landed=false" >> "$GITHUB_OUTPUT"
            WITNESS="${CHORUS_HOME}/ops/logs/werk-demo.jsonl"
            # witness patch_id is a CONTENT hash (git patch-id of merge-base..HEAD),
            # NOT a commit sha — first live go (#3919 run 46) refused on that
            # confusion. Compare content to content; also rebase-proof.
            WERKDIR="${CHORUS_WERK_BASE:-/Users/jeffbridwell/CascadeProjects/chorus-werk}/${ROLE}-${CARD_ID}"
            BASE=$(git -C "$WERKDIR" merge-base origin/main HEAD 2>/dev/null || echo "")
            HEADSHA=""
            if [ -n "$BASE" ]; then
              HEADSHA=$(git -C "$WERKDIR" diff "$BASE..HEAD" 2>/dev/null | git patch-id --stable | awk '{print $1}')
            fi
            [ -n "$HEADSHA" ] || HEADSHA=none
            PRESENTED=$(python3 -c '
          import json, sys
          path, card = sys.argv[1], sys.argv[2]
          last = ""
          try:
              for line in open(path):
                  try:
                      d = json.loads(line)
                  except ValueError:
                      continue
                  if d.get("event") == "demo.presented" and str(d.get("card_id")) == card:
                      last = d.get("patch_id", "")
          except OSError:
              pass
          print(last)
          ' "$WITNESS" "${CARD_ID}" 2>/dev/null)
            if [ -z "$PRESENTED" ]; then
              echo "go-refused: no demo.presented witness for card ${CARD_ID} — present before go" >&2
              exit 1
            fi
            if [ "$HEADSHA" != "$PRESENTED" ]; then
              echo "go-refused: werk content drifted since present (presented patch-id=$PRESENTED current patch-id=$HEADSHA) — supersede and re-present" >&2
              exit 1
            fi
            # a dirty werk would be committed AFTER this compare — content the
            # human never saw. Uncommitted drift refuses exactly like committed.
            DIRTY=$(git -C "${CHORUS_WERK_BASE:-/Users/jeffbridwell/CascadeProjects/chorus-werk}/${ROLE}-${CARD_ID}" status --porcelain 2>/dev/null | head -1)
            if [ -n "$DIRTY" ]; then
              echo "go-refused: werk has uncommitted changes since present (${DIRTY}) — supersede and re-present" >&2
              exit 1
            fi
            SKIP=true
          ;; esac
          # #3955 AC3 — a content-identical RE-PRESENT re-pays nothing: gates and
          # gathers are patch-keyed (#3454), so if the witness already presented
          # this exact patch and the tree is clean, the prove is already paid.
          # Half of all presents were identical re-presents (measured 2026-08-21:
          # #3911 14/7, #1778 13/5, #3606 25/11). Dirty tree or changed content
          # takes the full path — commit may change the patch.
          if [ "$SKIP" = "false" ] && [ -z "${GO}" -o "${GO}" = "false" ]; then
            WERKDIR="${CHORUS_WERK_BASE:-/Users/jeffbridwell/CascadeProjects/chorus-werk}/${ROLE}-${CARD_ID}"
            if [ -z "$(git -C "$WERKDIR" status --porcelain 2>/dev/null | head -1)" ]; then
              WITNESS="${CHORUS_HOME}/ops/logs/werk-demo.jsonl"
              BASE=$(git -C "$WERKDIR" merge-base origin/main HEAD 2>/dev/null || echo "")
              CURID=""
              if [ -n "$BASE" ]; then
                CURID=$(git -C "$WERKDIR" diff "$BASE..HEAD" 2>/dev/null | git patch-id --stable | awk '{print $1}')
              fi
              LASTID=$(python3 -c '
          import json, sys
          path, card = sys.argv[1], sys.argv[2]
          last = ""
          try:
              for line in open(path):
                  try:
                      d = json.loads(line)
                  except ValueError:
                      continue
                  if d.get("event") == "demo.presented" and str(d.get("card_id")) == card:
                      last = d.get("patch_id", "")
              print(last)
          except OSError:
              print("")
          ' "$WITNESS" "${CARD_ID}" 2>/dev/null)
              if [ -n "$CURID" ] && [ "$CURID" = "$LASTID" ]; then
                SKIP=true
                echo "proven-round: re-present of the SAME patch ($CURID) — prove already paid, re-announcing"
              fi
            fi
          fi
          echo "skip_prove=$SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "proven-round: HEAD == last presented witness ($PRESENTED) — proof exists, land is merge→deploy→accept"
          else
            echo "proven-round: full prove path (present run)"
          fi

      # ═══ prove in the role's slot — never touches main until merge (gated on proven) ═══
      - name: commit
        id: commit
        if: ${{ steps.provenround.outputs.already_landed != 'true' }}
        # werk-commit, via MCP. Stages add-A in the card's werk + commits. Rebase onto
        # origin/main happens INSIDE commit under flock (#3186) — no separate rebase step.
        run: chorus-mcp-call.sh "${ROLE}" werk-commit "$(printf '{"role":"%s","card_id":%s}' "${ROLE}" "${CARD_ID}")"

      - name: push
        id: push
        if: ${{ steps.provenround.outputs.already_landed != 'true' }}
        run: chorus-mcp-call.sh "${ROLE}" werk-push "$(printf '{"role":"%s","card_id":%s}' "${ROLE}" "${CARD_ID}")"

      - name: build
        id: build
        if: ${{ steps.provenround.outputs.skip_prove != 'true' }}
        # target=werk implied: builds the card's werk for the demo slot.
        run: |
          # #3956 — resume: a passed leg with an unchanged tree carries (exit 0),
          # a changed tree or missing pin refuses loudly (exit 2 → red).
          rc=0; "${CHORUS_HOME}/platform/scripts/werk-resume-check" "${CARD_ID}" "${ROLE}" build || rc=$?
          case "$rc" in 0) exit 0 ;; 2) exit 1 ;; esac
          chorus-mcp-call.sh "${ROLE}" werk-build "$(printf '{"role":"%s","card_id":%s}' "${ROLE}" "${CARD_ID}")"

      - name: test
        id: test
        if: ${{ steps.provenround.outputs.skip_prove != 'true' }}
        # #3190 — werk-test VERB: the BLOCKING test floor (promotes the old inline step into
        # a real verb). Runs the card's AFFECTED units only — cargo per changed crate, tsc+jest
        # per changed TS package, plus workspace clippy-ratchet + doc-coherence (the three the
        # inline step never ran) — emits a typed `test.failed` to the spine per failure, and
        # EXITS 1 if a real unit fails, which halts the land. Bootstrap escape (in the verb):
        # a self-modifying card (diff touches werk.yml or the werk-test crate — e.g. #3190
        # itself) runs ADVISORY (exit 0) so it can't deadlock against the canonical werk.yml it
        # is fixing. Determinism (#3190 governing bar): same diff → same units → same gates →
        # same verdict. The pyramidLayer/hermeticity tier-selection (Silas #3540) wires in next.
        run: |
          # #3956 — resume: a passed leg with an unchanged tree carries (exit 0),
          # a changed tree or missing pin refuses loudly (exit 2 → red).
          rc=0; "${CHORUS_HOME}/platform/scripts/werk-resume-check" "${CARD_ID}" "${ROLE}" test || rc=$?
          case "$rc" in 0) exit 0 ;; 2) exit 1 ;; esac
          set -o pipefail
          # #3484: pin node 20 — the verb shells jest, whose better-sqlite3 native module is
          # built for node 20's ABI; act's login PATH otherwise picks node 23 → false ABI reds.
          N20="$(ls -d "$HOME"/.nvm/versions/node/v20*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -n "$N20" ]; then export PATH="$N20:$PATH"; echo "-- pinned node $("$N20/node" -v 2>/dev/null) for werk-test (login shell had $(node -v 2>/dev/null)) --"; fi
          WERK="${CHORUS_WERK_BASE}/${ROLE}-${CARD_ID}"; SHA=$(git -C "$WERK" rev-parse HEAD)
          post(){ gh api "repos/gathering-chorus/chorus/statuses/$SHA" -f "state=$1" -f "context=chorus/test/${CARD_ID}" -f "description=role=${ROLE} trace=${CHORUS_TRACE_ID:-} (werk-test #3190 — blocking floor)" >/dev/null 2>&1 || true; }
          post pending
          set +e
          # #3701 — pin CHORUS_ROOT to the werk: clippy-ratchet.py prefers $CHORUS_ROOT,
          # which the session env points at CANONICAL — so the ratchet measured main
          # instead of this card's werk (a lint landed on main blocks every later card,
          # and the card fixing it can never green). Same class as run_doc_coherence's
          # CHORUS_REPO pin; werk-test's run_clippy_ratchet gets the same pin in source.
          # #3745 stated the rule: "The prod declaration is the RUNNER's identity,
          # never the tests'." It cleared CHORUS_CONTEXT here — which cleared it for
          # werk-test ITSELF, not just the suites werk-test spawns. Under act (CI=true)
          # the runner then classified as a BUILD context and every spine event it
          # emitted panicked on the membrane: the gate ran and left no record.
          # #3918 moves the clearing one level down, into werk-test, which sets
          # CHORUS_CONTEXT="" on each test child it spawns (cargo/jest/tsc/bats). The
          # suites still classify ambient and are still refused the production spine;
          # the runner keeps the prod identity its own telemetry needs.
          CHORUS_ROOT="$WERK" PATH="$HOME/.local/bin:$HOME/.chorus/bin:$PATH" werk-test "${CARD_ID}" "${ROLE}"
          rc=$?
          set -e
          if [ "$rc" = 0 ]; then post success; else post failure; fi
          # #3638 — record the REAL verdict into the demo witness (trace-scoped) so the
          # demo's tests: badge shows this run's blocking result instead of re-running a
          # generic cargo default that false-reds at the repo root (no root Cargo.toml).
          DEPLOY_ROLE="${ROLE}" PATH="$HOME/.local/bin:$HOME/.chorus/bin:$PATH" \
            werk-demo test-result "${CARD_ID}" "$([ "$rc" = 0 ] && echo pass || echo fail)" \
            || echo "WARN: werk-demo test-result write failed — demo badge will fall back to its self-run (#3638)"
          echo "werk-test: rc=$rc (BLOCKING — a red affected unit halts the land; self-modifying cards run advisory)"
          exit "$rc"

      - name: review
        id: review
        if: ${{ steps.provenround.outputs.skip_prove != 'true' }}
        # werk-review ADVISORY floor — records review.floor + chorus/review/<card> status.
        run: |
          # #3956 — resume: a passed leg with an unchanged tree carries (exit 0),
          # a changed tree or missing pin refuses loudly (exit 2 → red).
          rc=0; "${CHORUS_HOME}/platform/scripts/werk-resume-check" "${CARD_ID}" "${ROLE}" review || rc=$?
          case "$rc" in 0) exit 0 ;; 2) exit 1 ;; esac
          WERK="${CHORUS_WERK_BASE}/${ROLE}-${CARD_ID}"; SHA=$(git -C "$WERK" rev-parse HEAD)
          post(){ gh api "repos/gathering-chorus/chorus/statuses/$SHA" -f "state=$1" \
            -f "context=chorus/review/${CARD_ID}" \
            -f "description=role=${ROLE} trace=${CHORUS_TRACE_ID:-} (advisory floor — #3193)" >/dev/null 2>&1 || true; }
          post pending
          out=$(DEPLOY_ROLE="${ROLE}" werk-review "${CARD_ID}" "${ROLE}" 2>&1) || true
          echo "$out"
          case "$out" in *"floor clean"*) post success ;; *) post failure ;; esac
          echo "review: advisory — floor findings inform the cold-eyes agent + the demo surface"

      - name: deploy-werk
        id: deploy_werk
        # target=werk: per-card slot for the demo, NOT canonical — main is untouched.
        # #3943 — skipped on a proven go: the slot was deployed at present and the
        # canonical deploy (#3316 rebuild+cdhash prove) is Half B's own step.
        if: ${{ steps.provenround.outputs.skip_prove != 'true' }}
        run: |
          # #3956 — resume: a passed leg with an unchanged tree carries (exit 0),
          # a changed tree or missing pin refuses loudly (exit 2 → red).
          rc=0; "${CHORUS_HOME}/platform/scripts/werk-resume-check" "${CARD_ID}" "${ROLE}" deploy-werk || rc=$?
          case "$rc" in 0) exit 0 ;; 2) exit 1 ;; esac
          chorus-mcp-call.sh "${ROLE}" werk-deploy "$(printf '{"role":"%s","card_id":%s,"target":"werk"}' "${ROLE}" "${CARD_ID}")"

      - name: env-up
        id: env_up
        # posts chorus/env-up/<card>; fails the job if the slot doesn't come up.
        # #3943 — skipped on a proven go: the env is still up from present.
        if: ${{ steps.provenround.outputs.skip_prove != 'true' }}
        run: |
          # #3956 — resume: a passed leg with an unchanged tree carries (exit 0),
          # a changed tree or missing pin refuses loudly (exit 2 → red).
          rc=0; "${CHORUS_HOME}/platform/scripts/werk-resume-check" "${CARD_ID}" "${ROLE}" env-up || rc=$?
          case "$rc" in 0) exit 0 ;; 2) exit 1 ;; esac
          WERK="${CHORUS_WERK_BASE}/${ROLE}-${CARD_ID}"; SHA=$(git -C "$WERK" rev-parse HEAD)
          post(){ gh api "repos/gathering-chorus/chorus/statuses/$SHA" -f "state=$1" -f "context=chorus/env-up/${CARD_ID}" -f "description=role=${ROLE} trace=${CHORUS_TRACE_ID:-}" >/dev/null 2>&1 || true; }
          post pending
          if chorus-mcp-call.sh "${ROLE}" werk-deploy "$(printf '{"role":"%s","card_id":%s,"env_up":true}' "${ROLE}" "${CARD_ID}")"; then post success; else post failure; exit 1; fi

      - name: prove-live
        id: prove_live
        # #4102 — the card's own integration bats, run against the card's VARIANT,
        # after env-up.
        #
        # Why this step exists: the test leg runs BEFORE deploy-werk and env-up, so
        # at that point the card's stack does not exist yet. An integration bats
        # there either self-skips (green for no reason) or resolves its default
        # OWL_URL to :3360 — CANONICAL — and reports a red that is really "the
        # membrane refused a test writing to prod". Both readings are wrong, and
        # the AC that needs a live door goes unproven either way (#4102: eight
        # checks failed in the test leg and all eight pass against the variant).
        #
        # The port comes from `werk-deploy env-port`, the one table that assigns
        # variant ports — never a literal here, or this lane drifts back onto
        # canonical the next time the map changes.
        if: ${{ steps.provenround.outputs.skip_prove != 'true' }}
        run: |
          set -euo pipefail
          WERK="${CHORUS_WERK_BASE}/${ROLE}-${CARD_ID}"
          FILES=$(git -C "$WERK" diff --name-only origin/main...HEAD -- 'platform/tests/*.bats' || true)
          if [ -z "$FILES" ]; then
            echo "prove-live: this card changes no platform/tests/*.bats — nothing to run (explicit absence, not a pass)"
            exit 0
          fi
          PORT=$(werk-deploy env-port athena-make "${ROLE}")
          export OWL_URL="http://localhost:${PORT}"
          export RUN_INTEGRATION=true
          echo "prove-live: OWL_URL=${OWL_URL} (the ${ROLE} variant, not canonical :3360)"
          # the variant must actually answer, or this leg is measuring nothing
          curl -sf --max-time 10 "${OWL_URL}/health" >/dev/null || {
            echo "prove-live: the variant's athena-make did not answer at ${OWL_URL} — env-up said it was up; refusing to report a verdict" >&2
            exit 1
          }
          rc=0
          for f in $FILES; do
            [ -f "$WERK/$f" ] || continue
            echo "-- $f"
            ( cd "$WERK" && bats "$f" ) || rc=1
          done
          echo "prove-live: rc=$rc (BLOCKING — an AC that needs the live door is proven here or not at all)"
          exit "$rc"

      - name: demo
        id: demo
        # #3519 — THE WITNESS-GATED LAND. Three separable steps, one source of truth (the
        # witness ops/logs/werk-demo.jsonl):
        #   1. RECORD the human GO. #3511 retired the at-invoke go-flag (werk-demo ignores the
        #      2nd positional), and the /cw land path was never reconnected to the go-RECORDING
        #      (`werk-demo go`) — so Jeff's go was never written. Recorded under ACCEPTER (not
        #      ROLE) so #3511's self-accept guard stays closed; GO without accepter is refused.
        #   2. PRESENT the variant — demo() ALWAYS exits 2 (present-and-exit, #3279/#3511). Its
        #      exit code is NOT the land gate (that was the #3499/#3511 contradiction: merge gated
        #      on a demo exit-0 that can never come → nothing landed, 101 historically vs 0 recent).
        #   3. VERDICT — `werk-demo verdict` reads the WITNESS and exits 0 iff gates + both peer
        #      gathers + Jeff's go are recorded for THIS patch-id (patch-keyed → survives the
        #      concurrent rebases that churn the round-sha). proven keys on THIS, not demo's exit.
        run: |
          set +e
          case "${GO}" in
            true|go|yes|GO)
              if [ -z "${ACCEPTER}" ]; then echo "[demo] GO with no accepter — refusing (DEC-048)"; exit 1; fi
              PATH="$HOME/.local/bin:$PATH" DEPLOY_ROLE="${ACCEPTER}" werk-demo go "${CARD_ID}" ;;
          esac
          # #3955 — already-landed retry: the content is ON main, and merge is
          # verdict-gated, so presence on main IS the completed proof. Verdict
          # can't re-check here (patch-id of a merged werk is empty — approvals
          # are keyed to the pre-merge patch). Record the go, verify the witness
          # holds a demo.decision go for this card, and pass proven through.
          if [ "${{ steps.provenround.outputs.already_landed }}" = "true" ]; then
            if grep -q "\"event\":\"demo.decision\",\"role\":\"[a-z]*\",\"card_id\":${CARD_ID}," "${CHORUS_HOME}/ops/logs/werk-demo.jsonl" 2>/dev/null; then
              echo "proven=true" >> "$GITHUB_OUTPUT"
              echo "[demo] already-landed retry: content on main (merge is verdict-gated) + recorded go — deploy+accept proceed"
              exit 0
            fi
            echo "[demo] already-landed but NO recorded demo.decision for #${CARD_ID} — refusing (no self-accept, #3410)"
            echo "proven=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # #3921 — on a proven round (skip_prove), do NOT re-present: the round
          # Jeff saw is the round on disk (sha-equal, checked upstream). Recording
          # the GO still goes through werk-demo, and proven still comes ONLY from
          # the witness verdict below — no self-accept hole (#3410): a go with no
          # recorded witness for this patch stays unproven and HELD.
          if [ "${{ steps.provenround.outputs.skip_prove }}" = "true" ]; then
            PATH="$HOME/.local/bin:$PATH" DEPLOY_ROLE="${ROLE}" werk-demo "${CARD_ID}" "${GO}" || true
            echo "[demo] proven-round fast path: go recorded, verdict decides"
          else
            PATH="$HOME/.local/bin:$PATH" DEPLOY_ROLE="${ROLE}" werk-demo "${CARD_ID}" "${GO}"
            drc=$?
            if [ "$drc" != 0 ] && [ "$drc" != 2 ]; then echo "[demo] present error rc=$drc"; exit "$drc"; fi
          fi
          vout=$(PATH="$HOME/.local/bin:$PATH" DEPLOY_ROLE="${ROLE}" werk-demo verdict "${CARD_ID}" 2>&1)
          vrc=$?
          set -e
          echo "$vout"
          case "$vrc" in
            0) echo "proven=true"  >> "$GITHUB_OUTPUT"; echo "[demo] witness PROVEN (gates+gathers+go for this patch) → landing." ;;
            2) echo "proven=false" >> "$GITHUB_OUTPUT"
               # #3519 (Wren pre-land) — a GO given but verdict=false is the dark-factory
               # WIP-limbo (#3520 bite: looked done, stayed WIP, WERK_EXIT=0). Flag it HELD so
               # outcome + witness-close shout it as a distinct terminal state — NOT a green
               # "presented". A clean present-only run (no go) is NOT limbo and stays presented.
               case "${GO}" in true|go|yes|GO) echo "held=true" >> "$GITHUB_OUTPUT" ;; esac
               miss=$(printf '%s' "$vout" | sed -n 's/.*witness missing: \(\[[^]]*\]\).*/\1/p')
               echo "held_reason=${miss:-[gates/gathers or go]}" >> "$GITHUB_OUTPUT" ;;
            *) echo "[demo] verdict error rc=$vrc"; exit "$vrc" ;;
          esac

      # ═══ land to prod — prod is a build of MAIN. Runs ONLY if the demo proved (go==true). ═══
      - name: merge
        id: merge
        # #3955 — an already-landed retry has no open PR to merge; deploy+accept
        # are the remaining land. Witness verdict still gated the go upstream.
        if: ${{ steps.demo.outputs.proven == 'true' && steps.provenround.outputs.already_landed != 'true' }}
        # werk-merge (#3175), via MCP. Resolves the OPEN PR for the current HEAD oid, squash-merges,
        # content-verifies. #3499: werk-merge no longer reads a demo witness — reaching this step
        # MEANS the in-run demo proved (the only-door is structural: this step is gated on proven).
        # #3517 — capture the trigger's landedCommit (werk-merge returns the landed origin/main sha
        # in content.text) and thread it forward to deploy. grep the 40-hex so it's robust to any
        # surrounding log text (no dependence on the exact MCP return shape). Empty → deploy REDs.
        # #3932 — print the reason BEFORE acting on the exit code. This is the only
        # step that captures a chorus-mcp-call.sh invocation into a variable. The
        # helper writes the verb's error text to STDOUT and exits 1, and steps run
        # under `bash -e`, so the shell died AT the assignment: the reason was
        # captured and then thrown away. That is the entirety of "Failure - Main
        # merge" with no explanation — #3911 three times, and #3928's land, where
        # the PR had already merged. The MCP is NOT dropping stderr: calling the
        # helper directly prints `JSON-RPC ERROR: ... stderr=werk-merge: <reason>`.
        run: |
          set +e
          LANDED="$(chorus-mcp-call.sh "${ROLE}" werk-merge "$(printf '{"role":"%s","card_id":%s}' "${ROLE}" "${CARD_ID}")")"
          MERGE_RC=$?
          set -e
          printf '%s\n' "$LANDED"
          if [ "$MERGE_RC" -ne 0 ]; then
            echo "   [fail] werk-merge exited ${MERGE_RC} — reason above (#3932: it used to be swallowed)" >&2
            exit "$MERGE_RC"
          fi
          LC="$(printf '%s' "$LANDED" | grep -oE '[0-9a-f]{40}' | tail -1)"
          echo "LANDED_COMMIT=${LC}" >> "$GITHUB_ENV"
          [ -n "$LC" ] || echo "   [warn] #3517: could not capture landedCommit from werk-merge output — deploy gate will RED on empty (claimed≠verified)" >&2

      - name: sync
        id: sync
        if: ${{ steps.demo.outputs.proven == 'true' }}
        # canonical ff-sync so SCRIPT-only changes go LIVE; SYNC_OK gates the "live" claim.
        # #3574: bare `merge --ff-only` FAILS on a DIRTY canonical (e.g. generated doc-coherence
        # churn) — and this step was advisory (warn + SYNC_OK=0) while deploy ran anyway → shipped
        # STALE binaries (the merged≠live root). Now: on ff failure, AUTO-RECOVER (`werk-sync recover`
        # = stash-dirty + ff) and re-verify canonical HEAD == origin/main before claiming SYNC_OK=1.
        run: |
          if [ -n "${CHORUS_HOME:-}" ] \
             && git -C "$CHORUS_HOME" fetch -q origin main 2>/dev/null \
             && git -C "$CHORUS_HOME" merge --ff-only origin/main >/dev/null 2>&1; then
            echo "   [ok] canonical ff-synced to origin/main"
            echo "SYNC_OK=1" >> "$GITHUB_ENV"
          elif [ -n "${CHORUS_HOME:-}" ] && command -v werk-sync >/dev/null 2>&1 \
             && werk-sync recover >/dev/null 2>&1 \
             && [ "$(git -C "$CHORUS_HOME" rev-parse HEAD 2>/dev/null)" = "$(git -C "$CHORUS_HOME" rev-parse origin/main 2>/dev/null)" ]; then
            echo "   [ok] canonical auto-recovered (stash-dirty + ff) → synced to origin/main (#3574)"
            echo "SYNC_OK=1" >> "$GITHUB_ENV"
          else
            echo "   [warn] canonical NOT synced even after recover (diverged?) — deploy will REFUSE to ship stale (#3574)" >&2
            echo "SYNC_OK=0" >> "$GITHUB_ENV"
          fi

      - name: deploy-canonical
        id: deploy_canonical
        if: ${{ steps.demo.outputs.proven == 'true' }}
        # target=canonical: prod is a build of MAIN. SELF-BUILDS from canonical@origin/main (#3222).
        # #3517 — pass the captured landedCommit so deploy's verify can gate deployed-commit==landedCommit
        # (the one-sha invariant proven at the verify, not via a risky checkout). Empty arg = RED.
        # #3574 — REFUSE to deploy from an un-synced canonical. Before: deploy ran regardless of
        # SYNC_OK → built+shipped pre-merge code (the merged≠live root, cost #3566/#3570 today).
        # SYNC_OK=0 here = canonical couldn't sync even after auto-recover → FAIL LOUD, don't ship stale.
        run: |
          if [ "${SYNC_OK:-0}" != "1" ]; then
            echo "::error::#3574: canonical not synced to origin/main (SYNC_OK=${SYNC_OK:-unset}) — REFUSING to deploy stale binaries. Fix canonical ('werk-sync recover') and re-land." >&2
            exit 1
          fi
          # #3955 — already-landed retry: merge was skipped so LANDED_COMMIT is empty;
          # the landed sha IS origin/main (tree-equality proven at proven-round).
          if [ -z "${LANDED_COMMIT}" ] && [ "${{ steps.provenround.outputs.already_landed }}" = "true" ]; then
            LANDED_COMMIT=$(git -C "${CHORUS_HOME}" rev-parse origin/main)
            echo "   [#3955] already-landed retry: landedCommit := origin/main ${LANDED_COMMIT}"
          fi
          # #3955 AC2 — the werk build lock is shared across roles; losing the race
          # was a hard fail at 60s (run 51). Bounded, NAMED retries instead.
          for attempt in 1 2 3; do
            out=$(chorus-mcp-call.sh "${ROLE}" werk-deploy "$(printf '{"role":"%s","card_id":%s,"target":"canonical","landedCommit":"%s"}' "${ROLE}" "${CARD_ID}" "${LANDED_COMMIT}")") && rc=0 || rc=$?
            echo "$out"
            if [ "$rc" = "0" ]; then break; fi
            case "$out" in
              *"holds the werk lock"*)
                if [ "$attempt" = "3" ]; then echo "::error::deploy-canonical: lock still held after 3 attempts (~3min) — failing NAMED" >&2; exit "$rc"; fi
                echo "   [#3955] build lock held (attempt $attempt/3) — waiting 90s for the peer build" ;;
              *) exit "$rc" ;;
            esac
            sleep 90
          done

      - name: accept
        id: accept
        if: ${{ steps.demo.outputs.proven == 'true' }}
        # #3311 GO=ACCEPT: the GO given at invoke IS the acceptance. werk-accept's DEC-048 authority
        # gate runs INSIDE the verb (ACCEPTER is the authorizing identity; a builder can't self-accept).
        run: DEPLOY_ROLE="${ACCEPTER}" werk-accept "${CARD_ID}" "${ROLE}"

      - name: outcome
        if: success()
        # Tell the truth about the terminal state — landed (proven) vs presented (not proven).
        run: |
          if [ "${{ steps.demo.outputs.proven }}" = "true" ]; then
            if [ "${SYNC_OK:-0}" = "1" ]; then
              echo "[landed] #${CARD_ID} merged + deployed + LIVE, accepted by ${ACCEPTER} (GO=accept)."
            else
              echo "[accepted, NOT yet live] #${CARD_ID} merged + accepted, but canonical did NOT ff-sync — run 'werk-sync recover'." >&2
            fi
          elif [ "${{ steps.demo.outputs.held }}" = "true" ]; then
            # #3519 (Wren pre-land) — LOUD WIP-limbo. A GO was given but the witness did NOT
            # prove it. Must NOT read as a green "presented". ::error:: annotates the run loudly;
            # witness-close records werk.held (distinct phase). This is HELD, not landed, not done.
            echo "::error ::[HELD] #${CARD_ID} — GO given but NOT landed. Witness missing: ${{ steps.demo.outputs.held_reason }}. Card STAYS WIP — this is NOT done. Record the missing gate/gather/go for THIS patch, then re-run." >&2
            # #3664 — STRUCTURED held sentinel (parallel to WERK_EXIT): the poll-time
            # reconcile keys on this exact machine contract, never on free-form log text.
            echo "WERK_HELD=held: witness missing ${{ steps.demo.outputs.held_reason }} for this patch (GO given, not proven)"
          else
            echo "[presented] #${CARD_ID} — variant up, present-only (no go). Re-invoke with go to land."
          fi

      # --- orchestrator witness close ---
      - name: witness-close
        if: success()
        run: |
          ts=$(($(date +%s)*1000))  # BSD date has no %3N (#3266)
          # #3519 (Wren pre-land) — THREE distinct terminal phases, not two. werk.held is the
          # go-given-but-not-proven WIP-limbo (#3520): it must be queryable as its OWN state,
          # never folded into werk.presented (which reads as a clean present-only run).
          if   [ "${{ steps.demo.outputs.proven }}" = "true" ]; then ev="werk.landed"; status="success"
          elif [ "${{ steps.demo.outputs.held }}"   = "true" ]; then ev="werk.held";    status="held"
          else ev="werk.presented"; status="success"; fi
          printf '{"ts":%s,"event":"%s","card_id":%s,"role":"%s","accepter":"%s","trace_id":"%s","status":"%s","held_reason":"%s","sync_ok":"%s"}\n' \
            "$ts" "$ev" "${CARD_ID}" "${ROLE}" "${ACCEPTER}" "${CHORUS_TRACE_ID}" "$status" "${{ steps.demo.outputs.held_reason }}" "${SYNC_OK:-0}" \
            >> "${CHORUS_HOME}/ops/logs/werk.jsonl" 2>/dev/null || true

      - name: witness-failed
        if: failure()
        run: |
          ts=$(($(date +%s)*1000))  # BSD date has no %3N (#3266)
          # #3664 — never a bare werk.failed again: name the step that failed (only one
          # can — the job halts on first non-zero exit). The rich child reason lives in
          # the per-RUN log + run record; this names where to look.
          step="unknown"
          [ "${{ steps.commit.outcome }}" = "failure" ] && step="commit"
          [ "${{ steps.push.outcome }}" = "failure" ] && step="push"
          [ "${{ steps.build.outcome }}" = "failure" ] && step="build"
          [ "${{ steps.test.outcome }}" = "failure" ] && step="test"
          [ "${{ steps.review.outcome }}" = "failure" ] && step="review"
          [ "${{ steps.deploy_werk.outcome }}" = "failure" ] && step="deploy-werk"
          [ "${{ steps.env_up.outcome }}" = "failure" ] && step="env-up"
          [ "${{ steps.demo.outcome }}" = "failure" ] && step="demo"
          [ "${{ steps.merge.outcome }}" = "failure" ] && step="merge"
          [ "${{ steps.sync.outcome }}" = "failure" ] && step="sync"
          [ "${{ steps.deploy_canonical.outcome }}" = "failure" ] && step="deploy-canonical"
          [ "${{ steps.accept.outcome }}" = "failure" ] && step="accept"
          printf '{"ts":%s,"event":"werk.failed","card_id":%s,"role":"%s","accepter":"%s","trace_id":"%s","status":"failed","failureReason":"step=%s"}\n' \
            "$ts" "${CARD_ID}" "${ROLE}" "${ACCEPTER}" "${CHORUS_TRACE_ID}" "$step" \
            >> "${CHORUS_HOME}/ops/logs/werk.jsonl" 2>/dev/null || true

# Stop-on-failure: GHA default — steps run in order, the job halts on first non-zero exit.
# The demo step's rc=0/2 are CLEAN (caught + mapped to `proven`); only a real error (rc=1)
# or a verb failure halts the job. merge→sync→deploy→accept are gated on proven — they run
# only when the in-run demo proved (go==true). No second invocation, no witness wall.
