name: athena

# athena — THE MODEL pipeline, sibling to werk.yml (#3561).
#
# werk.yml governs CODE: commit → build → test → demo → merge.
# athena.yml governs THE MODEL: shape → make → deploy → validate.
#
# Jeff, 2026-08-21: "i think we can do an athena-model, athena-make, athena-deploy
# pipeline with act as a runner right now." He was right — every verb already
# existed. What was missing was the runner, so every athena step was a role
# hand-chaining shell. That absence is why `streams` had a domain node with no
# vocabulary and a 200-line ring buffer in /tmp instead of a store: the governed
# path was unautomated, so code got written around it.
#
# ONE JOB, ONE RUN — same contract as werk.yml. No forks, no cross-run witness.
#
# #4186 (Jeff, 2026-09-16: "athena and werk are conjoined twins we need to separate
# them"): the LAND legs joined this file as the `land` job (target=canonical). Until
# then the model rode inside werk-deploy's land step, which restarted athena-make
# and seeded rows against it before it answered (POST → 0 on six lands across
# #4175 and #4179). #4177: the land EVENT runs this file — chorus-mcp's werk-merge
# case starts it detached when the landed sha carried model or seed sources.
# werk.yml names no model step.
#
# THE STEP THAT EARNS THIS FILE IS deploy-served, NOT deploy. A model can deploy
# and never be SERVED: athena-make answers from the snapshot it loaded at startup,
# so a class can sit in Fuseki and be absent from the API indefinitely (#3577).
# That gap hit the team four times in two days. deploy-served FAILS the run when a
# class deployed but never appeared, and names it — never silent.

on:
  workflow_dispatch:
    inputs:
      class:
        description: "Model class this run is about (e.g. StreamEvent). The trace key end-to-end. Not used by target=canonical."
        required: false
        type: string
        default: ""
      target:
        description: "class (default: the per-class prove run) | canonical (the land: the live store attests the landed sha; scope, validate, deploy, serve, seed, prove). No variant target: the demo env reads the live store (Jeff, 2026-09-16)."
        required: false
        type: string
        default: "class"
      landed_commit:
        description: "target=canonical: the merged origin/main sha the store must attest (empty = ungated hand run)"
        required: false
        type: string
        default: ""
      parent_trace:
        description: "#4177: the trace of the run that triggered this one (a werk land). Recorded as parent on athena.pipeline.started; this run still mints its own trace."
        required: false
        type: string
        default: ""
      role:
        description: "Role whose werk holds the model change (kade / silas / wren)."
        required: true
        type: string
      card_id:
        description: "Card the model change belongs to — attribution on every emitted event."
        required: false
        type: string
        default: ""

jobs:
  athena:
    if: ${{ inputs.target == 'class' }}
    runs-on: macos-latest
    # CHORUS_HOME / CHORUS_WERK_BASE / PATH inherited from the local shell act runs
    # in (chorus-env-setup.sh provides them). The workflow MUST NOT hardcode them.
    env:
      CLASS: ${{ inputs.class }}
      ROLE: ${{ inputs.role }}
      CARD_ID: ${{ inputs.card_id }}
      # Same declaration werk.yml makes, same reason: act sets CI=true, which the
      # #3615 membrane reads as a build context and refuses live-spine writes. This
      # is a prod-adjacent runner whose verbs legitimately emit real events.
      CHORUS_CONTEXT: prod
      # Resolve the athena verbs to THIS tree's build first, falling back to the
      # deployed copies in ~/.chorus/bin. A pre-land run must grade the artifact
      # the card ships, not the one already installed — otherwise the pipeline
      # reports on a binary the change never touched, which is the built-vs-
      # deployed confusion that put a retired name in front of Jeff (#3885).
      ATHENA_PATH_PREFIX: "platform/services/athena-make/target/release:platform/services/athena-model/target/release:platform/services/athena-deploy/target/release"

    steps:
      - name: shared-trace
        # One trace for the whole run, propagated via $GITHUB_ENV so every verb
        # subprocess inherits CHORUS_TRACE_ID. Mirrors werk.yml exactly — a model run
        # and a code run must be joinable on the same key.
        run: |
          trace="$(date +%s%N)-$$"
          echo "CHORUS_TRACE_ID=$trace" >> "$GITHUB_ENV"
          # act -self-hosted runs in a cache dir with no checkout, so GITHUB_WORKSPACE
          # is empty of the repo. werk.yml solves this by deriving the werk from
          # CHORUS_WERK_BASE/<role>-<card>; athena.yml uses the same derivation so a
          # pre-land run grades the card's tree, and falls back to canonical when
          # there is no card (a run against main).
          root="${CHORUS_WERK_BASE:-/Users/jeffbridwell/CascadeProjects/chorus-werk}/${ROLE}-${CARD_ID}"
          [ -n "${CARD_ID}" ] && [ -d "$root" ] || root="${CHORUS_ROOT:-$PWD}"
          echo "ATHENA_ROOT=$root" >> "$GITHUB_ENV"
          echo "grading tree: $root"
          prefix=""
          IFS=':' read -ra dirs <<< "$ATHENA_PATH_PREFIX"
          for d in "${dirs[@]}"; do
            [ -d "$root/$d" ] && prefix="${prefix}${root}/${d}:"
          done
          echo "PATH=${prefix}${PATH}" >> "$GITHUB_ENV"
          echo "verb path prefix: ${prefix:-<none — using deployed binaries>}"
          echo "minted trace=$trace for class=${CLASS} role=${ROLE} card=${CARD_ID:-<none>}"
          "$root/platform/scripts/chorus-log" athena.run.started "${ROLE}" \
            class="${CLASS}" card="${CARD_ID:-none}" trace="$trace" || true

      - name: shape
        # The TBox is written by athena-model BEFORE this pipeline runs — the pen is
        # interactive by design, refusing rather than defaulting, because a default is
        # a judgment nobody made (#3718). This step proves the shape exists and has a
        # floor, so a run cannot proceed on a class that declares nothing.
        run: |
          set -euo pipefail
          hit=$(grep -rl "chorus:${CLASS}Shape" "${ATHENA_ROOT}/roles" 2>/dev/null | head -1 || true)
          if [ -z "$hit" ]; then
            echo "athena: no shape for ${CLASS} — a class with no shape validates nothing" >&2
            exit 1
          fi
          echo "shape: ${CLASS}Shape found in $hit"
          "${ATHENA_ROOT}/platform/scripts/chorus-log" athena.shape.proven "${ROLE}" \
            class="${CLASS}" card="${CARD_ID:-none}" file="$hit" || true

      - name: make
        # Generate the surfaces from the model. athena-make makes AND serves — one
        # binary, decided on #3561 by reading the dispatch (ten generate-* verbs, one
        # serve; splitting costs a crate, a LaunchAgent and a deploy path).
        run: |
          set -euo pipefail
          athena-make generate --class "${CLASS}" > /dev/null
          echo "make: routes generated for ${CLASS}"
          "${ATHENA_ROOT}/platform/scripts/chorus-log" athena.made "${ROLE}" \
            class="${CLASS}" card="${CARD_ID:-none}" || true

      - name: deploy
        # The governed way the model reaches Fuseki. athena-deploy riot-validates every
        # TTL BEFORE loading and refuses a parse failure rather than deploying a broken
        # graph — proven live 2026-08-21, when a missing `@prefix sh:` was caught here
        # and blocked the load instead of corrupting the store.
        run: |
          set -euo pipefail
          # The write door needs its credential (#3566/#3611). athena-deploy loads
          # over HTTP and 401s without it; act starts from a stripped environment,
          # so the credential must be sourced here rather than assumed inherited.
          # fuseki-auth.sh exports without ever echoing the value.
          # shellcheck disable=SC1091
          source "${ATHENA_ROOT}/platform/scripts/fuseki-auth.sh"
          if [ -z "${FUSEKI_ADMIN_PASSWORD:-}" ]; then
            echo "athena: no Fuseki write credential — the load would 401 at the door." >&2
            echo "  Expected at \$FUSEKI_WRITE_ENV or ~/.gathering/data/fuseki-write.env (owner: Silas/ops)." >&2
            exit 1
          fi
          CHORUS_ROOT="${ATHENA_ROOT}" athena-deploy 2>&1 | tail -20
          echo "deploy: model set loaded"

      - name: deploy-served
        # #3577 — THE GATE. Deployed is not served. Bounce the service, then PROVE the
        # class answers. Failing here names the class, rather than reporting a green
        # deploy over an API that never changed.
        run: |
          set -euo pipefail
          launchctl kickstart -k "gui/$(id -u)/com.chorus.athena-make" 2>/dev/null || true
          for _ in $(seq 1 30); do
            curl -sf -m 5 http://localhost:3360/domains >/dev/null 2>&1 && break
            sleep 1
          done
          # #3733 — the route is DATA, read from athena-make's own discovery
          # document, never guessed. The lowercase+"s" guess this replaced is the
          # same name-heuristic defect #3733 retired in reconcile: it cannot tell
          # "the class is not served" from "my pluralisation was wrong", so a
          # served class with an irregular route reads as a deploy failure and an
          # absent one can read as a typo. Reading the registry separates them.
          disco="$(curl -sf -m 10 http://localhost:3360/ 2>/dev/null || true)"
          if [ -z "$disco" ]; then
            echo "athena: discovery document unavailable on :3360 — cannot establish which routes are served" >&2
            exit 1
          fi
          route="$(printf '%s' "$disco" | tr ',' '\n' \
            | grep -A2 "\"kind\": \"${CLASS}\"" \
            | grep -o '"collection": "[^"]*"' | head -1 | cut -d'"' -f4)"
          if [ -z "$route" ]; then
            echo "athena: ${CLASS} DEPLOYED BUT NOT SERVED — it appears in no route of the discovery document." >&2
            echo "  The model is in the store and the API cannot see it (#3577)." >&2
            echo "  This is not a naming guess: the served set was READ, and ${CLASS} is not in it." >&2
            exit 1
          fi
          if ! curl -sf -m 10 "http://localhost:3360${route}" >/dev/null 2>&1; then
            echo "athena: ${CLASS} is declared at ${route} but that route does not answer." >&2
            bare="/$(basename "$route")"
            if curl -sf -m 10 "http://localhost:3360${bare}" >/dev/null 2>&1; then
              echo "  ${bare} DOES answer. The service advertises one path and serves another:" >&2
              echo "  discovery says ${route}, the router only handles ${bare}." >&2
              echo "  DECLARED != SERVED inside a single binary — anything that reads the" >&2
              echo "  discovery document to find a route gets a 404 (#3577 family)." >&2
            fi
            exit 1
          fi
          echo "deploy-served: ${route} answers — ${CLASS} is live, not merely landed"
          "${ATHENA_ROOT}/platform/scripts/chorus-log" athena.served "${ROLE}" \
            class="${CLASS}" card="${CARD_ID:-none}" route="${route}" || true

      - name: validate
        # The conformance sweep over the LIVE graph (ADR-058): rows ARE violations,
        # counts uncapped, a never-red check reports itself loudly. Runs AFTER
        # deploy-served on purpose — validating a graph the API cannot serve would
        # pass while Jeff still sees nothing.
        run: |
          set -euo pipefail
          bash "${ATHENA_ROOT}/platform/scripts/athena-validate.sh" 2>&1 | tail -30
          "${ATHENA_ROOT}/platform/scripts/chorus-log" athena.validated "${ROLE}" \
            class="${CLASS}" card="${CARD_ID:-none}" || true

      - name: traceable
        # A run that cannot be reconstructed from the spine is not legible, whatever
        # its exit code. Jeff, 2026-08-21, asked whether a trace could be pulled for an
        # athena run: it could not — five steps minted one trace and exactly ONE of
        # them emitted, so the trace existed and answered nothing.
        #
        # This step is the gate on that: it counts the run's own events and FAILS if
        # the story has holes. It cannot pass vacuously — zero events is the loudest
        # failure, not a silent skip.
        run: |
          set -euo pipefail
          spine="${CHORUS_SPINE:-$HOME/.chorus/chorus.log}"
          if [ ! -r "$spine" ]; then
            echo "athena: spine not readable at $spine — this run left no legible record" >&2
            exit 1
          fi
          n=$(grep -c "${CHORUS_TRACE_ID}" "$spine" || true)
          want=5
          if [ "${n:-0}" -lt "$want" ]; then
            echo "athena: run emitted ${n:-0} event(s) for trace ${CHORUS_TRACE_ID}, expected >= ${want}." >&2
            echo "  A step ran without emitting. The run is unreconstructable from the spine." >&2
            exit 1
          fi
          echo "traceable: ${n} events on ${CHORUS_TRACE_ID} — the run can be replayed from the spine"

      - name: outcome
        if: success()
        run: |
          echo "athena: ${CLASS} shaped, made, deployed, SERVED and validated"

  # #4186 — THE LAND LEGS (target=canonical). Model and seed sources that a land
  # merged are deployed, served, seeded and proven HERE, not inside werk-deploy.
  #   scope     which model / seed sources the landed diff touched (none → said out loud)
  #   validate  riot on every changed TTL; absent riot REFUSES (never a silent unvalidated deploy)
  #   deploy    athena-deploy-model.sh — additive per-subject merge (+ INSTANCE_SET)
  #   serve     athena-serve — kickstart athena-make, wait for /health healthy (never launchd liveness)
  #   seed      athena-model seed --post through the door, as the land role, only after serve
  #   prove     store attests deployedFromCommit == landed; athena-validate as a RATCHET
  #             (issues may never rise; the floor only goes down — Jeff: "get and stay at 0")
  # Patch 2: target=werk (variant store + rows out of env_up) and a chorus_athena MCP verb.
  # Patch 3: Rust athena-deploy at parity with the bash engine; the bash retires.
  land:
    if: ${{ inputs.target == 'canonical' }}
    runs-on: macos-latest
    env:
      CARD_ID: ${{ inputs.card_id }}
      ROLE: ${{ inputs.role }}
      TARGET: ${{ inputs.target }}
      LANDED: ${{ inputs.landed_commit }}
      CHORUS_CONTEXT: prod
    steps:
      - name: trace
        # #4195 (Jeff: "i want to see an athena trace that is just athena"). This run
        # mints its OWN trace, always. If a caller (the land trigger, #4177) handed one
        # in, it is recorded as the parent on athena.pipeline.started, never reused, so
        # a werk trace holds no athena event and an athena trace holds nothing else.
        # CHORUS_LOG is resolved by path: chorus-log is not on a login shell's PATH, and
        # before this every emit in this job failed silently behind `|| true` (measured
        # 2026-09-16 18:00–18:06: a full canonical run left zero athena.* events).
        run: |
          set -euo pipefail
          parent="${{ inputs.parent_trace }}"
          [ -n "$parent" ] || parent="${CHORUS_TRACE_ID:-}"
          trace="athena-$(date +%s%N)-$$"
          log="${CHORUS_HOME}/platform/scripts/chorus-log"
          [ -x "$log" ] || { echo "::error::athena: no spine emitter at $log — a run that cannot emit does not run" >&2; exit 1; }
          # CHORUS_CARD_ID rides every subprocess emit (chorus-log's env bridge, #2857), so the
          # deploy script's and the seed's events carry the card too: the by-card view of the
          # trace reader shows the whole athena run, not 4 of 159 (measured 2026-09-17 06:59).
          { echo "CHORUS_TRACE_ID=$trace"; echo "ATHENA_PARENT_TRACE=$parent"; echo "CHORUS_LOG=$log"; echo "CHORUS_CARD_ID=${CARD_ID}"; } >> "$GITHUB_ENV"
          echo "trace: $trace (parent: ${parent:-none})"

      - name: resolve
        id: resolve
        # One place decides WHERE: the live store, the com.chorus.athena-make service,
        # the canonical tree. There is no variant store: every demo reads the live one.
        run: |
          set -euo pipefail
          case "$TARGET" in
            canonical)
              ROOT="${CHORUS_HOME}"
              STORE="${CHORUS_FUSEKI_BASE:-http://localhost:3030}/pods"
              API="${ATHENA_MAKE_URL:-http://localhost:3360}"
              LABEL="com.chorus.athena-make" ;;
            *) echo "::error::athena: the land target is canonical (the demo env reads the live store; there is no variant target), got '$TARGET'" >&2; exit 2 ;;
          esac
          [ -d "$ROOT" ] || { echo "::error::athena: tree $ROOT does not exist" >&2; exit 2; }
          { echo "root=$ROOT"; echo "store=$STORE"; echo "api=$API"; echo "label=$LABEL"; echo "base=${CHORUS_FUSEKI_BASE:-http://localhost:3030}"; } >> "$GITHUB_OUTPUT"
          echo "athena target=$TARGET root=$ROOT store=$STORE api=$API label=$LABEL"

      - name: scope
        id: scope
        # `athena-deploy scope` is the ONE definition of model / seed sources (shared/model_scope.rs).
        # canonical: the landed commit's diff. werk: the card's diff against origin/main, for the
        # record only — a fresh variant store always gets the WHOLE model set and all the rows.
        run: |
          set -euo pipefail
          ROOT="${{ steps.resolve.outputs.root }}"
          [ -n "$LANDED" ] && RANGE="${LANDED}^..${LANDED}" || RANGE="HEAD~1..HEAD"
          LIST=$(athena-deploy scope "$ROOT" "$RANGE")
          MODEL=$(printf '%s\n' "$LIST" | grep '^model|' | cut -d'|' -f2- || true)
          SEED=$(printf '%s\n' "$LIST" | grep '^seed|' | cut -d'|' -f2- || true)
          printf 'range: %s\nmodel files:\n%s\nseed files:\n%s\n' "$RANGE" "${MODEL:-  (none)}" "${SEED:-  (none)}"
          { echo "model<<EOF"; echo "$MODEL"; echo "EOF"; echo "seed<<EOF"; echo "$SEED"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          if [ "$TARGET" = "canonical" ] && [ -z "$MODEL$SEED" ]; then
            echo "nothing=true" >> "$GITHUB_OUTPUT"
            echo "athena: the landed diff touches no model or seed source — nothing to deploy (explicit absence, not a pass)"
          fi
          "$CHORUS_LOG" athena.pipeline.started "$ROLE" card="$CARD_ID" target="$TARGET" landed="${LANDED:-}" parent="${ATHENA_PARENT_TRACE:-none}" model="$(printf '%s' "$MODEL" | grep -c . || true)" seed="$(printf '%s' "$SEED" | grep -c . || true)"

      - name: validate
        if: ${{ steps.scope.outputs.nothing != 'true' && steps.scope.outputs.model != '' }}
        run: |
          set -euo pipefail
          ROOT="${{ steps.resolve.outputs.root }}"
          if ! command -v riot >/dev/null 2>&1; then
            if [ "${ALLOW_UNVALIDATED:-0}" = "1" ]; then echo "::warning::athena: riot absent, ALLOW_UNVALIDATED=1 — proceeding LOUDLY unvalidated"; exit 0; fi
            echo "::error::athena: riot is not installed — REFUSING to deploy an unvalidated model (ALLOW_UNVALIDATED=1 overrides, loudly)" >&2; exit 1
          fi
          rc=0
          while IFS= read -r f; do [ -n "$f" ] || continue
            case "$f" in *.ttl) riot --validate "$ROOT/$f" && echo "valid: $f" || { echo "::error::athena: riot rejects $f" >&2; rc=1; } ;; esac
          done <<< "${{ steps.scope.outputs.model }}"
          exit $rc

      - name: deploy
        # only when the land carried model sources
        if: ${{ steps.scope.outputs.nothing != 'true' && steps.scope.outputs.model != '' }}
        run: |
          set -euo pipefail
          ROOT="${{ steps.resolve.outputs.root }}"; STORE="${{ steps.resolve.outputs.store }}"
          "$CHORUS_LOG" athena.deploy.started "$ROLE" card="$CARD_ID" target="$TARGET"
          # shellcheck disable=SC1091
          source "${CHORUS_HOME}/platform/scripts/fuseki-auth.sh"
          CHORUS_ROOT="$ROOT" FUSEKI_GSP="$STORE/data" FUSEKI_QUERY="$STORE/query" FUSEKI_UPDATE="$STORE/update" \
            CHORUS_TRACE_ID="${CHORUS_TRACE_ID:-}" DEPLOY_ROLE="$ROLE" CHORUS_ROLE="$ROLE" \
            bash "${CHORUS_HOME}/platform/scripts/athena-deploy-model.sh"

      - name: serve
        # athena-make reads the shapes at boot, so a model change is served only after a
        # restart (kickstart), and rows may post only after /health says healthy (the
        # six-land defect).
        if: ${{ steps.scope.outputs.nothing != 'true' && steps.scope.outputs.model != '' }}
        run: |
          set -euo pipefail
          DEPLOY_ROLE="$ROLE" athena-serve "${{ steps.resolve.outputs.label }}" "${{ steps.resolve.outputs.api }}/health" --kickstart --timeout 90

      - name: seed
        if: ${{ steps.scope.outputs.nothing != 'true' }}
        run: |
          set -euo pipefail
          ROOT="${{ steps.resolve.outputs.root }}"; API="${{ steps.resolve.outputs.api }}"; STORE="${{ steps.resolve.outputs.store }}"
          # the store must be answering before a single row is posted
          DEPLOY_ROLE="$ROLE" athena-serve "${{ steps.resolve.outputs.label }}" "$API/health" --timeout 30
          TOKEN=$(bash "$ROOT/platform/scripts/chorus-identity-token" "$ROLE")
          [ -n "$TOKEN" ] || { echo "::error::athena: no identity token for $ROLE — rows NOT posted" >&2; exit 1; }
          SEED_BIN="${HOME}/.chorus/bin/athena-model"; [ -x "$SEED_BIN" ] || SEED_BIN=athena-model
          HEAD_SHA="$LANDED"
          CHORUS_ROOT="$ROOT" CHORUS_FUSEKI="$STORE" CHORUS_IDENTITY_TOKEN="$TOKEN" CHORUS_LANDED_COMMIT="$HEAD_SHA" \
            "$SEED_BIN" seed --post --api "$API" --unowned load
          "$CHORUS_LOG" athena.seed.completed "$ROLE" card="$CARD_ID" target="$TARGET"

      - name: prove
        if: ${{ steps.scope.outputs.nothing != 'true' }}
        # canonical: the store attests the landed sha, and the sweep is a RATCHET whose
        # baseline lives IN THE STORE (<urn:chorus:model-validate> vocab:validateIssues), not
        # in a file on one Mac. #4187: its OWN subject. It used to sit on
        # <urn:chorus:model-deploy>, whose stamp is rewritten with DELETE WHERE { <s> ?p ?o }
        # on every deploy, so every deploy wiped the baseline and the ratchet restarted
        # (measured 2026-09-17: 1,204 at 07:56 → "no baseline" → 10,684 at 12:52). werk: the sweep runs against the variant store and is held
        # to the canonical baseline (a card may not add gaps); the baseline is never written.
        run: |
          set -euo pipefail
          STORE="${{ steps.resolve.outputs.store }}"; CANON="${CHORUS_FUSEKI_BASE:-http://localhost:3030}/pods"
          # shellcheck disable=SC1091
          source "${CHORUS_HOME}/platform/scripts/fuseki-auth.sh"
          AUTH=(); [ -n "${FUSEKI_ADMIN_PASSWORD:-}" ] && AUTH=(-u "${FUSEKI_ADMIN_USER:-admin}:${FUSEKI_ADMIN_PASSWORD}")
          rc=0
          if [ "$TARGET" = "canonical" ] && [ -n "${{ steps.scope.outputs.model }}" ] && [ -n "$LANDED" ]; then
            STAMP=$(curl -s -m 10 "${AUTH[@]}" "$STORE/query" --data-urlencode 'query=SELECT ?c WHERE { GRAPH <urn:chorus:ontology> { <urn:chorus:model-deploy> <urn:chorus:vocab#deployedFromCommit> ?c } }' -H 'Accept: text/csv' | sed -n 2p | tr -d '"\r')
            if [ "$STAMP" = "$LANDED" ]; then echo "stamp: store attests $STAMP == landed"; else echo "::error::athena: store attests '$STAMP', landed is '$LANDED' — the model deploy ran but the store does not say so" >&2; rc=1; fi
          fi
          OUT=$(ATHENA_VALIDATE_NUDGE=0 FUSEKI_QUERY="$STORE/query" ATHENA_VALIDATE_REPORT=/dev/null bash "${CHORUS_HOME}/platform/scripts/athena-validate.sh" 2>&1 || true)
          N=$(printf '%s\n' "$OUT" | grep -oE '^graph-summary\|[0-9]+\|' | cut -d'|' -f2 | tail -1)
          if [ -z "$N" ]; then
            echo "::error::athena-validate reported no count (unmeasured store?) — refusing to call the graph proven" >&2; printf '%s\n' "$OUT" | tail -5; rc=1
          else
            BASE=$(curl -s -m 10 "${AUTH[@]}" "$CANON/query" --data-urlencode 'query=SELECT ?n WHERE { GRAPH <urn:chorus:ontology> { <urn:chorus:model-validate> <urn:chorus:vocab#validateIssues> ?n } }' -H 'Accept: text/csv' | sed -n 2p | tr -d '"\r')
            [ -n "$BASE" ] || { BASE="$N"; echo "athena-validate: no baseline in the store yet; this run sets it to $N"; }
            if [ "$N" -gt "$BASE" ]; then echo "::error::athena-validate: $N issues, baseline $BASE — this ${TARGET} ADDED gaps" >&2; rc=1
            else
              echo "athena-validate ($TARGET): $N issues (baseline $BASE → $N)"
              if [ "$TARGET" = "canonical" ]; then
                curl -s -m 10 "${AUTH[@]}" -o /dev/null -w 'baseline write http %{http_code}\n' "$CANON/update" -H 'Content-Type: application/sparql-update' \
                  --data-binary "DELETE WHERE { GRAPH <urn:chorus:ontology> { <urn:chorus:model-validate> <urn:chorus:vocab#validateIssues> ?o } }; INSERT DATA { GRAPH <urn:chorus:ontology> { <urn:chorus:model-validate> <urn:chorus:vocab#validateIssues> $N } }"
              fi
            fi
          fi
          echo "issues=${N:-unmeasured}" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: complete
        # #4177 — the run's last word is emitted on EVERY run, including one with nothing
        # to deploy (verdict=noop) and one whose prove leg went red (verdict=fail). Before
        # this the emit lived inside prove, so a no-op run left one event and the
        # traceable floor of 2 turned it red (cold eyes on #4195; live 2026-09-17 11:17).
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ "${{ steps.scope.outputs.nothing }}" = "true" ]; then verdict=noop
          elif [ "${{ steps.prove.outcome }}" = "success" ]; then verdict=pass
          else verdict=fail; fi
          "$CHORUS_LOG" athena.pipeline.completed "$ROLE" card="$CARD_ID" target="$TARGET" verdict="$verdict" issues="${{ steps.prove.outputs.issues }}"

      - name: traceable
        # #4195 — the run counts its own events on its trace and refuses when a leg ran
        # without leaving a record. Zero events is the loudest failure, never a pass.
        # The floor is the legs that ran: started + completed, +1 for a seed leg, +2 for
        # a model leg (deploy.started and athena-serve's ready). Negative proofs live in
        # athena-deploy's prove-trace tests and platform/tests/4195-athena-trace.bats.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          want=2
          [ -n "${{ steps.scope.outputs.seed }}" ] && want=$((want+1))
          [ -n "${{ steps.scope.outputs.model }}" ] && want=$((want+2))
          athena-deploy prove-trace "$CHORUS_TRACE_ID" "$want" --spine "${CHORUS_SPINE:-$HOME/.chorus/chorus.log}"
